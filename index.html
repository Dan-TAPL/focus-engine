            </div>
            {/* Tabs */}
            <div style={{ maxWidth: 980, margin: "0 auto", padding: "0 24px", display: "flex", alignItems: "flex-end", justifyContent: "space-between" }}>
              {steps.map((s, i) => {
                const active = step === i + 1, done = step > i + 1;
                return (
                  <button key={i} onClick={() => setStep(i + 1)} style={{
                    padding: "10px 20px", border: "none", cursor: "pointer",
                    background: active ? (i === 3 ? "#0891B2" : C.red) : "transparent",
                    color: active ? "white" : done ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.45)",
                    ...lbl, fontSize: 11, display: "flex", alignItems: "center", gap: 8, borderRadius: "4px 4px 0 0", transition: "all 0.15s",
                  }}>
                    <span style={{ width: 20, height: 20, borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 10, background: active ? "rgba(255,255,255,0.25)" : done ? C.red : "rgba(255,255,255,0.15)" }}>
                      {done ? "✓" : i + 1}
                    </span>
                    {s}
                  </button>
                );
              })}
              <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
                <input ref={csvInputRef} type="file" accept=".csv" style={{ display: "none" }} onChange={importCSV} />
                <button onClick={() => setThemeMode(m => m === "dark" ? "light" : "dark")} title="Toggle light/dark mode" style={{ background: "rgba(255,255,255,0.12)", color: "white", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 4, padding: "6px 12px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>{themeMode === "dark" ? "☀" : "🌙"}</button>
                <button onClick={() => csvInputRef.current && csvInputRef.current.click()} style={{ background: "rgba(255,255,255,0.12)", color: "white", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 4, padding: "6px 14px", cursor: "pointer", fontWeight: 700, fontSize: 10, textTransform: "uppercase" }}>&#8593; Import CSV</button>
                <button onClick={exportCSV} style={{ background: "rgba(255,255,255,0.12)", color: "white", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 4, padding: "6px 14px", cursor: "pointer", fontWeight: 700, fontSize: 10, textTransform: "uppercase" }}>&#8595; Export CSV</button>
              </div>
            </div>
          </div>

          <div style={{ maxWidth: 980, margin: "0 auto", padding: "28px 24px 0" }}>

            {/* ════════════════════════════════
                STEP 1 — BRAIN DUMP
            ════════════════════════════════ */}
            {step === 1 && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                  <h2 style={{ color: T.text, ...lbl, fontSize: 20 }}>Brain Dump</h2>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    {saved && tasks.some(t => t.text) && (
                      <span style={{ fontSize: 11, color: T.textDim, fontStyle: "italic" }}>✓ Session restored</span>
                    )}
                    <button onClick={() => { if (window.confirm("Clear your session and start fresh?")) clearSession(); }}
                      style={{ background: "transparent", color: T.textDim, border: "1px solid " + T.border, borderRadius: 4, padding: "5px 12px", cursor: "pointer", ...lbl, fontSize: 9 }}>
                      ✕ Clear Session
                    </button>
                  </div>
                </div>
                <p style={{ color: T.textMid, fontSize: 14, lineHeight: 1.6, marginBottom: 20 }}>
                  List every task you could possibly do today or this week — don't filter, don't judge. Empty your brain first, add time estimates after.
                </p>
                <div style={{ background: T.availBg, borderRadius: 8, overflow: "hidden", boxShadow: "0 4px 24px rgba(0,0,0,0.3)", border: "1px solid " + T.border }}>
                  <div style={{ display: "grid", gridTemplateColumns: "44px 1fr 140px", background: C.purple, padding: "10px 16px", color: "white", ...lbl, fontSize: 10 }}>
                    <span>#</span><span>Task</span><span>Est. (mins)</span>
                  </div>
                  {tasks.map((task, idx) => {
                    const done = completedTaskIds.has(task.id);
                    return (
                    <div key={task.id} style={{ display: "grid", gridTemplateColumns: "44px 1fr 140px", borderBottom: "1px solid " + C.border, background: idx % 2 === 0 ? T.surfaceAlt : T.surfaceHover, alignItems: "center", opacity: done ? 0.4 : 1, transition: "opacity 0.15s" }}>
                      <div style={{ padding: "8px 0 8px 16px", ...lbl, fontSize: 11, color: task.text ? T.textNum : T.textFaint }}>{task.id}</div>
                      <input value={task.text} onChange={e => updateTask(task.id, "text", e.target.value)} placeholder={"Task " + task.id + "..."}
                        style={{ border: "none", background: "transparent", padding: "9px 12px", fontSize: 13, color: T.text, outline: "none", width: "100%", textDecoration: done ? "line-through" : "none" }} />
                      <div style={{ padding: "6px 16px 6px 0" }}>
                        <input type="number" min="1" value={task.mins} onChange={e => updateTask(task.id, "mins", e.target.value)} placeholder="e.g. 15"
                          style={{ border: "1.5px solid " + (task.mins ? T.inputBorder : T.border), borderRadius: 4, padding: "5px 8px", fontSize: 12, color: T.text, width: 90, outline: "none", background: task.mins ? T.inputBg : T.surfaceAlt }} />
                      </div>
                    </div>
                    );
                  })}
                </div>
                <div style={{ marginTop: 20, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ color: T.textDim, fontSize: 13 }}>{filled.length} task{filled.length !== 1 ? "s" : ""} entered</span>
                  <button onClick={() => setStep(2)} disabled={!filled.length} style={{ ...btnPrimary, opacity: filled.length ? 1 : 0.4, cursor: filled.length ? "pointer" : "not-allowed" }}>Categorise →</button>
                </div>
              </div>
            )}

            {/* ════════════════════════════════
                STEP 2 — CATEGORISE
            ════════════════════════════════ */}
            {step === 2 && (
              <div>
                <h2 style={{ color: T.text, ...lbl, fontSize: 20, marginBottom: 6 }}>Categorise</h2>

                {/* Mode selector */}
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
                  <span style={{ color: T.textMid, fontSize: 12 }}>Categorise by:</span>
                  {["time", "priority"].map(m => (
                    <button key={m} onClick={() => setCatMode(m)} style={{
                      padding: "6px 16px", borderRadius: 4, cursor: "pointer", ...lbl, fontSize: 10,
                      background: catMode === m ? C.red : "transparent",
                      color: catMode === m ? "white" : T.textMid,
                      border: catMode === m ? "none" : "1.5px solid " + T.border,
                    }}>{m === "time" ? "⏱ Time" : "🎯 Time & Priority"}</button>
                  ))}
                </div>

                {/* Priority tagging panel — shown when mode=priority */}
                {catMode === "priority" && (
                  <div style={{ background: T.surfaceAlt, borderRadius: 10, border: "1px solid " + T.border, padding: 16, marginBottom: 20 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                      <span style={{ ...lbl, fontSize: 10, color: T.textMid }}>Tag each task with its Eisenhower priority</span>

                    </div>
                    {/* Quad legend — sticky so it stays visible while scrolling task list */}
                    <div style={{ position: "sticky", top: 0, zIndex: 10, background: T.stickyBg, backdropFilter: "blur(6px)", borderRadius: 8, padding: "8px 0 10px", marginBottom: 14 }}>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                        {activeQuads.map(q => (
                          <div key={q.id} style={{ display: "flex", alignItems: "center", gap: 5, background: q.bg, border: "1px solid " + q.border, borderRadius: 4, padding: "4px 10px" }}>
                            <div style={{ width: 8, height: 8, borderRadius: "50%", background: q.color }} />
                            <span style={{ fontSize: 11, color: q.color, fontWeight: 700 }}>{q.short}</span>
                            <span style={{ fontSize: 10, color: T.textDim }}>— {q.label}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    {/* Task tagging rows */}
                    {filled.map(task => {
                      const bkt = getBucket(getBucketId(parseInt(task.mins)));
                      const q   = quadOf(task.quad);
                      return (
                        <div key={task.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid " + T.tagRowBorder }}>
                          <span style={{ ...lbl, fontSize: 10, color: T.textNum, minWidth: 20 }}>{task.id}.</span>
                          <span style={{ fontSize: 13, color: T.text, flex: 1 }}>{task.text}</span>
                          {task.mins && <span style={{ ...lbl, fontSize: 9, color: bkt.color, background: bkt.bg, padding: "2px 6px", borderRadius: 3, flexShrink: 0 }}>{task.mins}m</span>}
                          <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                            {activeQuads.map(qopt => (
                              <button key={qopt.id} onClick={() => updateTask(task.id, "quad", task.quad === qopt.id ? "" : qopt.id)} style={{
                                padding: "3px 8px", borderRadius: 3, cursor: "pointer", ...lbl, fontSize: 8,
                                background: task.quad === qopt.id ? qopt.color : "transparent",
                                color: task.quad === qopt.id ? "white" : qopt.color,
                                border: "1.5px solid " + qopt.color,
                                transition: "all 0.15s",
                              }}>{qopt.id}</button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* View toggle when mode=priority */}
                {catMode === "priority" && (
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                    <span style={{ color: T.textDim, fontSize: 12 }}>View as:</span>
                    {["time", "priority"].map(v => (
                      <button key={v} onClick={() => setCatView(v)} style={{
                        padding: "5px 14px", borderRadius: 4, cursor: "pointer", ...lbl, fontSize: 9,
                        background: catView === v ? T.surfaceHover : "transparent",
                        color: catView === v ? T.text : T.textDim,
                        border: "1px solid " + T.border,
                      }}>{v === "time" ? "⏱ By Time" : "🎯 By Priority"}</button>
                    ))}
                  </div>
                )}

                {/* ── TIME VIEW ── */}
                {(catMode === "time" || catView === "time") && (
                  <div>
                    {activeBuckets.map(bucket => {
                      const bTasks = filled.filter(t => getBucketId(parseInt(t.mins)) === bucket.id);
                      return (
                        <div key={bucket.id} style={{ background: T.surfaceAlt, borderRadius: 8, marginBottom: 12, overflow: "hidden", border: "1.5px solid " + bucket.border }}>
                          <div style={{ background: bucket.bg, padding: "10px 16px", borderBottom: "1px solid " + bucket.border, display: "flex", alignItems: "center", gap: 10 }}>
                            <div style={{ width: 10, height: 10, borderRadius: "50%", background: bucket.color }} />
                            <span style={{ ...lbl, fontSize: 11, color: bucket.color }}>{bucket.label}</span>
                            <span style={{ marginLeft: "auto", background: bucket.color, color: "white", borderRadius: 20, padding: "2px 10px", ...lbl, fontSize: 10 }}>{bTasks.length}</span>
                          </div>
                          {bTasks.length === 0
                            ? <div style={{ padding: "14px 16px", color: T.textFaint, fontSize: 13, fontStyle: "italic" }}>No tasks in this category</div>
                            : bTasks.map((task, i) => {
                                const q = catMode === "priority" && task.quad ? quadOf(task.quad) : null;
                                return (
                                  <div key={task.id} style={{ display: "grid", gridTemplateColumns: "1fr auto auto", borderBottom: i < bTasks.length - 1 ? "1px solid " + T.borderSubtle : "none", alignItems: "center" }}>
                                    <div style={{ padding: "9px 16px", fontSize: 13, color: T.text }}>
                                      <span style={{ color: T.textNum, fontSize: 11, marginRight: 6, ...lbl }}>{task.id}.</span>{task.text}
                                    </div>
                                    {q && <span style={{ ...lbl, fontSize: 9, color: q.color, background: q.bg, border: "1px solid " + q.border, padding: "2px 7px", borderRadius: 3, marginRight: 8 }}>{q.short}</span>}
                                    <div style={{ padding: "9px 16px 9px 0", textAlign: "right", ...lbl, fontSize: 11, color: bucket.color }}>{task.mins}m</div>
                                  </div>
                                );
                              })
                          }
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* ── PRIORITY VIEW ── */}
                {catMode === "priority" && catView === "priority" && (
                  <div>
                    {activeQuads.map(quad => {
                      const qTasks = filled.filter(t => t.quad === quad.id);
                      const untagged = quad.id === activeQuads[0].id ? filled.filter(t => !t.quad) : [];
                      return (
                        <div key={quad.id} style={{ background: T.surfaceAlt, borderRadius: 8, marginBottom: 12, overflow: "hidden", border: "1.5px solid " + quad.border }}>
                          <div style={{ background: quad.bg, padding: "10px 16px", borderBottom: "1px solid " + quad.border, display: "flex", alignItems: "center", gap: 10 }}>
                            <div style={{ width: 10, height: 10, borderRadius: "50%", background: quad.color }} />
                            <span style={{ ...lbl, fontSize: 11, color: quad.color }}>{quad.short}</span>
                            <span style={{ fontSize: 12, color: quad.color, opacity: 0.7 }}>— {quad.label}</span>
                            <span style={{ marginLeft: "auto", background: quad.color, color: "white", borderRadius: 20, padding: "2px 10px", ...lbl, fontSize: 10 }}>{qTasks.length}</span>
                          </div>
                          {qTasks.length === 0 && untagged.length === 0
                            ? <div style={{ padding: "14px 16px", color: T.textFaint, fontSize: 13, fontStyle: "italic" }}>No tasks tagged here</div>
                            : [...qTasks, ...untagged].map((task, i) => {
                                const bkt = getBucket(getBucketId(parseInt(task.mins)));
                                const isUntagged = !task.quad;
                                return (
                                  <div key={task.id} style={{ display: "grid", gridTemplateColumns: "1fr auto auto", borderBottom: i < qTasks.length + untagged.length - 1 ? "1px solid " + T.borderSubtle : "none", alignItems: "center", background: isUntagged ? T.surfaceHover : "transparent" }}>
                                    <div style={{ padding: "9px 16px", fontSize: 13, color: T.text }}>
                                      <span style={{ color: T.textNum, fontSize: 11, marginRight: 6, ...lbl }}>{task.id}.</span>
                                      {task.text}
                                      {isUntagged && <span style={{ marginLeft: 8, fontSize: 10, color: T.textDim, fontStyle: "italic" }}>⚠ untagged</span>}
                                    </div>
                                    {task.mins && <span style={{ ...lbl, fontSize: 10, color: bkt.color, background: bkt.bg, padding: "2px 6px", borderRadius: 3, marginRight: 8 }}>{task.mins}m</span>}
                                    <div style={{ padding: "9px 16px 9px 0" }} />
                                  </div>
                                );
                              })
                          }
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Untagged warning in priority mode */}
                {catMode === "priority" && filled.filter(t => !t.mins).length > 0 && (
                  <div style={{ background: T.surfaceAlt, borderRadius: 8, marginBottom: 12, overflow: "hidden", border: "1px solid " + T.border }}>
                    <div style={{ background: T.surfaceAlt, padding: "10px 16px", borderBottom: "1px solid " + T.border }}>
                      <span style={{ ...lbl, fontSize: 11, color: T.textDim }}>⚠ No Time Estimate — add these before building blocks</span>
                    </div>
                    {filled.filter(t => !t.mins).map(task => (
                      <div key={task.id} style={{ padding: "9px 16px", borderBottom: "1px solid " + T.borderSubtle, fontSize: 13, color: T.text }}>
                        <span style={{ color: T.textNum, fontSize: 11, marginRight: 6, ...lbl }}>{task.id}.</span>{task.text}
                      </div>
                    ))}
                  </div>
                )}

                {/* Time-only untagged warning */}
                {catMode === "time" && filled.filter(t => !t.mins).length > 0 && (
                  <div style={{ background: T.surfaceAlt, borderRadius: 8, marginBottom: 12, overflow: "hidden", border: "1px solid " + T.border }}>
                    <div style={{ background: T.surfaceAlt, padding: "10px 16px", borderBottom: "1px solid " + T.border }}>
                      <span style={{ ...lbl, fontSize: 11, color: T.textDim }}>⚠ No Time Estimate — go back and add these</span>
                    </div>
                    {filled.filter(t => !t.mins).map(task => (
                      <div key={task.id} style={{ padding: "9px 16px", borderBottom: "1px solid " + T.borderSubtle, fontSize: 13, color: T.text }}>
                        <span style={{ color: T.textNum, fontSize: 11, marginRight: 6, ...lbl }}>{task.id}.</span>{task.text}
                      </div>
                    ))}
                  </div>
                )}

                {/* Matrix — always shown in priority mode */}
                {catMode === "priority" && catView === "priority" && <MatrixPlot />}

                <div style={{ marginTop: 20, display: "flex", justifyContent: "space-between" }}>
                  <button onClick={() => setStep(1)} style={{ ...btnBack, color: T.btnBackColor, border: "1.5px solid " + T.btnBackBorder }}>← Back</button>
                  <button style={btnPrimary} onClick={() => setStep(3)}>Build Blocks →</button>
                </div>
              </div>
            )}

            {/* ════════════════════════════════
                STEP 3 — BUILD BLOCKS
            ════════════════════════════════ */}
            {step === 3 && (
              <div>
                <h2 style={{ color: T.text, ...lbl, fontSize: 20, marginBottom: 6 }}>Build Your Blocks</h2>
                <p style={{ color: T.textMid, fontSize: 14, marginBottom: 12 }}>
                  Set each block's max length, choose your break, and use <strong style={{ color: C.red }}>✂ SPLIT</strong> for tasks that don't fit neatly. Remove a task from a block to return it to the available list.
                </p>

                {/* ── Sticky time window banner ── */}
                {(() => {
                  const parseTime = t => {
                    if (!t) return null;
                    const [h,m] = t.split(":").map(Number);
                    return h * 60 + (m||0);
                  };
                  const startMins = parseTime(startTime);
                  const endMins   = parseTime(endTime);
                  const windowMins = (startMins !== null && endMins !== null)
                    ? (endMins >= startMins ? endMins - startMins : 1440 - startMins + endMins)
                    : null;
                  const usedMins = blocks
                    .filter(b => !deferredBlockIds.includes(b.id))
                    .reduce((sum, b) => sum + blockTotal(b) + (b.items.length > 0 ? (b.breakMins||10) : 0), 0);
                  const remainingMins = windowMins !== null ? windowMins - usedMins : null;
                  const overBudget = remainingMins !== null && remainingMins < 0;
                  return (
                    <div style={{ position: "sticky", top: 0, zIndex: 20, background: T.stickyBg, backdropFilter: "blur(6px)", borderRadius: 8, padding: "10px 16px", marginBottom: 16, border: overBudget ? "1.5px solid " + C.red : "1px solid " + T.border, display: "flex", flexWrap: "wrap", alignItems: "center", gap: 16 }}>
                      <span style={{ ...lbl, fontSize: 10, color: T.textMid, flexShrink: 0 }}>⏱ SESSION WINDOW</span>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <label style={{ fontSize: 11, color: T.textDim }}>Start</label>
                        <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)}
                          style={{ background: T.inputBg, border: "1px solid " + T.inputBorder, borderRadius: 4, padding: "4px 8px", color: T.text, fontSize: 12, outline: "none" }} />
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <label style={{ fontSize: 11, color: T.textDim }}>End</label>
                        <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)}
                          style={{ background: T.inputBg, border: "1px solid " + T.inputBorder, borderRadius: 4, padding: "4px 8px", color: T.text, fontSize: 12, outline: "none" }} />
                      </div>
                      {windowMins !== null && (
                        <>
                          <div style={{ height: 24, width: 1, background: T.border }} />
                          <span style={{ fontSize: 12, color: T.textMid }}>Window: <strong style={{ color: T.text }}>{windowMins}m</strong></span>
                          <span style={{ fontSize: 12, color: T.textMid }}>Used: <strong style={{ color: T.text }}>{usedMins}m</strong></span>
                          <span style={{ fontSize: 12, color: overBudget ? C.red : C.teal || "#0891B2", fontWeight: 700 }}>
                            {overBudget ? "⚠ " + Math.abs(remainingMins) + "m over budget" : remainingMins + "m remaining"}
                          </span>
                        </>
                      )}
                      {windowMins === null && (
                        <span style={{ fontSize: 11, color: T.textFaint, fontStyle: "italic" }}>Enter start & end time to see your available window</span>
                      )}
                    </div>
                  );
                })()}

                <div style={{ display: "grid", gridTemplateColumns: "270px 1fr", gap: 20 }}>

                  {/* Available panel */}
                  <div style={{ position: "sticky", top: 72, alignSelf: "start" }}>
                    <div style={{ background: C.purple, borderRadius: "8px 8px 0 0", padding: "10px 14px", color: "white", ...lbl, fontSize: 11 }}>
                      Available ({available.length + availableSplitChunks.length})
                    </div>
                    {/* Sort toolbar */}
                    <div style={{ background: T.headerAlt, padding: "6px 10px", display: "flex", gap: 4, flexWrap: "wrap" }}>
                      {[["default","Default"],["time_asc","Time ↑"],["time_desc","Time ↓"],["priority","Priority"]].map(([val,label]) => (
                        <button key={val} onClick={() => setAvailSort(val)} style={{ padding: "2px 8px", borderRadius: 3, cursor: "pointer", ...lbl, fontSize: 8, background: availSort === val ? C.red : "transparent", color: availSort === val ? "white" : "rgba(255,255,255,0.6)", border: availSort === val ? "none" : "1px solid rgba(255,255,255,0.25)" }}>{label}</button>
                      ))}
                    </div>
                    <div style={{ background: T.availBg, borderRadius: "0 0 8px 8px", minHeight: 120, overflow: "hidden", border: "1px solid " + T.border, borderTop: "none" }}>
                      {available.length === 0 && availableSplitChunks.length === 0
                        ? <div style={{ padding: 20, textAlign: "center", color: T.textDim, fontSize: 13, fontStyle: "italic" }}>🎉 All tasks assigned!</div>
                        : (<>
                            {availableSplitChunks.map(chunk => (
                              <div key={chunk.id} draggable
                                onDragStart={() => setDragging({ type: "split", id: chunk.id })}
                                onDragEnd={() => setDragging(null)}
                                style={{ padding: "8px 12px", borderBottom: "1px solid " + T.borderSubtle, display: "flex", alignItems: "center", gap: 8, cursor: "grab", background: "transparent" }}>
                                <div style={{ width: 7, height: 7, borderRadius: "50%", background: T.deferBorder, flexShrink: 0 }} />
                                <span style={{ fontSize: 11, color: T.text, flex: 1, lineHeight: 1.4 }}>
                                  {chunk.text} <span style={{ color: T.textDim }}>({chunk.part}/{chunk.totalParts})</span>
                                </span>
                                <span style={{ ...lbl, fontSize: 10, color: T.textMid, background: T.surfaceHover, padding: "2px 6px", borderRadius: 3 }}>{chunk.mins}m</span>
                              </div>
                            ))}
                            {((() => {
                              const QORD = {"HH":0,"HL":1,"LH":2,"LL":3,"":4};
                              let sorted = [...available];
                              if (availSort === "time_asc")  sorted.sort((a,b) => (parseInt(a.mins)||0) - (parseInt(b.mins)||0));
                              if (availSort === "time_desc") sorted.sort((a,b) => (parseInt(b.mins)||0) - (parseInt(a.mins)||0));
                              if (availSort === "priority")  sorted.sort((a,b) => (QORD[a.quad]??4) - (QORD[b.quad]??4));
                              return sorted;
                            })()).map(task => {
                              const mins = parseInt(task.mins) || 0;
                              const isSplit    = !!splitsByParent[task.id];
                              const needsSplit = mins > MAX_MINS && !isSplit;
                              const q = task.quad ? quadOf(task.quad) : null;
                              const dotColor = q ? q.color : "#C0BAD8";
                              // Check if this task lives in a completed block
                              const taskDone = blocks.some(b =>
                                completedBlockIds.includes(b.id) &&
                                b.items.some(it => it.taskId === task.id || it.id === task.id)
                              );
                              return (
                                <div key={task.id} draggable={!needsSplit && !taskDone}
                                  onDragStart={!needsSplit && !taskDone ? () => setDragging({ type: "task", id: task.id }) : undefined}
                                  onDragEnd={() => setDragging(null)}
                                  style={{ padding: "7px 12px", borderBottom: "1px solid " + T.borderSubtle, display: "flex", alignItems: "center", gap: 8, cursor: taskDone ? "default" : needsSplit ? "default" : "grab", background: taskDone ? T.surfaceHover : "transparent", opacity: taskDone ? 0.6 : 1 }}>
                                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: taskDone ? "#9CA3AF" : dotColor, flexShrink: 0 }} />
                                  <span style={{ fontSize: 12, color: taskDone ? T.textDim : T.text, flex: 1, lineHeight: 1.4, textDecoration: taskDone ? "line-through" : "none" }}>
                                    {task.text}
                                    {needsSplit && !taskDone && <button onClick={e => { e.stopPropagation(); splitTask(task); }} style={{ background: "none", border: "none", cursor: "pointer", color: C.red, fontSize: 14, padding: "0 0 0 6px", lineHeight: 1, verticalAlign: "middle" }} title="Split task">✂</button>}
                                  </span>
                                  {task.mins && <span style={{ fontSize: 11, color: T.textDim, flexShrink: 0 }}>{task.mins}m</span>}
                                  {taskDone && <span style={{ fontSize: 9, color: "#0891B2", ...lbl, flexShrink: 0 }}>✓ DONE</span>}
                                  {isSplit && !taskDone && <button onClick={() => unsplitTask(task.id)} style={{ background: "transparent", color: T.textDim, border: "1px solid " + T.border, borderRadius: 3, padding: "2px 6px", cursor: "pointer", ...lbl, fontSize: 8, flexShrink: 0 }}>↩</button>}
                                </div>
                              );
                            })}
                          </>)
                      }
                    </div>
                    <p style={{ color: T.textFaint, fontSize: 11, marginTop: 8, fontStyle: "italic" }}>Drag into a block, or use the dropdown. Remove from a block to return here.</p>
                  </div>

                  {/* Blocks */}
                  <div>
                    {blocks.map((block, bIdx) => {
                      const blockMax  = block.maxMins || MAX_MINS;
                      const total     = blockTotal(block);
                      const pct       = Math.min((total / blockMax) * 100, 100);
                      const over      = total > blockMax;
                      const remaining = blockMax - total;
                      const isDeferred  = deferredBlockIds.includes(block.id);
                      const isCompleted = completedBlockIds.includes(block.id);
                      const headerBg    = isCompleted ? T.completedHeader : isDeferred ? T.deferHeader : C.purple;
                      return (
                        <div key={block.id}
                          onDragOver={e => { e.preventDefault(); dragTarget.current = block.id; }}
                          onDrop={() => !isDeferred && dropOnBlock(block.id)}
                          style={{ background: T.blockCard, borderRadius: 8, marginBottom: 14, boxShadow: "0 2px 12px rgba(0,0,0,0.15)", border: isDeferred ? "1.5px dashed " + T.deferBorder : over ? "2px solid " + C.red : "1.5px solid " + T.border, overflow: "hidden", opacity: isDeferred ? 0.75 : 1, transition: "opacity 0.2s, border 0.2s" }}>

                          {/* Block header */}
                          <div style={{ background: headerBg, padding: "9px 14px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", transition: "background 0.3s" }}>
                            {/* Block label */}
                            {isCompleted
                              ? <span style={{ ...lbl, fontSize: 12, color: "#0891B2", flexShrink: 0 }}>✓ Block {bIdx + 1}</span>
                              : isDeferred
                                ? <span style={{ ...lbl, fontSize: 12, color: "#9B8FC0", flexShrink: 0 }}>Block {bIdx + 1}</span>
                                : <span style={{ ...lbl, fontSize: 12, color: "white", flexShrink: 0 }}>Block {bIdx + 1}</span>
                            }
                            {/* ACTION / DEFER toggle */}
                            {!isCompleted && (
                              <button onClick={() => toggleDefer(block.id)} style={{
                                display: "flex", alignItems: "center", gap: 4,
                                padding: "2px 10px", borderRadius: 10, cursor: "pointer", ...lbl, fontSize: 9, flexShrink: 0,
                                background: "rgba(255,255,255,0.08)",
                                color: "rgba(255,255,255,0.7)",
                                border: "1px solid rgba(255,255,255,0.2)",
                                transition: "all 0.2s",
                              }}>
                                {isDeferred ? "ACTION" : "DEFER"}
                              </button>
                            )}
                            {/* Reorder controls */}
                            <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
                              <button onClick={() => moveBlockToPos(block.id, Math.max(0, bIdx - 1))} disabled={bIdx === 0}
                                style={{ background: T.surfaceHover, border: "none", color: bIdx === 0 ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.7)", borderRadius: 3, width: 22, height: 22, cursor: bIdx === 0 ? "default" : "pointer", fontSize: 11, display: "flex", alignItems: "center", justifyContent: "center" }}>↑</button>
                              <button onClick={() => moveBlockToPos(block.id, Math.min(blocks.length - 1, bIdx + 1))} disabled={bIdx === blocks.length - 1}
                                style={{ background: T.surfaceHover, border: "none", color: bIdx === blocks.length - 1 ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.7)", borderRadius: 3, width: 22, height: 22, cursor: bIdx === blocks.length - 1 ? "default" : "pointer", fontSize: 11, display: "flex", alignItems: "center", justifyContent: "center" }}>↓</button>
                              {blocks.length > 2 && (
                                <select value={bIdx} onChange={e => moveBlockToPos(block.id, parseInt(e.target.value))}
                                  style={{ background: "rgba(255,255,255,0.1)", color: "rgba(255,255,255,0.7)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 3, padding: "1px 3px", fontSize: 10, cursor: "pointer", outline: "none" }}>
                                  {blocks.map((_, i) => <option key={i} value={i} style={{ color: C.dark }}>→ {i+1}</option>)}
                                </select>
                              )}
                            </div>
                            {/* Progress bar + time */}
                            <div style={{ flex: 1, minWidth: 80, height: 6, background: T.progressTrack, borderRadius: 3, overflow: "hidden" }}>
                              <div style={{ height: "100%", width: pct + "%", background: isDeferred ? "#6B5B9E" : over ? C.red : "#4ADE80", borderRadius: 3, transition: "width 0.3s,background 0.3s" }} />
                            </div>
                            <span style={{ ...lbl, fontSize: 11, color: isDeferred ? T.deferBorder : over ? C.red : "rgba(255,255,255,0.85)", flexShrink: 0 }}>{total}/{blockMax}m</span>
                            <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
                              <span style={{ ...lbl, fontSize: 9, color: "rgba(255,255,255,0.5)" }}>MAX</span>
                              <select value={block.maxMins || 40} onChange={e => updateBlockSetting(block.id, "maxMins", parseInt(e.target.value))}
                                style={{ background: "rgba(255,255,255,0.12)", color: "white", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 3, padding: "2px 4px", fontSize: 11, cursor: "pointer", outline: "none" }}>
                                {[15, 20, 25, 30, 35, 40].map(n => <option key={n} value={n} style={{ color: C.dark }}>{n}m</option>)}
                              </select>
                            </div>

                            {blocks.length > 1 && <button onClick={() => removeBlock(block.id)} style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "rgba(255,255,255,0.5)", borderRadius: 3, padding: "2px 7px", cursor: "pointer", fontSize: 12, flexShrink: 0 }}>✕</button>}
                          </div>
                          {/* Deferred overlay on task body */}
                          {isDeferred && (
                            <div style={{ background: T.surfaceAlt, padding: "8px 14px", borderBottom: "1px solid " + T.border, display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ fontSize: 11, color: T.deferText, fontStyle: "italic" }}>This block is deferred — it won't run in the current session. Click <strong>ACTION</strong> to reinstate it.</span>
                            </div>
                          )}

                          {/* Tasks in block */}
                          <div style={{ padding: "10px 12px", minHeight: 52 }}>
                            {block.items.length === 0
                              ? <div style={{ color: T.emptyText, fontSize: 12, fontStyle: "italic", padding: 10, textAlign: "center", border: "2px dashed " + T.emptyBorder, borderRadius: 4 }}>Drop tasks here or use the menu below</div>
                              : <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                                  {block.items.map(item => {
                                    const bkt = getBucket(getBucketId(parseInt(item.mins)));
                                    const key = item.splitId || "task-" + item.taskId;
                                    const q   = item.quad ? quadOf(item.quad) : null;
                                    const done = completedTaskIds.has(item.taskId);
                                    return (
                                      <div key={key}
                                        style={{ display: "flex", alignItems: "center", gap: 6, background: bkt.bg, border: "1.5px solid " + bkt.border, borderRadius: 5, padding: "5px 8px 5px 10px", opacity: done ? 0.4 : 1, transition: "opacity 0.15s" }}>
                                        {q && <div style={{ width: 8, height: 8, borderRadius: "50%", background: q.color, flexShrink: 0 }} />}
                                        <span style={{ fontSize: 12, color: T.text, textDecoration: done ? "line-through" : "none" }}>{item.text}</span>
                                        {item.splitId && <span style={{ ...lbl, fontSize: 9, color: T.splitBadgeColor, background: T.splitBadgeBg, padding: "1px 5px", borderRadius: 3 }}>{item.part}/{item.totalParts}</span>}
                                        {item.mins && <span style={{ ...lbl, fontSize: 10, color: bkt.color }}>{item.mins}m</span>}
                                        <button onClick={() => removeFromBlock(block.id, key)} style={{ background: "none", border: "none", cursor: "pointer", color: "#9B8FC0", fontSize: 13, padding: 0, lineHeight: 1 }}>✕</button>
                                      </div>
                                    );
                                  })}
                                </div>
                            }
                            {remaining > 0 && (available.length > 0 || availableSplitChunks.length > 0) && (
                              <div style={{ marginTop: 8 }}>
                                <select value="" onChange={e => {
                                  const val = e.target.value;
                                  if (val.startsWith("split-")) {
                                    const chunk = splitTasks.find(s => s.id === val);
                                    if (chunk) addSplitToBlock(block.id, chunk);
                                  } else {
                                    const t = filled.find(task => task.id === parseInt(val));
                                    if (t) addToBlock(block.id, t);
                                  }
                                  e.target.value = "";
                                }} style={{ border: "1.5px dashed " + T.emptyBorder, borderRadius: 4, padding: "6px 8px", fontSize: 12, color: T.textDim, background: T.surfaceAlt, width: "100%", cursor: "pointer", outline: "none" }}>
                                  <option value="" disabled>+ Add task — {remaining}m remaining in Block {bIdx + 1}...</option>
                                  {availableSplitChunks.filter(c => c.mins <= remaining).map(c => (
                                    <option key={c.id} value={c.id}>✂ {c.text} (part {c.part}/{c.totalParts} — {c.mins}m)</option>
                                  ))}
                                  {available.filter(t => !parseInt(t.mins) || parseInt(t.mins) <= remaining).filter(t => !splitsByParent[t.id]).map(t => (
                                    <option key={t.id} value={t.id}>{t.text}{t.mins ? " (" + t.mins + "m)" : ""}</option>
                                  ))}
                                </select>
                              </div>
                            )}
                          </div>

                          {/* Break selector */}
                          <div style={{ background: T.surfaceAlt, borderTop: "1.5px solid " + T.border, padding: "7px 14px", display: "flex", alignItems: "center", gap: 10 }}>
                            <span style={{ ...lbl, fontSize: 10, color: T.textDim }}>BREAK</span>
                            <div style={{ display: "flex", gap: 4 }}>
                              {[5, 10, 15].map(n => (
                                <button key={n} onClick={() => updateBlockSetting(block.id, "breakMins", n)}
                                  style={{ background: (block.breakMins || 10) === n ? T.inputBg : "transparent", color: T.textMid, border: "1px solid " + T.inputBorder, borderRadius: 3, padding: "2px 8px", cursor: "pointer", ...lbl, fontSize: 9 }}>{n}m</button>
                              ))}
                            </div>
                            <span style={{ fontSize: 11, color: T.textDim, fontStyle: "italic" }}>— Dopamine reset. Step away from the screen.</span>
                          </div>
                        </div>
                      );
                    })}
                    <button onClick={addBlock}
                      style={{ width: "100%", background: "transparent", border: "2px dashed " + T.emptyBorder, borderRadius: 8, padding: 13, color: T.emptyText, ...lbl, fontSize: 11, cursor: "pointer", transition: "all 0.15s" }}
                      onMouseEnter={e => { e.currentTarget.style.borderColor = "rgba(232,69,60,0.5)"; e.currentTarget.style.color = C.red; }}
                      onMouseLeave={e => { e.currentTarget.style.borderColor = T.emptyBorder; e.currentTarget.style.color = T.emptyText; }}>
                      + Add Another Block
                    </button>
                  </div>
                </div>

                <div style={{ marginTop: 20, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <button onClick={() => setStep(2)} style={{ ...btnBack, color: T.btnBackColor, border: "1.5px solid " + T.btnBackBorder }}>← Back</button>
                  <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                    <span style={{ color: T.textDim, fontSize: 12, fontStyle: "italic" }}>
                      {filled.length - available.length} of {filled.length} tasks scheduled
                    </span>
                    {allBlocksDeferred
                      ? <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                          <button disabled style={{ ...btnPrimary, background: T.headerAlt, color: T.textFaint, cursor: "not-allowed", border: "1.5px dashed " + T.border }}>▶ RUN SESSION</button>
                          <span style={{ fontSize: 10, color: T.deferText, fontStyle: "italic" }}>All blocks are deferred — reinstate at least one to run</span>
                        </div>
                      : activeBlocks.length > 0
                        ? <button style={{ ...btnPrimary, background: "#0891B2" }} onClick={startSession}>▶ RUN SESSION</button>
                        : null
                    }
                  </div>
                </div>
              </div>
            )}

            {/* ════════════════════════════════
                STEP 4 — POMODORO
            ════════════════════════════════ */}
            {step === 4 && (
              <div style={{ maxWidth: 640, margin: "0 auto", paddingBottom: 40 }}>
                {pomComplete ? (
                  <div style={{ textAlign: "center", padding: "60px 0" }}>
                    <div style={{ fontSize: 64, marginBottom: 16 }}>🎉</div>
                    <div style={{ color: T.text, ...lbl, fontSize: 28, marginBottom: 8 }}>Session Complete!</div>
                    <div style={{ color: T.textMid, fontSize: 14, marginBottom: 32 }}>
                      You crushed {activeBlocks.length} block{activeBlocks.length !== 1 ? "s" : ""}. Outstanding work.
                    </div>
                    <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                      <button onClick={() => { resetSession(); setStep(3); }} style={{ ...btnBack, color: T.btnBackColor, border: "1.5px solid " + T.btnBackBorder }}>← Back to Blocks</button>
                      <button style={btnPrimary} onClick={() => { resetSession(); startSession(); }}>↺ Run Again</button>
                    </div>
                  </div>
                ) : (
                  <>
                    {/* Block progress dots */}
                    <div style={{ display: "flex", justifyContent: "center", gap: 10, marginBottom: 28, paddingTop: 8 }}>
                      {activeBlocks.map((blk, i) => (
                        <div key={blk.id} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                          <div style={{
                            width: i === pomBlockIdx ? 30 : 16, height: i === pomBlockIdx ? 30 : 16, borderRadius: "50%",
                            background: i < pomBlockIdx ? "#0891B2" : i === pomBlockIdx ? (pomPhase === "break" ? "rgba(255,255,255,0.25)" : C.red) : T.blockDot,
                            border: i === pomBlockIdx ? "3px solid " + T.blockDotActiveBorder : "none",
                            transition: "all 0.3s", display: "flex", alignItems: "center", justifyContent: "center",
                            fontSize: 10, color: "white", fontWeight: 900,
                          }}>{i < pomBlockIdx ? "✓" : ""}</div>
                          <span style={{ color: T.textDim, fontSize: 9, ...lbl, letterSpacing: 0.5 }}>B{i + 1}</span>
                        </div>
                      ))}
                    </div>

                    {/* Phase label */}
                    <div style={{ textAlign: "center", marginBottom: 6 }}>
                      <span style={{ ...lbl, fontSize: 11, letterSpacing: 2, color: T.phaseLabelColor }}>
                        {activeBlocks.length === 0 ? "No active blocks" :
                        pomPhase === "work"
                          ? "Block " + (pomBlockIdx + 1) + " of " + activeBlocks.length + " — Focus Time"
                          : "Block " + (pomBlockIdx + 1) + " — Break Time"}
                      </span>
                    </div>

                    {/* Timer rings — outer = block, inner = task */}
                    {(() => {
                      const blk       = activeBlocks[pomBlockIdx] || {};
                      const totalSecs = pomPhase === "work" ? (blk.maxMins || 40) * 60 : (blk.breakMins || 10) * 60;
                      const remaining = (pomSecsLeft || 0);
                      const pctRemain = totalSecs > 0 ? remaining / totalSecs : 0;
                      const Ro = 120, circO = 2 * Math.PI * Ro;
                      const ringColor = pomPhase === "break" ? T.timerRingBreak : pomRunning ? C.red : T.timerRingIdle;

                      // Inner ring — task level
                      const Ri = 85, circI = 2 * Math.PI * Ri;
                      const currentTask = blk.items ? blk.items[pomTaskIdx] : null;
                      const taskMins    = currentTask ? (parseInt(currentTask.mins) || 0) : 0;
                      const taskTotal   = taskMins * 60;
                      const taskRemain  = (pomTaskSecsLeft || 0);
                      const taskPctRemain = taskTotal > 0 ? taskRemain / taskTotal : 0;
                      const allTasksDone = blk.items && pomTaskIdx >= blk.items.length;
                      const hasNoDuration = currentTask && taskMins === 0;
                      const showInner   = pomPhase === "work";

                      // Inner ring colour — green
                      let innerColor = "rgba(255,255,255,0.08)";
                      if (showInner && currentTask && taskMins > 0) {
                        innerColor = pomRunning ? "#22C55E" : "rgba(34,197,94,0.5)";
                      }

                      return (
                        <div style={{ display: "flex", justifyContent: "center", marginBottom: 28 }}>
                          <div style={{ position: "relative", width: 280, height: 280 }}>
                            <svg width="280" height="280" style={{ transform: "rotate(-90deg)" }}>
                              {/* Outer ring background */}
                              <circle cx="140" cy="140" r={Ro} fill="none" stroke={T.timerRingBg} strokeWidth="10" />
                              {/* Outer ring — remaining (drains down) */}
                              <circle cx="140" cy="140" r={Ro} fill="none" stroke={ringColor} strokeWidth="10"
                                strokeDasharray={(circO * pctRemain) + " " + circO} strokeLinecap="round"
                                style={{ transition: "stroke-dasharray 0.8s ease, stroke 0.5s" }} />
                              {/* Inner ring background */}
                              {showInner && <circle cx="140" cy="140" r={Ri} fill="none" stroke={T.timerRingBg} strokeWidth="7" />}
                              {/* Inner ring — remaining (drains down) */}
                              {showInner && !allTasksDone && !hasNoDuration && (
                                <circle cx="140" cy="140" r={Ri} fill="none" stroke={innerColor} strokeWidth="7"
                                  strokeDasharray={(circI * taskPctRemain) + " " + circI} strokeLinecap="round"
                                  style={{ transition: "stroke-dasharray 0.8s ease, stroke 0.5s" }} />
                              )}
                              {/* Greyed inner ring for no-duration tasks */}
                              {showInner && hasNoDuration && (
                                <circle cx="140" cy="140" r={Ri} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="7"
                                  strokeDasharray={"0 " + circI} />
                              )}
                            </svg>
                            <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                              {countdown !== null ? (
                                <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 900, fontSize: countdown === "GO" ? 52 : 72, color: countdown === "GO" ? "#22C55E" : T.timerText, letterSpacing: -2, lineHeight: 1, transition: "all 0.3s" }}>
                                  {countdown}
                                </div>
                              ) : pomPhase === "break" ? (
                                <>
                                  <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 900, fontSize: 52, color: T.timerText, letterSpacing: -2, lineHeight: 1 }}>{fmtTime(pomSecsLeft)}</div>
                                  <div style={{ color: T.textDim, fontSize: 11, marginTop: 8, fontStyle: "italic" }}>
                                    {(blk.breakMins || 10) + " min break"}
                                  </div>
                                </>
                              ) : (
                                <>
                                  {/* Block time — smaller, top */}
                                  <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 700, fontSize: 13, color: T.textDim, letterSpacing: 1, marginBottom: 2 }}>
                                    BLOCK {fmtTime(pomSecsLeft)}
                                  </div>
                                  {/* Task time or status — large, centre */}
                                  {allTasksDone ? (
                                    <div style={{ color: T.timerText, fontSize: 10, textAlign: "center", marginTop: 6, background: T.timerRingBg, padding: "3px 10px", borderRadius: 4, maxWidth: 200, lineHeight: 1.3, fontWeight: 600 }}>
                                      No further tasks scheduled in this block
                                    </div>
                                  ) : hasNoDuration ? (
                                    <>
                                      <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 900, fontSize: 16, color: T.textDim, letterSpacing: 0.5, marginTop: 4 }}>
                                        No duration set
                                      </div>
                                      <div style={{ color: T.timerText, fontSize: 10, marginTop: 6, background: T.timerRingBg, padding: "3px 10px", borderRadius: 4, maxWidth: 160, textAlign: "center", lineHeight: 1.3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                        {currentTask.text}
                                      </div>
                                    </>
                                  ) : (
                                    <>
                                      <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 900, fontSize: 42, color: T.timerText, letterSpacing: -2, lineHeight: 1 }}>
                                        {fmtTime(pomTaskSecsLeft)}
                                      </div>
                                      <div style={{ color: T.timerText, fontSize: 10, marginTop: 6, background: T.timerRingBg, padding: "3px 10px", borderRadius: 4, maxWidth: 160, textAlign: "center", lineHeight: 1.3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontWeight: 600 }}>
                                        {currentTask ? currentTask.text : ""}
                                      </div>
                                    </>
                                  )}
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    {/* Controls */}
                    <div style={{ display: "flex", justifyContent: "center", gap: 12, marginBottom: 16, opacity: countdown !== null ? 0.3 : 1, pointerEvents: countdown !== null ? "none" : "auto", transition: "opacity 0.3s" }}>
                      <button onClick={pauseResume} style={{ ...btnPrimary, minWidth: 130, background: pomRunning ? T.blockCard : C.red, border: pomRunning ? "1.5px solid " + T.border : "none", color: pomRunning ? T.textMid : "white" }}>
                        {pomRunning ? "⏸ PAUSE" : "▶ RESUME"}
                      </button>
                      <button onClick={skipPhase} style={{ ...btnPrimary, background: T.surfaceAlt, border: "1.5px solid " + T.border, color: T.textMid }}>SKIP ▶▶</button>
                      <button onClick={resetSession} style={{ ...btnPrimary, background: T.surfaceAlt, border: "1.5px solid " + T.border, color: T.textFaint }}>↺ RESET</button>
                    </div>
                    <div style={{ display: "flex", justifyContent: "center", gap: 10, marginBottom: 24 }}>
                      <button onClick={() => setMuted(m => !m)} style={{ background: T.surfaceAlt, border: "1px solid " + T.border, borderRadius: 4, padding: "5px 16px", cursor: "pointer", color: T.textDim, ...lbl, fontSize: 9 }}>
                        {muted ? "🔇 Sounds Off" : "🔔 Sounds On"}
                      </button>
                      <button onClick={() => playTone("block_done")} style={{ background: T.surfaceAlt, border: "1px solid " + T.border, borderRadius: 4, padding: "5px 16px", cursor: "pointer", color: T.textFaint, ...lbl, fontSize: 9 }}>
                        ▷ Test Sound
                      </button>
                    </div>

                    {/* Current block tasks */}
                    {(() => {
                      const blk     = activeBlocks[pomBlockIdx];
                      const nextBlk = activeBlocks[pomBlockIdx + 1] || null;
                      if (!blk || !blk.items.length) return null;
                      return (
                        <div style={{ marginBottom: 24 }}>

                          {/* This block's tasks */}
                          <div style={{ background: T.sessionInfoBg, borderRadius: 10, border: "1px solid " + T.border, overflow: "hidden", marginBottom: 12 }}>
                            <div style={{ padding: "10px 16px", background: T.surfaceAlt, borderBottom: "1px solid " + T.borderSubtle, display: "flex", alignItems: "center", gap: 0 }}>
                              {pomPhase === "work" && (
                                <>
                                  <span style={{ ...lbl, fontSize: 10, color: "#22C55E" }}>
                                    COMPLETED {blk.items.filter(item => { const k = blk.id + ":" + (item.splitId || "task-" + item.taskId); return !!checkedTaskKeys[k]; }).length}/{blk.items.length}
                                  </span>
                                  <span style={{ color: T.textFaint, margin: "0 10px", fontSize: 10 }}>|</span>
                                </>
                              )}
                              <span style={{ ...lbl, fontSize: 10, color: T.textDim }}>
                                {pomPhase === "work" ? "THIS BLOCK'S TASKS" : "COMING UP AFTER YOUR BREAK"}
                              </span>
                            </div>
                            {blk.items.map((item, i) => {
                              const bkt    = getBucket(getBucketId(parseInt(item.mins)));
                              const q      = item.quad ? quadOf(item.quad) : null;
                              const itmKey = blk.id + ":" + (item.splitId || "task-" + item.taskId);
                              const ticked = !!checkedTaskKeys[itmKey];
                              const skipped = !!skippedTaskKeys[itmKey];
                              const toggle = () => setCheckedTaskKeys(prev => ({ ...prev, [itmKey]: !prev[itmKey] }));
                              const isActiveTask = pomPhase === "work" && i === pomTaskIdx && !skipped;
                              const showPrompt = taskPromptKey === itmKey && !ticked && !skipped;
                              const dimmed = ticked || skipped;
                              return (
                                <React.Fragment key={i}>
                                  <div onClick={toggle} style={{ padding: "10px 16px", borderBottom: (!showPrompt && i < blk.items.length - 1) ? "1px solid " + T.borderSubtle : "none", display: "flex", alignItems: "center", gap: 10, cursor: "pointer", transition: "background 0.15s", background: ticked ? T.tickedRowBg : "transparent", opacity: skipped ? 0.5 : 1 }}>
                                    <div style={{ width: 18, height: 18, borderRadius: 4, border: ticked ? "none" : "2px solid " + T.checkboxBorder, background: ticked ? "#0891B2" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.15s" }}>
                                      {ticked && <span style={{ color: "white", fontSize: 11, fontWeight: 900, lineHeight: 1 }}>✓</span>}
                                    </div>
                                    {q
                                      ? <div style={{ width: 7, height: 7, borderRadius: "50%", background: dimmed ? "rgba(255,255,255,0.15)" : q.color, flexShrink: 0, transition: "background 0.15s" }} />
                                      : <div style={{ width: 7, height: 7, borderRadius: "50%", background: dimmed ? "rgba(255,255,255,0.15)" : bkt.color, flexShrink: 0, transition: "background 0.15s" }} />
                                    }
                                    <span style={{ color: dimmed ? T.textFaint : T.text, fontSize: 13, flex: 1, textDecoration: dimmed ? "line-through" : "none", transition: "all 0.15s" }}>{item.text}</span>
                                    {isActiveTask && (
                                      <button onClick={e => { e.stopPropagation(); skipTask(); }} style={{ ...lbl, fontSize: 9, letterSpacing: 1, color: T.textDim, background: "rgba(255,255,255,0.06)", border: "1px solid " + T.border, borderRadius: 4, padding: "3px 10px", cursor: "pointer", flexShrink: 0, transition: "background 0.15s" }}
                                        onMouseEnter={e => e.currentTarget.style.background = "rgba(255,255,255,0.12)"}
                                        onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.06)"}
                                      >SKIP</button>
                                    )}
                                    {skipped && !ticked && (
                                      <span style={{ ...lbl, fontSize: 8, letterSpacing: 1, color: "#F59E0B", background: "rgba(245,158,11,0.12)", border: "1px solid rgba(245,158,11,0.25)", borderRadius: 4, padding: "2px 8px", flexShrink: 0 }}>SKIPPED</span>
                                    )}
                                    {item.splitId && <span style={{ ...lbl, fontSize: 9, color: dimmed ? T.textFaint : T.splitBadgeColor, background: dimmed ? "transparent" : T.splitBadgeBg, padding: "2px 6px", borderRadius: 3 }}>{item.part}/{item.totalParts}</span>}
                                    <span style={{ ...lbl, fontSize: 10, color: dimmed ? "rgba(255,255,255,0.2)" : bkt.color, background: dimmed ? "transparent" : bkt.bg, padding: "2px 6px", borderRadius: 3, transition: "all 0.15s" }}>{item.mins}m</span>
                                  </div>
                                  {showPrompt && (
                                    <div style={{ padding: "8px 16px", background: "rgba(34,197,94,0.08)", borderBottom: i < blk.items.length - 1 ? "1px solid " + T.borderSubtle : "none", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                                      <span style={{ color: T.textDim, fontSize: 11, fontStyle: "italic" }}>Has this task been completed?</span>
                                      <button onClick={() => { setCheckedTaskKeys(prev => ({ ...prev, [itmKey]: true })); setTaskPromptKey(null); }} style={{ ...lbl, fontSize: 9, letterSpacing: 1, color: "white", background: "#22C55E", border: "none", borderRadius: 4, padding: "5px 14px", cursor: "pointer", flexShrink: 0, transition: "opacity 0.15s" }}
                                        onMouseEnter={e => e.currentTarget.style.opacity = "0.85"}
                                        onMouseLeave={e => e.currentTarget.style.opacity = "1"}
                                      >COMPLETE TASK</button>
                                    </div>
                                  )}
                                </React.Fragment>
                              );
                            })}
                          </div>

                          {/* Up Next — collapsible, next ACTION block only */}
                          {nextBlk && (
                            <div>
                              <button onClick={() => setShowUpNext(v => !v)} style={{ width: "100%", background: "transparent", border: "1.5px solid " + T.border, borderRadius: showUpNext ? "8px 8px 0 0" : 8, cursor: "pointer", padding: "9px 14px", display: "flex", alignItems: "center", gap: 8, marginBottom: 0, transition: "border-radius 0.15s, background 0.15s" }}>
                                <span style={{ ...lbl, fontSize: 9, color: T.textDim, letterSpacing: 1, flex: 1, textAlign: "left" }}>
                                  UP NEXT — BLOCK {pomBlockIdx + 2}
                                </span>
                                <span style={{ fontSize: 10, color: T.textFaint }}>
                                  {nextBlk.items.length} task{nextBlk.items.length !== 1 ? "s" : ""} · {nextBlk.items.reduce((s,it) => s+(parseInt(it.mins)||0),0)}m
                                </span>
                                <span style={{ fontSize: 10, color: T.textDim, marginLeft: 6 }}>{showUpNext ? "▲" : "▼"}</span>
                              </button>
                              {showUpNext && (
                                <div style={{ background: T.upNextBg, borderRadius: "0 0 8px 8px", border: "1.5px solid " + T.border, borderTop: "none", overflow: "hidden" }}>
                                  {nextBlk.items.map((item, j) => {
                                    const bkt = getBucket(getBucketId(parseInt(item.mins)));
                                    const q   = item.quad ? quadOf(item.quad) : null;
                                    return (
                                      <div key={j} style={{ padding: "8px 16px", borderBottom: j < nextBlk.items.length - 1 ? "1px solid " + T.borderSubtle : "none", display: "flex", alignItems: "center", gap: 10 }}>
                                        <div style={{ width: 6, height: 6, borderRadius: "50%", background: q ? q.color : bkt.color, opacity: 0.3, flexShrink: 0 }} />
                                        <span style={{ color: T.textFaint, fontSize: 12, flex: 1 }}>{item.text}</span>
                                        <span style={{ fontSize: 10, color: T.textFaint }}>{item.mins}m</span>
                                      </div>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          )}

                        </div>
                      );
                    })()}

                    <div style={{ display: "flex", justifyContent: "flex-start" }}>
                      <button onClick={() => { resetSession(); setStep(3); }} style={{ ...btnBack, color: T.btnBackColor, border: "1.5px solid " + T.btnBackBorder }}>← Back to Blocks</button>
                    </div>
                  </>
                )}
              </div>
            )}

          </div>
        </div>
      );
    }

    const PASSWORD = "TAPLfocus24";
    const GATE_KEY = "tapl-gate-v1";

    function PasswordGate() {
      const [unlocked, setUnlocked] = React.useState(() => {
        try { return localStorage.getItem(GATE_KEY) === "1"; } catch(e) { return false; }
      });
      const [input, setInput]   = React.useState("");
      const [error, setError]   = React.useState(false);
      const [shake, setShake]   = React.useState(false);

      if (unlocked) return <App />;

      const attempt = () => {
        if (input === PASSWORD) {
          try { localStorage.setItem(GATE_KEY, "1"); } catch(e) {}
          setUnlocked(true);
        } else {
          setError(true);
          setShake(true);
          setTimeout(() => setShake(false), 600);
          setTimeout(() => setError(false), 2000);
          setInput("");
        }
      };

      return (
        <div style={{ minHeight: "100vh", background: "#1A1035", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <style>{`
            @keyframes shake {
              0%,100%{transform:translateX(0)}
              20%{transform:translateX(-8px)}
              40%{transform:translateX(8px)}
              60%{transform:translateX(-6px)}
              80%{transform:translateX(6px)}
            }
            .gate-box { animation: none; }
            .gate-box.shake { animation: shake 0.5s ease; }
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
          `}</style>
          <div className={"gate-box" + (shake ? " shake" : "")} style={{ background: "#1E1245", border: "2px solid #2D1B69", borderRadius: 16, padding: "48px 40px", maxWidth: 400, width: "100%", textAlign: "center", boxShadow: "0 24px 64px rgba(0,0,0,0.5)" }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>⚡</div>
            <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 900, fontSize: 22, color: "white", letterSpacing: 1, marginBottom: 6 }}>THE FOCUS ENGINE</div>
            <div style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 12, color: "rgba(255,255,255,0.4)", letterSpacing: 2, textTransform: "uppercase", marginBottom: 32 }}>Early Access</div>
            <input
              type="password"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && attempt()}
              placeholder="Enter access code"
              autoFocus
              style={{
                width: "100%", padding: "14px 16px", borderRadius: 8, fontSize: 15,
                background: "rgba(255,255,255,0.07)",
                border: error ? "1.5px solid #E8453C" : "1.5px solid rgba(255,255,255,0.15)",
                color: "white", outline: "none", textAlign: "center",
                fontFamily: "'Montserrat',sans-serif", letterSpacing: 3,
                marginBottom: 12, transition: "border 0.2s",
              }}
            />
            {error && <div style={{ color: "#E8453C", fontSize: 12, fontFamily: "'Montserrat',sans-serif", marginBottom: 12 }}>Incorrect code — try again</div>}
            <button onClick={attempt} style={{
              width: "100%", padding: "14px", borderRadius: 8, border: "none",
              background: "#E8453C", color: "white", cursor: "pointer",
              fontFamily: "'Montserrat',sans-serif", fontWeight: 900, fontSize: 13,
              letterSpacing: 2, textTransform: "uppercase", transition: "opacity 0.2s",
            }}
              onMouseEnter={e => e.currentTarget.style.opacity = "0.85"}
              onMouseLeave={e => e.currentTarget.style.opacity = "1"}
            >Access Tool</button>
            <div style={{ marginTop: 24, fontSize: 11, color: "rgba(255,255,255,0.25)", fontFamily: "'Montserrat',sans-serif" }}>
              TAPL — Tools for the ADHD mind
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PasswordGate />);
  </script>
</body>
</html>
