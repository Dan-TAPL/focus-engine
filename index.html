            </>
          )}

          {/* Progress */}
          <div style={{ marginTop: 8, textAlign: "right" }}>
            <span style={{ ...lbl, fontSize: 10, color: taggedCount === activeTasks.length ? C.green : T.textDim }}>
              {taggedCount}/{activeTasks.length} CATEGORISED
            </span>
          </div>
        </>
      )}

      {/* Navigation */}
      <div style={{ marginTop: 16, display: "flex", justifyContent: "space-between" }}>
        <button onClick={() => setStep(0)} style={{
          background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6,
          padding: "10px 20px", cursor: "pointer",
          ...lbl, fontSize: 11, color: T.textMid, letterSpacing: "1px"
        }}>← BACK</button>
        {taggedCount === activeTasks.length && activeTasks.length > 0 && (
          <button onClick={() => setStep(2)} style={{
            background: C.red, color: "#FFFFFF", border: "none", borderRadius: 6,
            padding: "12px 28px", cursor: "pointer",
            ...lbl, fontSize: 12, letterSpacing: "1.5px"
          }}>BUILD BLOCKS →</button>
        )}
      </div>
    </div>
  );

  // --- Step 3: Build Blocks ---
  const sessionWindow = calcSessionWindow(sessionStart, sessionEnd);
  const usedTime = calcUsedTime(blocks, tasks);
  const remainingTime = sessionWindow - usedTime;
  const available = sortTasks(getAvailableTasks(activeTasks, blocks), sortMode, tasks);

  const addTaskToBlock = (blockId, taskId) => {
    if (!taskId) return;
    const tid = parseInt(taskId);
    const block = blocks.find(b => b.id === blockId);
    if (!block) return;
    const task = tasks.find(t => t.id === tid);
    if (!task) return;
    const bTotal = blockTotal(block, tasks);
    const taskMins = parseInt(task.minutes) || 0;
    if (bTotal + taskMins > block.maxMins) return; // hard cap
    setBlocks(prev => prev.map(b =>
      b.id === blockId ? { ...b, taskIds: [...b.taskIds, tid] } : b
    ));
  };

  const removeTaskFromBlock = (blockId, taskId) => {
    setBlocks(prev => prev.map(b =>
      b.id === blockId ? { ...b, taskIds: b.taskIds.filter(id => id !== taskId) } : b
    ));
  };

  const updateBlock = (blockId, field, value) => {
    setBlocks(prev => prev.map(b =>
      b.id === blockId ? { ...b, [field]: value } : b
    ));
  };

  const addBlock = () => {
    setBlocks(prev => [...prev, createBlock(prev.length + 1)]);
  };

  const removeBlock = (blockId) => {
    setBlocks(prev => prev.filter(b => b.id !== blockId));
  };

  const moveBlock = (blockId, dir) => {
    setBlocks(prev => {
      const idx = prev.findIndex(b => b.id === blockId);
      if ((dir === -1 && idx === 0) || (dir === 1 && idx === prev.length - 1)) return prev;
      const next = [...prev];
      [next[idx], next[idx + dir]] = [next[idx + dir], next[idx]];
      return next;
    });
  };

  const splitTask = (taskId) => {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    const mins = parseInt(task.minutes) || 0;
    if (mins <= 40) return; // nothing to split

    // Calculate split: 40 + remainder (or multiple 40s if very long)
    const chunks = [];
    let remaining = mins;
    while (remaining > 40) {
      chunks.push(40);
      remaining -= 40;
    }
    chunks.push(remaining); // final chunk with the remainder

    // First chunk keeps the original task id
    const newTasks = [...tasks];
    const origIdx = newTasks.findIndex(t => t.id === taskId);
    newTasks[origIdx] = { ...task, minutes: String(chunks[0]), text: `${task.text} (1/${chunks.length})` };

    // Create new tasks for remaining chunks, find empty rows
    const emptyRows = newTasks.filter(t => !((t.text || "").trim())).map(t => t.id);
    const newIds = [];

    for (let i = 1; i < chunks.length; i++) {
      if (emptyRows.length > 0) {
        const emptyId = emptyRows.shift();
        const emptyIdx = newTasks.findIndex(t => t.id === emptyId);
        newTasks[emptyIdx] = {
          ...newTasks[emptyIdx],
          text: `${task.text.replace(/ \(\d+\/\d+\)$/, "")} (${i + 1}/${chunks.length})`,
          minutes: String(chunks[i]),
          quadrant: task.quadrant
        };
        newIds.push(emptyId);
      }
    }

    setTasks(newTasks);

    // If the original task was in a block, add the new chunks to the same block after it
    setBlocks(prev => prev.map(b => {
      const idx = b.taskIds.indexOf(taskId);
      if (idx === -1) return b;
      const newTaskIds = [...b.taskIds];
      newIds.forEach((nid, i) => newTaskIds.splice(idx + 1 + i, 0, nid));
      return { ...b, taskIds: newTaskIds };
    }));
  };

  const renderBuildBlocks = () => (
    <div style={{ padding: "16px 12px", maxWidth: 1100, margin: "0 auto" }}>
      <div style={{ ...lbl, fontSize: 16, color: T.text, marginBottom: 4 }}>BUILD YOUR BLOCKS</div>
      <div style={{ fontSize: 11, color: T.textDim, marginBottom: 16 }}>
        Set each block's max length, choose your break, and assign tasks. Remove a task from a block to return it to the available list.
      </div>

      {/* Session window */}
      <div style={{
        background: T.card, border: `1px solid ${T.border}`, borderRadius: 8,
        padding: "12px 16px", marginBottom: 16, display: "flex", alignItems: "center",
        gap: 12, flexWrap: "wrap"
      }}>
        <span style={{ ...lbl, fontSize: 10, color: T.textDim }}>◷ SESSION WINDOW</span>
        <span style={{ fontSize: 11, color: T.textDim }}>Start</span>
        <input type="time" value={sessionStart} onChange={e => setSessionStart(e.target.value)} style={{
          background: T.inputBg, border: `1px solid ${T.inputBorder}`, borderRadius: 4,
          padding: "4px 8px", color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif"
        }} />
        <span style={{ fontSize: 11, color: T.textDim }}>End</span>
        <input type="time" value={sessionEnd} onChange={e => setSessionEnd(e.target.value)} style={{
          background: T.inputBg, border: `1px solid ${T.inputBorder}`, borderRadius: 4,
          padding: "4px 8px", color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif"
        }} />
        <span style={{ fontSize: 11, color: T.textDim }}>Window: {sessionWindow}m</span>
        <span style={{ fontSize: 11, color: T.textDim }}>Used: {usedTime}m</span>
        <span style={{ fontSize: 11, color: remainingTime >= 0 ? C.green : C.red, fontWeight: 700 }}>
          {remainingTime}m remaining
        </span>
      </div>

      {/* Main layout: sidebar + blocks */}
      <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>

        {/* Available tasks sidebar — sticky */}
        <div style={{ width: 280, flexShrink: 0, position: "sticky", top: 112, alignSelf: "flex-start" }}>
        <div
          onDragOver={e => { if (dragSourceBlock) e.preventDefault(); }}
          onDrop={e => {
            e.preventDefault();
            if (dragTaskId != null && dragSourceBlock) {
              setBlocks(prev => prev.map(b =>
                b.id === dragSourceBlock ? { ...b, taskIds: b.taskIds.filter(id => id !== dragTaskId) } : b
              ));
              setDragTaskId(null);
              setDragSourceBlock(null);
            }
          }}
          style={{
            background: T.card,
            border: `1px solid ${T.border}`, borderRadius: 8, padding: 12,
            maxHeight: "calc(100vh - 200px)", overflowY: "auto"
        }}>
          <div style={{ ...lbl, fontSize: 11, color: T.text, marginBottom: 8 }}>
            AVAILABLE ({available.length})
          </div>
          <div style={{ display: "flex", gap: 4, marginBottom: 10, flexWrap: "wrap" }}>
            {[
              { id: "default", label: "DEFAULT" },
              { id: "time_asc", label: "TIME ↑" },
              { id: "time_desc", label: "TIME ↓" },
              { id: "priority", label: "PRIORITY" }
            ].map(s => (
              <button key={s.id} onClick={() => setSortMode(s.id)} style={{
                padding: "4px 8px", borderRadius: 4, cursor: "pointer",
                background: sortMode === s.id ? C.red : "transparent",
                border: `1px solid ${sortMode === s.id ? C.red : T.border}`,
                color: sortMode === s.id ? "#FFF" : T.textDim,
                ...lbl, fontSize: 8, letterSpacing: "0.5px"
              }}>{s.label}</button>
            ))}
          </div>
          {available.length === 0 ? (
            <div style={{ fontSize: 11, color: T.textFaint, fontStyle: "italic", padding: "8px 0" }}>
              All tasks assigned
            </div>
          ) : available.map(task => {
            const q = getQuad(task.quadrant);
            return (
              <div key={task.id}
                draggable
                onDragStart={e => {
                  setDragTaskId(task.id);
                  setDragSourceBlock(null);
                  e.dataTransfer.effectAllowed = "move";
                }}
                onDragEnd={() => { setDragTaskId(null); setDragOverBlock(null); setDragSourceBlock(null); }}
                style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                  padding: "6px 4px", borderBottom: `1px solid ${T.border}22`,
                  cursor: "grab", opacity: dragTaskId === task.id ? 0.4 : 1,
                  transition: "opacity 0.15s"
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, flex: 1, minWidth: 0 }}>
                  {q && <span style={{ width: 6, height: 6, borderRadius: "50%", background: q.color, flexShrink: 0 }} />}
                  {task.promotedFrom && <span style={{ padding: "1px 4px", borderRadius: 2, background: (task.promotedColor || C.teal) + "20", ...lbl, fontSize: 6, color: task.promotedColor || C.teal, flexShrink: 0 }}>{task.promotedFrom}</span>}
                  <span style={{ fontSize: 11, color: T.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {task.text}
                  </span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0, marginLeft: 4 }}>
                  {(parseInt(task.minutes) || 0) > 40 && (
                    <button onClick={e => { e.stopPropagation(); splitTask(task.id); }} style={{
                      background: "transparent", border: `1px solid ${C.red}44`, borderRadius: 3,
                      padding: "1px 5px", cursor: "pointer", ...lbl, fontSize: 7, color: C.red
                    }}>✂ SPLIT</button>
                  )}
                  <span style={{ ...lbl, fontSize: 9, color: T.textDim }}>
                    {task.minutes || "?"}m
                  </span>
                </div>
              </div>
            );
          })}
        </div>
        {/* Export blocks button — under sidebar */}
        {blocks.some(b => b.taskIds && b.taskIds.length > 0) && (
          <button onClick={() => {
            setIcsModal(true);
            setIcsDate(new Date().toISOString().split("T")[0]);
            setIcsSelectedBlocks(new Set(blocks.filter(b => b.taskIds && b.taskIds.length > 0).map(b => b.id)));
          }} style={{
            width: "100%", marginTop: 8, padding: "10px", borderRadius: 6, cursor: "pointer",
            background: C.teal + "15", border: `1px solid ${C.teal}`,
            ...lbl, fontSize: 9, color: C.teal, letterSpacing: "1px"
          }}>📅 EXPORT BLOCKS TO CALENDAR</button>
        )}
        </div>

        {/* Blocks column */}
        <div style={{ flex: 1 }}>
          {blocks.map((block, bi) => {
            const bTotal = blockTotal(block, tasks);
            const pct = block.maxMins > 0 ? Math.min(100, (bTotal / block.maxMins) * 100) : 0;
            const isFull = bTotal >= block.maxMins;
            const blockAvailable = available.filter(t => {
              const m = parseInt(t.minutes) || 0;
              return m <= (block.maxMins - bTotal);
            });

            return (
              <div key={block.id} style={{
                background: T.card, border: `1px solid ${C.green + "44"}`,
                borderRadius: 8, marginBottom: 12, overflow: "hidden"
              }}>
                {/* Block header */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "10px 12px",
                  borderBottom: `1px solid ${T.border}`, flexWrap: "wrap"
                }}>
                  <span style={{ ...lbl, fontSize: 11, color: isFull ? C.green : T.text }}>
                    {isFull ? "✓ " : ""}BLOCK {bi + 1}
                  </span>
                  <button onClick={() => moveBlock(block.id, -1)} style={{
                    background: "transparent", border: `1px solid ${T.border}`, borderRadius: 3,
                    width: 22, height: 22, cursor: "pointer", color: T.textDim, fontSize: 10
                  }}>↑</button>
                  <button onClick={() => moveBlock(block.id, 1)} style={{
                    background: "transparent", border: `1px solid ${T.border}`, borderRadius: 3,
                    width: 22, height: 22, cursor: "pointer", color: T.textDim, fontSize: 10
                  }}>↓</button>
                  <select value={bi} onChange={e => {
                    const newIdx = parseInt(e.target.value);
                    setBlocks(prev => {
                      const next = [...prev];
                      const [moved] = next.splice(bi, 1);
                      next.splice(newIdx, 0, moved);
                      return next;
                    });
                  }} style={{
                    background: T.inputBg, border: `1px solid ${T.inputBorder}`, borderRadius: 4,
                    padding: "2px 4px", color: T.textDim, fontSize: 10, fontFamily: "'Montserrat', sans-serif",
                    ...lbl, cursor: "pointer"
                  }}>
                    {blocks.map((_, i) => (
                      <option key={i} value={i}>→{i + 1}</option>
                    ))}
                  </select>

                  {/* Progress bar */}
                  <div style={{
                    flex: 1, height: 8, background: T.border, borderRadius: 4, overflow: "hidden", minWidth: 60
                  }}>
                    <div style={{
                      width: `${pct}%`, height: "100%", borderRadius: 4,
                      background: isFull ? C.green : `linear-gradient(90deg, ${C.green}, ${C.teal})`,
                      transition: "width 0.3s"
                    }} />
                  </div>

                  <span style={{ ...lbl, fontSize: 9, color: T.textDim }}>{bTotal}/{block.maxMins}M</span>
                  <span style={{ fontSize: 10, color: T.textDim }}>MAX</span>
                  <select value={block.maxMins} onChange={e => updateBlock(block.id, "maxMins", parseInt(e.target.value))} style={{
                    background: T.inputBg, border: `1px solid ${T.inputBorder}`, borderRadius: 4,
                    padding: "2px 4px", color: T.text, fontSize: 11, fontFamily: "'Montserrat', sans-serif"
                  }}>
                    {[20,25,30,35,40,45,50,55,60].map(v => (
                      <option key={v} value={v}>{v}m</option>
                    ))}
                  </select>
                  <button onClick={() => removeBlock(block.id)} style={{
                    background: "transparent", border: "none", cursor: "pointer",
                    color: C.red, fontSize: 14, padding: "0 4px"
                  }}>✕</button>
                </div>

                {/* Tasks in block */}
                <div
                  onDragOver={e => { e.preventDefault(); setDragOverBlock(block.id); }}
                  onDragLeave={() => setDragOverBlock(null)}
                  onDrop={e => {
                    e.preventDefault();
                    setDragOverBlock(null);
                    if (dragTaskId == null) return;
                    const dragTask = tasks.find(t => t.id === dragTaskId);
                    const dragMins = dragTask ? (parseInt(dragTask.minutes) || 0) : 0;
                    const currentTotal = blockTotal(block, tasks);
                    // If moving within same block, allow (reorder)
                    const isSameBlock = dragSourceBlock === block.id;
                    // Check capacity for new additions
                    if (!isSameBlock && !block.taskIds.includes(dragTaskId)) {
                      if (currentTotal + dragMins > block.maxMins) return; // hard cap
                    }
                    // Remove from source block if dragging between blocks
                    if (dragSourceBlock && dragSourceBlock !== block.id) {
                      setBlocks(prev => prev.map(b =>
                        b.id === dragSourceBlock ? { ...b, taskIds: b.taskIds.filter(id => id !== dragTaskId) } : b
                      ));
                    }
                    // Add to this block if not already in it
                    if (!block.taskIds.includes(dragTaskId)) {
                      setBlocks(prev => prev.map(b =>
                        b.id === block.id ? { ...b, taskIds: [...b.taskIds, dragTaskId] } : b
                      ));
                    }
                    setDragTaskId(null);
                    setDragSourceBlock(null);
                  }}
                  style={{
                    padding: "8px 12px", minHeight: 40,
                    background: dragOverBlock === block.id ? (dark ? "rgba(34,197,94,0.08)" : "rgba(34,197,94,0.05)") : "transparent",
                    border: dragOverBlock === block.id ? `2px dashed ${C.green}44` : "2px dashed transparent",
                    borderRadius: 4, transition: "all 0.15s"
                  }}
                >
                  {block.taskIds.length === 0 ? (
                    <div style={{ color: T.textFaint, fontSize: 11, fontStyle: "italic", padding: "8px 0", textAlign: "center" }}>
                      Drop tasks here or use the menu below
                    </div>
                  ) : (
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                      {block.taskIds.map(tid => {
                        const task = tasks.find(t => t.id === tid);
                        if (!task) return null;
                        const q = getQuad(task.quadrant);
                        return (
                          <div key={tid}
                            draggable
                            onDragStart={e => {
                              setDragTaskId(tid);
                              setDragSourceBlock(block.id);
                              e.dataTransfer.effectAllowed = "move";
                            }}
                            onDragEnd={() => { setDragTaskId(null); setDragOverBlock(null); setDragSourceBlock(null); }}
                            style={{
                              display: "flex", alignItems: "center", gap: 4,
                              background: q ? q.bg : T.border + "44",
                              border: `1px solid ${q ? q.color + "44" : T.border}`,
                              borderRadius: 6, padding: "4px 8px",
                              cursor: "grab", opacity: dragTaskId === tid ? 0.4 : 1
                          }}>
                            {q && <span style={{ width: 6, height: 6, borderRadius: "50%", background: q.color }} />}
                            {task.promotedFrom && <span style={{ padding: "1px 4px", borderRadius: 2, background: (task.promotedColor || C.teal) + "30", ...lbl, fontSize: 6, color: task.promotedColor || C.teal }}>{task.promotedFrom}</span>}
                            <span style={{ fontSize: 11, color: T.text }}>{task.text}</span>
                            <span style={{ ...lbl, fontSize: 9, color: q ? q.color : T.textDim }}>{task.minutes}M</span>
                            <button onClick={() => removeTaskFromBlock(block.id, tid)} style={{
                              background: "transparent", border: "none", cursor: "pointer",
                              color: T.textDim, fontSize: 12, padding: "0 2px"
                            }}>✕</button>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {/* Add task dropdown */}
                  <select
                    value=""
                    onChange={e => addTaskToBlock(block.id, e.target.value)}
                    style={{
                      width: "100%", padding: "6px 8px", background: T.inputBg,
                      border: `1px solid ${T.inputBorder}`, borderRadius: 4,
                      color: T.textDim, fontSize: 11, fontFamily: "'Montserrat', sans-serif"
                    }}
                  >
                    <option value="">+ Add task — {block.maxMins - bTotal}m remaining in Block {bi + 1}...</option>
                    {blockAvailable.map(t => (
                      <option key={t.id} value={t.id}>{t.text} ({t.minutes}m)</option>
                    ))}
                  </select>
                </div>

                {/* Break selector */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "8px 12px",
                  borderTop: `1px solid ${T.border}33`
                }}>
                  <span style={{ ...lbl, fontSize: 9, color: T.textDim }}>BREAK</span>
                  {[5, 10, 15].map(m => (
                    <button key={m} onClick={() => updateBlock(block.id, "breakMins", m)} style={{
                      padding: "3px 8px", borderRadius: 4, cursor: "pointer",
                      background: block.breakMins === m ? C.purple : "transparent",
                      border: `1px solid ${block.breakMins === m ? C.purple : T.border}`,
                      color: block.breakMins === m ? "#FFF" : T.textDim,
                      ...lbl, fontSize: 9
                    }}>{m}M</button>
                  ))}
                  <span style={{ fontSize: 10, color: T.textFaint, marginLeft: 4 }}>
                    — Dopamine reset. Step away from the screen.
                  </span>
                  <button onClick={() => {
                    if (block.taskIds.length === 0) return;
                    setHzSendModal(block.id);
                    setHzSendMode("new");
                    setHzSendName("");
                    setHzSendExisting("");
                  }} style={{
                    marginLeft: "auto", padding: "3px 10px", borderRadius: 4, cursor: "pointer",
                    background: "transparent",
                    border: `1px solid ${C.teal}`,
                    color: C.teal,
                    ...lbl, fontSize: 8,
                    opacity: block.taskIds.length === 0 ? 0.4 : 1
                  }}>◎ SEND TO HORIZON</button>

                  {/* Send to Horizon modal */}
                  {hzSendModal === block.id && (
                    <div style={{
                      position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
                      background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200
                    }} onClick={() => setHzSendModal(null)}>
                      <div onClick={e => e.stopPropagation()} style={{
                        background: T.card, border: `1px solid ${T.border}`, borderRadius: 12,
                        padding: 24, width: 400, maxWidth: "90vw"
                      }}>
                        <div style={{ ...lbl, fontSize: 13, color: T.text, marginBottom: 16 }}>SEND TO HORIZON</div>

                        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                          <button onClick={() => setHzSendMode("new")} style={{
                            flex: 1, padding: "8px", borderRadius: 6, cursor: "pointer",
                            background: hzSendMode === "new" ? C.teal : "transparent",
                            border: `1px solid ${hzSendMode === "new" ? C.teal : T.border}`,
                            color: hzSendMode === "new" ? "#FFF" : T.textMid, ...lbl, fontSize: 9
                          }}>NEW PROJECT</button>
                          <button onClick={() => setHzSendMode("existing")} style={{
                            flex: 1, padding: "8px", borderRadius: 6, cursor: "pointer",
                            background: hzSendMode === "existing" ? C.teal : "transparent",
                            border: `1px solid ${hzSendMode === "existing" ? C.teal : T.border}`,
                            color: hzSendMode === "existing" ? "#FFF" : T.textMid, ...lbl, fontSize: 9
                          }}>EXISTING PROJECT</button>
                        </div>

                        {hzSendMode === "new" ? (
                          <input value={hzSendName} onChange={e => setHzSendName(e.target.value)}
                            placeholder="Project name..." autoFocus
                            style={{ ...({
                              width: "100%", padding: "10px", background: T.inputBg,
                              border: `1px solid ${T.inputBorder}`, borderRadius: 6,
                              color: T.text, fontSize: 13, fontFamily: "'Montserrat', sans-serif", outline: "none"
                            }) }} />
                        ) : (
                          <select value={hzSendExisting} onChange={e => setHzSendExisting(e.target.value)} style={{
                            width: "100%", padding: "10px", background: T.inputBg,
                            border: `1px solid ${T.inputBorder}`, borderRadius: 6,
                            color: T.text, fontSize: 13, fontFamily: "'Montserrat', sans-serif"
                          }}>
                            <option value="">Select a project...</option>
                            {horizonItems.filter(i => i.type === "project" && !i.completed).map(p => (
                              <option key={p.id} value={p.id}>{p.name}</option>
                            ))}
                          </select>
                        )}

                        <div style={{ display: "flex", gap: 8, marginTop: 16, justifyContent: "flex-end" }}>
                          <button onClick={() => setHzSendModal(null)} style={{
                            padding: "8px 16px", borderRadius: 6, cursor: "pointer",
                            background: "transparent", border: `1px solid ${T.border}`,
                            ...lbl, fontSize: 10, color: T.textMid
                          }}>CANCEL</button>
                          <button onClick={() => {
                            if (hzSendMode === "new" && hzSendName.trim()) {
                              sendBlockToHorizon(block.id, hzSendName, null);
                            } else if (hzSendMode === "existing" && hzSendExisting) {
                              sendBlockToHorizon(block.id, null, hzSendExisting);
                            }
                            setHzSendModal(null);
                          }} style={{
                            padding: "8px 16px", borderRadius: 6, cursor: "pointer",
                            background: C.teal, border: "none", color: "#FFF",
                            ...lbl, fontSize: 10,
                            opacity: (hzSendMode === "new" ? hzSendName.trim() : hzSendExisting) ? 1 : 0.4
                          }}>SEND ◎</button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}

          {/* Add block button */}
          <button onClick={addBlock} style={{
            width: "100%", padding: "12px", borderRadius: 8, cursor: "pointer",
            background: "transparent", border: `2px dashed ${T.border}`,
            color: T.textDim, ...lbl, fontSize: 11, letterSpacing: "1px",
            transition: "border-color 0.15s"
          }}>+ ADD ANOTHER BLOCK</button>
        </div>
      </div>

      {/* Navigation */}
      <div style={{ marginTop: 20, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <button onClick={() => setStep(1)} style={{
          background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6,
          padding: "10px 20px", cursor: "pointer",
          ...lbl, fontSize: 11, color: T.textMid, letterSpacing: "1px"
        }}>← BACK</button>
        <div style={{ display: "flex", gap: 8 }}>
          {blocks.some(b => b.taskIds && b.taskIds.length > 0) && (
            <button onClick={() => setStep(3)} style={{
              background: C.red, color: "#FFFFFF", border: "none", borderRadius: 6,
              padding: "12px 28px", cursor: "pointer",
              ...lbl, fontSize: 12, letterSpacing: "1.5px"
            }}>RUN SESSION →</button>
          )}
        </div>
      </div>

      {/* ICS Export Modal */}
      {icsModal && (
        <div style={{
          position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
          background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200
        }} onClick={() => setIcsModal(false)}>
          <div onClick={e => e.stopPropagation()} style={{
            background: T.card, border: `1px solid ${T.border}`, borderRadius: 12,
            padding: 24, width: 450, maxWidth: "90vw"
          }}>
            <div style={{ ...lbl, fontSize: 13, color: T.text, marginBottom: 16 }}>EXPORT BLOCKS TO CALENDAR</div>

            {/* Date & time */}
            <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
              <div style={{ flex: 1 }}>
                <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 4 }}>DATE</div>
                <input type="date" value={icsDate} onChange={e => setIcsDate(e.target.value)} style={{
                  width: "100%", padding: "8px", background: T.inputBg, border: `1px solid ${T.inputBorder}`,
                  borderRadius: 6, color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif",
                  colorScheme: dark ? "dark" : "light"
                }} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 4 }}>START TIME</div>
                <input type="time" value={icsTime} onChange={e => setIcsTime(e.target.value)} style={{
                  width: "100%", padding: "8px", background: T.inputBg, border: `1px solid ${T.inputBorder}`,
                  borderRadius: 6, color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif",
                  colorScheme: dark ? "dark" : "light"
                }} />
              </div>
            </div>

            {/* Block selection */}
            <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 8 }}>SELECT BLOCKS</div>
            {blocks.filter(b => b.taskIds && b.taskIds.length > 0).map((block, bi) => {
              const sel = icsSelectedBlocks.has(block.id);
              const bMins = blockTotal(block, tasks) + (block.breakMins || 0);
              return (
                <div key={block.id} onClick={() => {
                  setIcsSelectedBlocks(prev => {
                    const next = new Set([...prev]);
                    sel ? next.delete(block.id) : next.add(block.id);
                    return next;
                  });
                }} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                  padding: "8px 12px", marginBottom: 4, borderRadius: 6, cursor: "pointer",
                  background: sel ? C.teal + "15" : "transparent",
                  border: `1px solid ${sel ? C.teal : T.border}`
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ ...lbl, fontSize: 10, color: sel ? C.teal : T.textDim }}>
                      {sel ? "✓" : "○"} BLOCK {blocks.indexOf(block) + 1}
                    </span>
                    <span style={{ fontSize: 10, color: T.textDim }}>
                      {block.taskIds.length} task{block.taskIds.length !== 1 ? "s" : ""}
                    </span>
                  </div>
                  <span style={{ ...lbl, fontSize: 10, color: T.textDim }}>{bMins}m</span>
                </div>
              );
            })}

            {/* Total time */}
            {icsSelectedBlocks.size > 0 && (
              <div style={{ marginTop: 8, textAlign: "right", ...lbl, fontSize: 10, color: C.teal }}>
                TOTAL: {blocks.filter(b => icsSelectedBlocks.has(b.id)).reduce((sum, b) => sum + blockTotal(b, tasks) + (b.breakMins || 0), 0)}m
              </div>
            )}

            {/* Actions */}
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
              <button onClick={() => setIcsModal(false)} style={{
                padding: "8px 16px", borderRadius: 6, cursor: "pointer",
                background: "transparent", border: `1px solid ${T.border}`,
                ...lbl, fontSize: 10, color: T.textMid
              }}>CANCEL</button>
              <button onClick={() => {
                if (!icsDate || icsSelectedBlocks.size === 0) return;
                const selectedBlocks = blocks.filter(b => icsSelectedBlocks.has(b.id));
                const events = [];
                let currentStart = new Date(icsDate + "T" + icsTime + ":00");

                selectedBlocks.forEach((block, bi) => {
                  const bTaskMins = blockTotal(block, tasks);
                  const taskList = (block.taskIds || []).map(tid => {
                    const t = tasks.find(tk => tk.id === tid);
                    return t ? `• ${t.text} (${t.minutes || "?"}m)` : "";
                  }).filter(Boolean).join("\n");

                  events.push({
                    title: "Focus Engine — Block " + (blocks.indexOf(block) + 1),
                    description: "Tasks:\\n" + taskList,
                    startDate: currentStart.toISOString(),
                    durationMins: bTaskMins
                  });

                  // Add break as separate event
                  if (block.breakMins && bi < selectedBlocks.length - 1) {
                    const breakStart = new Date(currentStart.getTime() + bTaskMins * 60000);
                    events.push({
                      title: "Focus Engine — Break",
                      description: "Dopamine reset. Step away from the screen.",
                      startDate: breakStart.toISOString(),
                      durationMins: block.breakMins
                    });
                    currentStart = new Date(breakStart.getTime() + block.breakMins * 60000);
                  } else {
                    currentStart = new Date(currentStart.getTime() + bTaskMins * 60000);
                  }
                });

                const ics = generateICS(events);
                downloadICS("focus-engine-session.ics", ics);
                setIcsModal(false);
              }} style={{
                padding: "8px 20px", borderRadius: 6, cursor: "pointer",
                background: C.teal, border: "none", color: "#FFF",
                ...lbl, fontSize: 10,
                opacity: icsDate && icsSelectedBlocks.size > 0 ? 1 : 0.4
              }}>DOWNLOAD .ICS</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  // --- Step 4: Run Session ---
  const currentTaskInfo = (phase === "work" && currentBlock)
    ? getCurrentTask(currentBlock, (blockWorkSeconds(currentBlock, tasks) - timeLeft), tasks, completedTaskIds, skippedTaskIds)
    : null;

  // Update popup state
  useEffect(() => {
    const blockTasks = currentBlock ? getBlockTasks(currentBlock, tasks) : [];
    window.__taplTimer = {
      phase, timeLeft, paused, currentBlockIdx,
      blockCount: runnableBlocks.length,
      currentTaskName: currentTaskInfo && currentTaskInfo.task ? currentTaskInfo.task.text : null,
      taskRemaining: currentTaskInfo ? currentTaskInfo.remaining : 0,
      taskList: blockTasks.map(t => ({
        text: t.text, minutes: t.minutes,
        done: completedTaskIds.has(t.id),
        skipped: skippedTaskIds.has(t.id),
        current: currentTaskInfo && currentTaskInfo.task && currentTaskInfo.task.id === t.id
      })),
      dark
    };
  });

  // Calculate inner ring progress
  const innerRingPct = currentTaskInfo && currentTaskInfo.total > 0
    ? (currentTaskInfo.remaining / currentTaskInfo.total)
    : 0;

  // Calculate outer ring progress
  const outerTotal = currentBlock ? blockWorkSeconds(currentBlock, tasks) : 1;
  const outerRingPct = outerTotal > 0 ? timeLeft / outerTotal : 0;

  // SVG ring helper
  const ring = (radius, pct, color, width) => {
    const circ = 2 * Math.PI * radius;
    const offset = circ * (1 - pct);
    return (
      <circle cx="150" cy="150" r={radius} fill="none"
        stroke={color} strokeWidth={width}
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round"
        transform="rotate(-90 150 150)"
        style={{ transition: "stroke-dashoffset 0.5s linear" }}
      />
    );
  };

  const renderRunSession = () => {
    if (phase === "idle") {
      return (
        <div style={{ padding: "40px 20px", textAlign: "center", maxWidth: 600, margin: "0 auto" }}>
          <div style={{ ...lbl, fontSize: 16, color: T.text, marginBottom: 8 }}>RUN SESSION</div>
          <div style={{ fontSize: 12, color: T.textDim, marginBottom: 24 }}>
            {runnableBlocks.length} block{runnableBlocks.length !== 1 ? "s" : ""} ready to run.
            {runnableBlocks.length === 0 && " Go back to Build Blocks and assign some tasks."}
          </div>
          {runnableBlocks.length > 0 && (
            <>
              {runnableBlocks.map((b, i) => (
                <div key={b.id} style={{
                  background: T.card, border: `1px solid ${T.border}`, borderRadius: 6,
                  padding: "10px 14px", marginBottom: 6, display: "flex",
                  justifyContent: "space-between", alignItems: "center"
                }}>
                  <span style={{ ...lbl, fontSize: 10, color: T.text }}>BLOCK {i + 1}</span>
                  <span style={{ fontSize: 11, color: T.textDim }}>
                    {b.taskIds.length} task{b.taskIds.length !== 1 ? "s" : ""} — {blockTotal(b, tasks)}m work + {b.breakMins}m break
                  </span>
                </div>
              ))}
              <button onClick={startSession} style={{
                background: C.red, color: "#FFFFFF", border: "none", borderRadius: 8,
                padding: "14px 40px", cursor: "pointer", marginTop: 16,
                ...lbl, fontSize: 14, letterSpacing: "2px"
              }}>▶ START SESSION</button>
            </>
          )}
          <div style={{ marginTop: 20 }}>
            <button onClick={() => setStep(2)} style={{
              background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6,
              padding: "10px 20px", cursor: "pointer",
              ...lbl, fontSize: 11, color: T.textMid
            }}>← BACK TO BLOCKS</button>
          </div>
        </div>
      );
    }

    // Countdown
    if (phase === "countdown") {
      return (
        <div style={{ padding: "60px 20px", textAlign: "center" }}>
          <div style={{ ...lbl, fontSize: 14, color: T.textDim, marginBottom: 20 }}>
            BLOCK {currentBlockIdx + 1} — GET READY
          </div>
          <div style={{ fontSize: 120, fontWeight: 900, color: C.red, fontFamily: "'Montserrat', sans-serif" }}>
            {countdownNum > 0 ? countdownNum : "GO!"}
          </div>
        </div>
      );
    }

    // Done
    if (phase === "done") {
      return (
        <div style={{ padding: "60px 20px", textAlign: "center" }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🎉</div>
          <div style={{ ...lbl, fontSize: 18, color: C.green, marginBottom: 8 }}>SESSION COMPLETE</div>
          <div style={{ fontSize: 12, color: T.textDim, marginBottom: 24 }}>
            All blocks finished. Great work.
          </div>
          <button onClick={resetSession} style={{
            background: C.purple, color: "#FFFFFF", border: "none", borderRadius: 6,
            padding: "12px 28px", cursor: "pointer", ...lbl, fontSize: 12
          }}>↻ RESET</button>
        </div>
      );
    }

    // Work or Break phase
    const isWork = phase === "work";
    const blockTasks = currentBlock ? getBlockTasks(currentBlock, tasks) : [];

    return (
      <div style={{ padding: "20px", textAlign: "center", maxWidth: 700, margin: "0 auto" }}>

        {/* Block dots */}
        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 16 }}>
          {runnableBlocks.map((b, i) => (
            <div key={b.id} style={{ textAlign: "center" }}>
              <div style={{
                width: 20, height: 20, borderRadius: "50%",
                background: completedBlockIds.has(b.id) ? C.green
                  : i === currentBlockIdx ? (isWork ? C.red : C.purple)
                  : T.border,
                transition: "background 0.3s"
              }} />
              <div style={{ ...lbl, fontSize: 8, color: T.textDim, marginTop: 2 }}>B{i + 1}</div>
            </div>
          ))}
        </div>

        {/* Phase label */}
        <div style={{ ...lbl, fontSize: 13, color: T.textDim, marginBottom: 16 }}>
          BLOCK {currentBlockIdx + 1} — {isWork ? "WORK TIME" : "BREAK TIME"}
        </div>

        {/* Timer ring */}
        <div style={{ position: "relative", width: 300, height: 300, margin: "0 auto 20px" }}>
          <svg viewBox="0 0 300 300" width="300" height="300">
            {/* Background ring */}
            <circle cx="150" cy="150" r="130" fill="none" stroke={T.border} strokeWidth="8" />
            {/* Outer ring (block) */}
            {ring(130, isWork ? outerRingPct : (timeLeft / (currentBlock ? currentBlock.breakMins * 60 : 1)), isWork ? T.textDim + "88" : C.purple, 8)}
            {/* Inner ring (task) — only during work */}
            {isWork && currentTaskInfo && currentTaskInfo.total > 0 && (
              <>
                <circle cx="150" cy="150" r="110" fill="none" stroke={T.border + "44"} strokeWidth="6" />
                {ring(110, innerRingPct, C.green, 6)}
              </>
            )}
          </svg>
          {/* Time display */}
          <div style={{
            position: "absolute", top: "50%", left: "50%",
            transform: "translate(-50%, -50%)", textAlign: "center"
          }}>
            <div style={{ fontSize: 48, fontWeight: 900, color: T.text, fontFamily: "'Montserrat', sans-serif" }}>
              {formatTime(timeLeft)}
            </div>
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 4 }}>
              {isWork
                ? (currentTaskInfo
                  ? `${currentTaskInfo.task.text}`
                  : "No further tasks scheduled")
                : `${currentBlock ? currentBlock.breakMins : 0} min break`
              }
            </div>
            {isWork && currentTaskInfo && currentTaskInfo.total > 0 && (
              <div style={{ ...lbl, fontSize: 9, color: C.green, marginTop: 4 }}>
                TASK: {formatTime(currentTaskInfo.remaining)}
              </div>
            )}
            {isWork && currentTaskInfo && currentTaskInfo.total === 0 && (
              <div style={{ ...lbl, fontSize: 9, color: T.textFaint, marginTop: 4 }}>
                NO DURATION SET
              </div>
            )}
          </div>
        </div>

        {/* Controls */}
        <div style={{ display: "flex", justifyContent: "center", gap: 10, marginBottom: 10 }}>
          <button onClick={() => setPaused(!paused)} style={{
            background: C.red, color: "#FFF", border: "none", borderRadius: 6,
            padding: "10px 24px", cursor: "pointer", ...lbl, fontSize: 11
          }}>{paused ? "▶ RESUME" : "⏸ PAUSE"}</button>
          <button onClick={skipPhase} style={{
            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6,
            padding: "10px 20px", cursor: "pointer", ...lbl, fontSize: 11, color: T.textMid
          }}>SKIP ▶▶</button>
        </div>

        {/* Reset controls */}
        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 16 }}>
          {isWork && currentTaskInfo && currentTaskInfo.task && (
            <button onClick={resetTask} style={{
              background: "transparent", border: `1px solid ${T.border}`, borderRadius: 4,
              padding: "4px 12px", cursor: "pointer", ...lbl, fontSize: 8, color: T.textDim
            }}>↻ RESET TASK</button>
          )}
          <button onClick={resetBlock} style={{
            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 4,
            padding: "4px 12px", cursor: "pointer", ...lbl, fontSize: 8, color: T.textDim
          }}>↻ RESET BLOCK</button>
          <button onClick={resetSession} style={{
            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 4,
            padding: "4px 12px", cursor: "pointer", ...lbl, fontSize: 8, color: T.textDim
          }}>↻ RESET SESSION</button>
        </div>

        {/* Sound controls */}
        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 20 }}>
          <button onClick={() => setSoundsOn(!soundsOn)} style={{
            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 4,
            padding: "4px 12px", cursor: "pointer",
            ...lbl, fontSize: 9, color: soundsOn ? C.amber : T.textDim
          }}>{soundsOn ? "🔔 SOUNDS ON" : "🔇 SOUNDS OFF"}</button>
          <button onClick={() => AudioEngine.playCountdownBeep()} style={{
            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 4,
            padding: "4px 12px", cursor: "pointer",
            ...lbl, fontSize: 9, color: T.textDim
          }}>▷ TEST SOUND</button>
          <button onClick={openPopoutTimer} style={{
            background: "transparent", border: `1px solid ${C.teal}`, borderRadius: 4,
            padding: "4px 12px", cursor: "pointer",
            ...lbl, fontSize: 9, color: C.teal
          }}>⧉ POP OUT TIMER</button>
        </div>

        {/* Task list */}
        <div style={{
          background: T.card, border: `1px solid ${T.border}`, borderRadius: 8,
          padding: 12, textAlign: "left", maxWidth: 500, margin: "0 auto"
        }}>
          <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 8 }}>
            {isWork ? "THIS BLOCK'S TASKS" : "COMING UP AFTER YOUR BREAK"}
          </div>
          {blockTasks.map(task => {
            const isDone = completedTaskIds.has(task.id);
            const isSkipped = skippedTaskIds.has(task.id);
            const isCurrent = isWork && currentTaskInfo && currentTaskInfo.task && currentTaskInfo.task.id === task.id;
            const q = getQuad(task.quadrant);
            return (
              <div key={task.id} style={{
                display: "flex", alignItems: "center", gap: 8, padding: "6px 4px",
                borderBottom: `1px solid ${T.border}22`,
                opacity: isDone || isSkipped ? 0.4 : 1,
                textDecoration: isDone ? "line-through" : "none"
              }}>
                <input type="checkbox" checked={isDone} onChange={() => {
                  if (isDone) {
                    setCompletedTaskIds(prev => {
                      const next = new Set([...prev]);
                      next.delete(task.id);
                      return next;
                    });
                  } else {
                    completeTask(task.id);
                  }
                }} style={{ cursor: "pointer" }} />
                {q && <span style={{ width: 6, height: 6, borderRadius: "50%", background: q.color, flexShrink: 0 }} />}
                <span style={{ fontSize: 12, color: isCurrent ? T.text : T.textMid, fontWeight: isCurrent ? 700 : 400, flex: 1 }}>
                  {task.text}
                </span>
                {isSkipped && (
                  <span style={{
                    ...lbl, fontSize: 8, padding: "2px 6px", borderRadius: 3,
                    background: "rgba(245,158,11,0.15)", color: C.amber
                  }}>SKIPPED</span>
                )}
                <span style={{ ...lbl, fontSize: 10, color: T.textDim }}>{task.minutes}M</span>
                {isWork && isCurrent && !isDone && !isSkipped && (
                  <button onClick={() => skipTask(task.id)} style={{
                    padding: "2px 8px", borderRadius: 3, cursor: "pointer",
                    background: "transparent", border: `1px solid ${C.amber}`,
                    ...lbl, fontSize: 8, color: C.amber
                  }}>SKIP</button>
                )}
              </div>
            );
          })}

          {/* Task completion prompt */}
          {isWork && currentTaskInfo && currentTaskInfo.remaining <= 0 && currentTaskInfo.total > 0 && (
            <div style={{
              marginTop: 8, padding: "10px 12px", background: C.green + "15",
              border: `1px solid ${C.green}44`, borderRadius: 6, textAlign: "center"
            }}>
              <div style={{ fontSize: 12, color: T.text, marginBottom: 6 }}>
                Has this task been completed?
              </div>
              <button onClick={() => completeTask(currentTaskInfo.task.id)} style={{
                background: C.green, color: "#FFF", border: "none", borderRadius: 4,
                padding: "6px 16px", cursor: "pointer", ...lbl, fontSize: 10
              }}>✓ COMPLETE TASK</button>
            </div>
          )}
        </div>
      </div>
    );
  };

  // --- Horizon Tab ---
  const [hzSendModal, setHzSendModal] = useState(null); // {blockId} for send-to-horizon modal
  const [hzSendMode, setHzSendMode] = useState("new"); // "new" or "existing"
  const [hzSendName, setHzSendName] = useState("");
  const [hzSendExisting, setHzSendExisting] = useState("");

  const startCapture = () => {
    setHzCaptureData({ type: "task", name: "", dueDate: "", dateConfirmed: true, size: "S", chunks: [] });
    setHzCaptureStep(0);
    setHzScreen("capture");
  };

  const finishCapture = () => {
    const d = hzCaptureData;
    const item = createHorizonItem(d.type, d.name, d.dueDate);
    item.dateConfirmed = d.dateConfirmed;
    item.size = d.size;
    if (d.type === "project" && d.chunks && d.chunks.length > 0) {
      item.chunks = d.chunks.filter(c => c.trim()).map((c, i) => ({ id: "chunk_" + Date.now() + "_" + i, name: c, done: false }));
    }
    addHorizonItem(item);
    setHzScreen("dashboard");
  };

  // Input style helper for dark/light mode
  const hzInputStyle = {
    width: "100%", padding: "14px", background: T.inputBg,
    border: `1px solid ${T.inputBorder}`, borderRadius: 8,
    color: T.text, fontSize: 14, fontFamily: "'Montserrat', sans-serif", outline: "none"
  };

  const renderHorizon = () => {
    // --- Edit mode (reuses capture wizard) ---
    if (hzScreen === "edit") {
      const d = hzCaptureData;
      const update = (field, val) => setHzCaptureData(prev => ({ ...prev, [field]: val }));
      const tier = d.dueDate ? getRadarTier(d.dueDate) : null;
      const tierInfo = tier ? TIER_DISPLAY[tier] : null;

      const saveEdit = () => {
        const existing = horizonItems.find(i => i.id === hzEditId);
        if (!existing) return;
        const updates = {
          name: d.name, dueDate: d.dueDate, dateConfirmed: d.dateConfirmed, size: d.size,
          lastReviewed: new Date().toISOString()
        };
        if (existing.type === "project") {
          updates.chunks = (d.chunks || []).filter(c => c.trim()).map((c, i) => {
            const oldChunk = existing.chunks && existing.chunks[i];
            return oldChunk && oldChunk.name === c ? oldChunk : { id: "chunk_" + Date.now() + "_" + i, name: c, done: false };
          });
        }
        updateHorizonItem(hzEditId, updates);
        setHzScreen("dashboard");
        setHzEditId(null);
      };

      return (
        <div style={{ padding: "20px", maxWidth: 550, margin: "0 auto" }}>
          <div style={{ ...lbl, fontSize: 14, color: T.text, marginBottom: 20, textAlign: "center" }}>EDIT {d.type.toUpperCase()}</div>
          <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: "24px" }}>
            {/* Name */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 6 }}>NAME</div>
              <input value={d.name} onChange={e => update("name", e.target.value)} style={hzInputStyle} />
            </div>
            {/* Due date */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 6 }}>DUE DATE</div>
              <input type="date" value={d.dueDate || ""} onChange={e => update("dueDate", e.target.value)}
                style={{ ...hzInputStyle, colorScheme: dark ? "dark" : "light" }} />
              {d.dueDate && tierInfo && (
                <div style={{ marginTop: 6, fontSize: 11, color: tierInfo.color }}>
                  Radar: ● {tierInfo.label} ({TIER_DISPLAY[tier].range})
                </div>
              )}
            </div>
            {/* Confirmed / Suggested */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 6 }}>DATE CONFIDENCE</div>
              <div style={{ display: "flex", gap: 8 }}>
                {[{id:true, label:"CONFIRMED", icon:"◆"},{id:false, label:"SUGGESTED", icon:"◇"}].map(opt => (
                  <button key={String(opt.id)} onClick={() => update("dateConfirmed", opt.id)} style={{
                    flex: 1, padding: "8px", borderRadius: 6, cursor: "pointer",
                    background: d.dateConfirmed === opt.id ? C.teal + "22" : "transparent",
                    border: `1px solid ${d.dateConfirmed === opt.id ? C.teal : T.border}`,
                    ...lbl, fontSize: 9, color: d.dateConfirmed === opt.id ? C.teal : T.textDim
                  }}>{opt.icon} {opt.label}</button>
                ))}
              </div>
            </div>
            {/* Size */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 6 }}>SIZE</div>
              <div style={{ display: "flex", gap: 8 }}>
                {[{id:"S",label:"SMALL"},{id:"M",label:"MEDIUM"},{id:"L",label:"LARGE"}].map(s => (
                  <button key={s.id} onClick={() => update("size", s.id)} style={{
                    flex: 1, padding: "8px", borderRadius: 6, cursor: "pointer",
                    background: d.size === s.id ? C.teal + "22" : "transparent",
                    border: `1px solid ${d.size === s.id ? C.teal : T.border}`,
                    ...lbl, fontSize: 10, color: d.size === s.id ? C.teal : T.textDim
                  }}>{s.id}</button>
                ))}
              </div>
            </div>
            {/* Chunks (projects only) */}
            {d.type === "project" && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 6 }}>STEPS</div>
                {(d.chunks || []).map((chunk, i) => (
                  <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                    <input value={chunk} onChange={e => {
                      const c = [...(d.chunks || [])]; c[i] = e.target.value; update("chunks", c);
                    }} placeholder={`Step ${i + 1}...`} style={{ ...hzInputStyle, padding: "8px" }} />
                    <button onClick={() => {
                      const c = [...(d.chunks || [])]; c.splice(i, 1); update("chunks", c);
                    }} style={{ background: "transparent", border: "none", color: C.red, cursor: "pointer", fontSize: 16 }}>✕</button>
                  </div>
                ))}
                <button onClick={() => update("chunks", [...(d.chunks || []), ""])} style={{
                  padding: "6px 14px", borderRadius: 6, cursor: "pointer", width: "100%",
                  background: "transparent", border: `2px dashed ${T.border}`,
                  ...lbl, fontSize: 9, color: T.textDim
                }}>+ ADD STEP</button>
              </div>
            )}
            {/* Save / Cancel */}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 20 }}>
              <button onClick={() => { setHzScreen("dashboard"); setHzEditId(null); }} style={{
                background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6,
                padding: "10px 20px", cursor: "pointer", ...lbl, fontSize: 10, color: T.textMid
              }}>CANCEL</button>
              <button onClick={saveEdit} style={{
                background: C.teal, color: "#FFF", border: "none", borderRadius: 6,
                padding: "10px 24px", cursor: "pointer", ...lbl, fontSize: 10,
                opacity: d.name.trim() ? 1 : 0.4
              }}>SAVE CHANGES ✓</button>
            </div>
          </div>
        </div>
      );
    }

    // --- Capture wizard ---
    if (hzScreen === "capture") {
      const d = hzCaptureData;
      const update = (field, val) => setHzCaptureData(prev => ({ ...prev, [field]: val }));
      const tier = d.dueDate ? getRadarTier(d.dueDate) : null;
      const tierInfo = tier ? TIER_DISPLAY[tier] : null;

      const totalSteps = d.type === "project" ? 8 : 7;

      const captureSteps = [
        // Step 0: Type
        () => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 8 }}>What are you capturing?</div>
            <div style={{ fontSize: 12, color: T.textDim, marginBottom: 24 }}>
              A task is a single action. A project has multiple steps. This can't be changed later.
            </div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
              {[{id:"task",icon:"✓",label:"Single Task"},{id:"project",icon:"▦",label:"Project"}].map(t => (
                <button key={t.id} onClick={() => { update("type", t.id); setHzCaptureStep(1); }} style={{
                  padding: "24px 32px", borderRadius: 8, cursor: "pointer",
                  background: T.card, border: `2px solid ${d.type === t.id ? C.teal : T.border}`,
                  ...lbl, fontSize: 14, color: T.text, transition: "all 0.15s"
                }}>{t.icon} {t.label}</button>
              ))}
            </div>
          </div>
        ),
        // Step 1: Name
        () => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 8 }}>What is it?</div>
            <div style={{ fontSize: 12, color: T.textDim, marginBottom: 20 }}>Give it a short, clear name.</div>
            <input value={d.name} onChange={e => update("name", e.target.value)}
              placeholder="e.g. Q2 Board Presentation" autoFocus
              style={hzInputStyle} />
          </div>
        ),
        // Step 2: Due date
        () => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 8 }}>When does this need to be done?</div>
            <div style={{ fontSize: 12, color: T.textDim, marginBottom: 20 }}>Pick a completion date — even a rough one. You can change it later.</div>
            <input type="date" value={d.dueDate || ""} onChange={e => update("dueDate", e.target.value)}
              style={{ ...hzInputStyle, maxWidth: 300, margin: "0 auto", display: "block", colorScheme: dark ? "dark" : "light" }} />
            {d.dueDate && tierInfo && (
              <div style={{
                display: "inline-block", marginTop: 12, padding: "8px 16px",
                background: tierInfo.color + "15", borderRadius: 6,
                fontSize: 12, color: tierInfo.color
              }}>Radar: {tierInfo.label} ({TIER_DISPLAY[tier].range})</div>
            )}
          </div>
        ),
        // Step 3: Confirmed / Suggested
        () => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 8 }}>Is that date locked in?</div>
            <div style={{ fontSize: 12, color: T.textDim, marginBottom: 24 }}>Confirmed = hard deadline. Suggested = your best guess.</div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
              {[{id:true,icon:"◆",label:"Confirmed"},{id:false,icon:"◇",label:"Suggested"}].map(opt => (
                <button key={String(opt.id)} onClick={() => { update("dateConfirmed", opt.id); setHzCaptureStep(prev => prev + 1); }} style={{
                  padding: "24px 32px", borderRadius: 8, cursor: "pointer",
                  background: T.card, border: `2px solid ${d.dateConfirmed === opt.id ? C.teal : T.border}`,
                  fontSize: 14, fontWeight: 700, color: T.text, transition: "all 0.15s"
                }}>{opt.icon} {opt.label}</button>
              ))}
            </div>
          </div>
        ),
        // Step 4: Size
        () => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 8 }}>How big is this?</div>
            <div style={{ fontSize: 12, color: T.textDim, marginBottom: 24 }}>A rough sense of effort. Don't overthink it.</div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
              {[{id:"S",label:"Small",desc:"Under an hour"},{id:"M",label:"Medium",desc:"A few hours"},{id:"L",label:"Large",desc:"Multiple sessions"}].map(s => (
                <button key={s.id} onClick={() => { update("size", s.id); setHzCaptureStep(prev => prev + 1); }} style={{
                  padding: "20px 24px", borderRadius: 8, cursor: "pointer", textAlign: "center",
                  background: T.card, border: `2px solid ${d.size === s.id ? C.teal : T.border}`,
                  transition: "all 0.15s", minWidth: 120
                }}>
                  <div style={{ ...lbl, fontSize: 24, color: C.teal }}>{s.id}</div>
                  <div style={{ fontWeight: 700, fontSize: 12, color: T.text, marginTop: 4 }}>{s.label}</div>
                  <div style={{ fontSize: 10, color: T.textDim, marginTop: 2 }}>{s.desc}</div>
                </button>
              ))}
            </div>
          </div>
        ),
        // Step 5: Radar tier (auto, info only)
        () => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 8 }}>Radar Tier</div>
            <div style={{ fontSize: 12, color: T.textDim, marginBottom: 20 }}>Based on your completion date, this item sits at:</div>
            {tierInfo ? (
              <div style={{
                display: "inline-block", padding: "16px 32px", borderRadius: 8,
                background: tierInfo.color + "15", border: `1px solid ${tierInfo.color}33`,
                fontSize: 16, fontWeight: 700, color: tierInfo.color
              }}>● {tierInfo.label} ({TIER_DISPLAY[tier].range})</div>
            ) : (
              <div style={{ padding: "16px 32px", background: T.card, borderRadius: 8, color: T.textDim }}>
                No date set — will appear in SOMEDAY
              </div>
            )}
            <div style={{ fontSize: 11, color: T.textFaint, marginTop: 12 }}>This updates automatically as the date approaches.</div>
          </div>
        ),
        // Step 6: Break it down (projects only) or Summary (tasks)
        ...(d.type === "project" ? [() => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 8 }}>Break It Down</div>
            <div style={{ fontSize: 12, color: T.textDim, marginBottom: 16 }}>Add the steps or sub-tasks. You can skip this.</div>
            <div style={{ maxWidth: 400, margin: "0 auto", textAlign: "left" }}>
              {(d.chunks || []).map((chunk, i) => (
                <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                  <input value={chunk} onChange={e => {
                    const c = [...(d.chunks || [])]; c[i] = e.target.value; update("chunks", c);
                  }} placeholder={`Step ${i + 1}...`} style={{ ...hzInputStyle, padding: "10px" }} />
                  <button onClick={() => {
                    const c = [...(d.chunks || [])]; c.splice(i, 1); update("chunks", c);
                  }} style={{ background: "transparent", border: "none", color: C.red, cursor: "pointer", fontSize: 16 }}>✕</button>
                </div>
              ))}
              <button onClick={() => update("chunks", [...(d.chunks || []), ""])} style={{
                padding: "8px 16px", borderRadius: 6, cursor: "pointer", width: "100%",
                background: "transparent", border: `2px dashed ${T.border}`,
                ...lbl, fontSize: 10, color: T.textDim
              }}>+ ADD STEP</button>
            </div>
          </div>
        )] : []),
        // Final: Summary
        () => (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 16 }}>Ready to save?</div>
            <div style={{
              background: T.card, border: `1px solid ${T.border}`, borderRadius: 8,
              padding: 16, maxWidth: 400, margin: "0 auto", textAlign: "left"
            }}>
              {[
                { label: "TYPE", value: d.type === "project" ? "▦ Project" : "✓ Task" },
                { label: "NAME", value: d.name },
                { label: "DUE", value: d.dueDate ? `${new Date(d.dueDate).toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"})} ${d.dateConfirmed ? "◆ Confirmed" : "◇ Suggested"}` : "No date" },
                { label: "SIZE", value: d.size === "S" ? "Small — Under an hour" : d.size === "M" ? "Medium — A few hours" : "Large — Multiple sessions" },
                { label: "RADAR", value: tierInfo ? `● ${tierInfo.label} (${TIER_DISPLAY[tier].range})` : "SOMEDAY" }
              ].map(row => (
                <div key={row.label} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                  padding: "10px 12px", borderBottom: `1px solid ${T.border}22`
                }}>
                  <span style={{ ...lbl, fontSize: 10, color: T.textDim }}>{row.label}</span>
                  <span style={{ fontSize: 12, color: T.text, fontWeight: 600 }}>{row.value}</span>
                </div>
              ))}
              {d.type === "project" && d.chunks && d.chunks.filter(c => c.trim()).length > 0 && (
                <div style={{ padding: "10px 12px" }}>
                  <span style={{ ...lbl, fontSize: 10, color: T.textDim }}>STEPS</span>
                  {d.chunks.filter(c => c.trim()).map((c, i) => (
                    <div key={i} style={{ fontSize: 11, color: T.text, marginTop: 4 }}>{i + 1}. {c}</div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )
      ];

      const canNext = hzCaptureStep === 0 ? true
        : hzCaptureStep === 1 ? d.name.trim()
        : true;
      const isLast = hzCaptureStep === captureSteps.length - 1;

      return (
        <div style={{ padding: "20px", maxWidth: 550, margin: "0 auto" }}>
          <div style={{ display: "flex", gap: 6, justifyContent: "center", marginBottom: 24 }}>
            {captureSteps.map((_, i) => (
              <div key={i} style={{
                width: 10, height: 10, borderRadius: "50%",
                background: i <= hzCaptureStep ? C.teal : T.border, transition: "background 0.2s"
              }} />
            ))}
          </div>
          <div style={{
            background: T.card, border: `1px solid ${T.border}`, borderRadius: 12,
            padding: "32px 24px"
          }}>
            {captureSteps[hzCaptureStep]()}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 24 }}>
              <button onClick={() => {
                if (hzCaptureStep === 0) setHzScreen("dashboard");
                else setHzCaptureStep(prev => prev - 1);
              }} style={{
                background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6,
                padding: "10px 20px", cursor: "pointer", ...lbl, fontSize: 10, color: T.textMid
              }}>← BACK</button>
              {canNext && hzCaptureStep > 0 && (
                <button onClick={() => {
                  if (isLast) finishCapture();
                  else setHzCaptureStep(prev => prev + 1);
                }} style={{
                  background: C.teal, color: "#FFF", border: "none", borderRadius: 6,
                  padding: "10px 24px", cursor: "pointer", ...lbl, fontSize: 10
                }}>{isLast ? "SAVE TO HORIZON ✓" : "NEXT →"}</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- Dashboard ---
    const tiers = ["close", "mid", "long", "someday"];
    const hzProjects = activeHzItems.filter(i => i.type === "project");
    const needsAttention = activeHzItems.filter(i => isOverdueForReview(i));
    const pastDueItems = activeHzItems.filter(i => isPastDue(i));

    return (

                      <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 16 }}>

                      </div>
                    </div>
                    {/* Row 2: Meta info */}
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 6, flexWrap: "wrap" }}>
                      {item.dueDate && <span style={{ fontSize: 11, color: T.textDim }}>
                        {new Date(item.dueDate).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                      </span>}
                      {item.dueDate && (
                        <span style={{
                          padding: "2px 8px", borderRadius: 4, fontSize: 9, ...lbl,
                          background: item.dateConfirmed ? C.green + "15" : C.amber + "15",
                          color: item.dateConfirmed ? C.green : C.amber,
                          border: `1px solid ${item.dateConfirmed ? C.green + "33" : C.amber + "33"}`
                        }}>{item.dateConfirmed ? "◆ CONFIRMED" : "◇ SUGGESTED"}</span>
                      )}
                      {item.size && (
                        <span style={{
                          padding: "2px 8px", borderRadius: 4, fontSize: 9, ...lbl,
                          background: T.border + "44", color: T.textDim
                        }}>SIZE: {item.size}</span>
                      )}
                      {chunksTotal > 0 && (
                        <span style={{ fontSize: 10, color: T.textDim }}>{chunksDone}/{chunksTotal} steps</span>
                      )}
                      {item.promoted && (
                        <span style={{
                          padding: "2px 8px", borderRadius: 4, fontSize: 8, ...lbl,
                          background: C.green + "15", color: C.green, border: `1px solid ${C.green}33`
                        }}>PROMOTED</span>
                      )}
                    </div>
                    {chunksTotal > 0 && item.chunks && (
                      <div style={{ marginTop: 6 }}>

                              updateHorizonItem(item.id, { chunks: item.chunks.map(c => c.id === chunk.id ? { ...c, done: !c.done } : c) });

                        setHzIcsChunks(chunkIds);
                        setHzIcsDuration(item.size === "L" ? 120 : item.size === "M" ? 60 : 30);

                        padding: "4px 10px", borderRadius: 4, cursor: "pointer",

                      }}>📅 EXPORT</button>

                        setHzEditId(item.id);

                        }} onClick={() => setHzIcsModal(null)}>
                          <div onClick={e => e.stopPropagation()} style={{
                            background: T.card, border: `1px solid ${T.border}`, borderRadius: 12,
                            padding: 24, width: 480, maxWidth: "90vw", maxHeight: "85vh", overflowY: "auto"
                          }}>
                            <div style={{ ...lbl, fontSize: 13, color: T.text, marginBottom: 4 }}>EXPORT TO CALENDAR</div>
                            <div style={{ fontSize: 11, color: T.textDim, marginBottom: 16 }}>{item.name}</div>

                            {/* Mode toggle */}
                            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>

                                <button key={m.id} onClick={() => setHzIcsType(m.id)} style={{
                                  flex: 1, padding: "10px 8px", borderRadius: 6, cursor: "pointer", textAlign: "center",
                                  background: hzIcsType === m.id ? C.teal + "22" : "transparent",
                                  border: `1px solid ${hzIcsType === m.id ? C.teal : T.border}`
                                }}>
                                  <div style={{ ...lbl, fontSize: 9, color: hzIcsType === m.id ? C.teal : T.textMid }}>{m.label}</div>
                                  <div style={{ fontSize: 9, color: T.textDim, marginTop: 2 }}>{m.desc}</div>
                                </button>
                              ))}
                            </div>

                            {hzIcsType === "reminders" ? (
                              <>
                                <div style={{ fontSize: 11, color: T.textDim, marginBottom: 12 }}>
                                  Creates calendar reminders at regular intervals leading up to the due date. Each reminder is a 15-minute event prompting you to check in.
                                </div>
                                <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 4 }}>REMINDER FREQUENCY</div>
                                <select value={hzIcsSessions} onChange={e => setHzIcsSessions(parseInt(e.target.value))} style={{
                                  width: "100%", padding: "8px", background: T.inputBg, border: `1px solid ${T.inputBorder}`,
                                  borderRadius: 6, color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif", marginBottom: 12
                                }}>
                                  <option value={1}>Daily</option>
                                  <option value={3}>Every 3 days</option>
                                  <option value={7}>Weekly</option>
                                  <option value={14}>Fortnightly</option>
                                </select>
                                <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                                  <div style={{ flex: 1 }}>
                                    <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 4 }}>REMINDER TIME</div>
                                    <input type="time" value={hzIcsTime} onChange={e => setHzIcsTime(e.target.value)} style={{
                                      width: "100%", padding: "8px", background: T.inputBg, border: `1px solid ${T.inputBorder}`,
                                      borderRadius: 6, color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif",
                                      colorScheme: dark ? "dark" : "light"
                                    }} />
                                  </div>
                                </div>
                              </>
                            ) : (
                              <>
                                <div style={{ fontSize: 11, color: T.textDim, marginBottom: 12 }}>
                                  Creates work sessions spread between now and the due date. Pick how many sessions and how long each one is.
                                </div>
                                <div style={{ display: "flex", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
                                  <div style={{ flex: 1, minWidth: 100 }}>
                                    <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 4 }}>SESSIONS</div>
                                    <select value={hzIcsSessions} onChange={e => setHzIcsSessions(parseInt(e.target.value))} style={{
                                      width: "100%", padding: "8px", background: T.inputBg, border: `1px solid ${T.inputBorder}`,
                                      borderRadius: 6, color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif"
                                    }}>
                                      {[1,2,3,4,5,6,8,10].map(n => <option key={n} value={n}>{n} session{n > 1 ? "s" : ""}</option>)}
