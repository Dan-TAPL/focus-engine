<!-- TAPL Modules (bundled) -->
<script>
// TAPL Focus Engine — Core Module
// Colours, themes, constants, shared styles, localStorage

const C = {
  purple: "#2D1B69",
  purpleLight: "#3D2B79",
  red: "#E8453C",
  redDark: "#C73830",
  green: "#22C55E",
  greenDark: "#1EA34E",
  amber: "#F59E0B",
  teal: "#0891B2",
  darkBg: "#1A1035",
  darkCard: "#241850",
  darkBorder: "#3D2B79",
  lightBg: "#F3F0FF",
  lightCard: "#FFFFFF",
  lightBorder: "#E2DDF0"
};

const darkTheme = {
  bg: C.darkBg,
  card: C.darkCard,
  border: C.darkBorder,
  text: "#FFFFFF",
  textMid: "#B8B0CC",
  textDim: "#8B80A5",
  textFaint: "#6B6080",
  header: C.purple,
  inputBg: "#1E1245",
  inputBorder: "#3D2B79",
  rowHover: "rgba(45,27,105,0.3)",
  shadow: "0 2px 8px rgba(0,0,0,0.3)"

const lightTheme = {

  card: C.lightCard,
  border: C.lightBorder,
  text: "#1A1035",
  textMid: "#6B6080",
  textDim: "#8B80A5",
  textFaint: "#B8B0CC",
  header: C.purple,
  inputBg: "#FFFFFF",
  inputBorder: "#E2DDF0",
  rowHover: "rgba(45,27,105,0.08)",
  shadow: "0 2px 8px rgba(0,0,0,0.08)"
};

// Quadrant categories for Step 2
const QUADRANTS = [
  { id: "important_urgent", label: "DO", desc: "High Importance / High Urgency", short: "DO", color: "#22C55E", bg: "rgba(34,197,94,0.15)" },
  { id: "important_not_urgent", label: "PLAN", desc: "High Importance / Low Urgency", short: "PLAN", color: "#F59E0B", bg: "rgba(245,158,11,0.15)" },
  { id: "not_important_urgent", label: "REACT", desc: "Low Importance / High Urgency", short: "REACT", color: "#E8453C", bg: "rgba(232,69,60,0.15)" },
  { id: "not_important_not_urgent", label: "DROP", desc: "Low Importance / Low Urgency", short: "DROP", color: "#6B6080", bg: "rgba(107,96,128,0.15)" }
];

// Quadrant shortcodes for compact buttons
const QUAD_BUTTONS = [
  { id: "important_urgent", code: "HH", label: "DO" },
  { id: "important_not_urgent", code: "HL", label: "PLAN" },
  { id: "not_important_urgent", code: "LH", label: "REACT" },
  { id: "not_important_not_urgent", code: "LL", label: "DROP" }
];

// Time buckets for categorise view
const TIME_BUCKETS = [
  { id: "5", label: "UP TO 5 MINS", max: 5, color: "#22C55E" },
  { id: "30", label: "UP TO 30 MINS", max: 30, color: "#0891B2" },
  { id: "60", label: "UP TO 60 MINS", max: 60, color: "#F59E0B" },
  { id: "60+", label: "60+ MINS", max: Infinity, color: "#E8453C" }
];

// Shared label style
const lbl = {
  fontFamily: "'Montserrat', sans-serif",
  fontWeight: 900,
  textTransform: "uppercase",
  letterSpacing: "1.5px"
};

// Horizon radar tiers
const RADAR = {
  close: { label: "NOW — ≤7 DAYS", color: C.red, bg: "rgba(232,69,60,0.12)", desc: "Needs attention this week" },
  mid: { label: "SOON — 8–21 DAYS", color: C.amber, bg: "rgba(245,158,11,0.12)", desc: "Coming up in 2-3 weeks" },
  long: { label: "LATER — 22–60 DAYS", color: C.teal, bg: "rgba(8,145,178,0.12)", desc: "On the horizon, not yet urgent" },
  someday: { label: "SOMEDAY — 60+ DAYS", color: C.green, bg: "rgba(34,197,94,0.12)", desc: "Far out, just keeping track" }
};

// localStorage helpers
function loadData(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch(e) { return fallback; }
}

function saveData(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch(e) { console.error("Save failed:", e); }
}
// TAPL Focus Engine — Audio Module
// Web Audio API tone generator for timer alerts

const AudioEngine = (function() {
  let ctx = null;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  function playTone(freq, duration, type) {
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + duration);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration);
    } catch(e) {}
  }

  function playCountdownBeep() {
    playTone(880, 0.15, "sine");
  }

  function playGoBeep() {
    playTone(1200, 0.3, "sine");
  }

  function playBlockComplete() {
    [0, 150, 300].forEach((delay, i) => {
      setTimeout(() => playTone(660 + (i * 220), 0.25, "sine"), delay);
    });
  }

  function playTaskComplete() {
    playTone(880, 0.12, "triangle");
    setTimeout(() => playTone(1100, 0.15, "triangle"), 100);
  }

  function playSessionComplete() {
    [0, 200, 400, 600].forEach((delay, i) => {
      setTimeout(() => playTone(523 + (i * 131), 0.35, "sine"), delay);
    });
  }

  function playBreakStart() {
    playTone(440, 0.3, "sine");
    setTimeout(() => playTone(550, 0.3, "sine"), 200);
  }

  return {
    playCountdownBeep,
    playGoBeep,
    playBlockComplete,
    playTaskComplete,
    playSessionComplete,
    playBreakStart
  };
})();
// TAPL Focus Engine — Block Management Logic
// Sorting, time calculations, block helpers

// Sort available tasks by different criteria
function sortTasks(taskList, mode, allTasks) {
  const list = [...taskList];
  switch(mode) {
    case "time_asc":
      return list.sort((a, b) => (parseInt(a.minutes) || 0) - (parseInt(b.minutes) || 0));
    case "time_desc":
      return list.sort((a, b) => (parseInt(b.minutes) || 0) - (parseInt(a.minutes) || 0));
    case "priority":
      const order = ["important_urgent", "not_important_urgent", "important_not_urgent", "not_important_not_urgent"];
      return list.sort((a, b) => order.indexOf(a.quadrant) - order.indexOf(b.quadrant));
    default:
      // Default = original order (by index in allTasks)
      return list.sort((a, b) => allTasks.indexOf(a) - allTasks.indexOf(b));
  }
}

// Calculate total minutes in a block
function blockTotal(block, tasks) {
  if (!block.taskIds) return 0;
  return block.taskIds.reduce((sum, id) => {
    const t = tasks.find(tk => tk.id === id);
    return sum + (t ? (parseInt(t.minutes) || 0) : 0);
  }, 0);
}

// Calculate session window in minutes from start/end times
function calcSessionWindow(startTime, endTime) {
  const [sh, sm] = startTime.split(":").map(Number);
  const [eh, em] = endTime.split(":").map(Number);
  let startMins = sh * 60 + sm;
  let endMins = eh * 60 + em;
  if (endMins <= startMins) endMins += 24 * 60; // crosses midnight
  return endMins - startMins;
}

// Calculate total used time across all blocks (task time + break time)
function calcUsedTime(blocks, tasks) {
  return blocks.reduce((sum, b) => {
    return sum + blockTotal(b, tasks) + (b.breakMins || 0);
  }, 0);
}

// Get available tasks (not assigned to any block)
function getAvailableTasks(activeTasks, blocks) {
  const assigned = new Set();
  blocks.forEach(b => (b.taskIds || []).forEach(id => assigned.add(id)));
  return activeTasks.filter(t => !assigned.has(t.id));
}

// Create a new empty block
function createBlock(blockNum) {
  return {
    id: "block_" + Date.now() + "_" + blockNum,
    taskIds: [],
    maxMins: 40,
    breakMins: 10,
    deferred: false
  };
}

// Default blocks setup (3 blocks)
function defaultBlocks() {
  return [createBlock(1), createBlock(2), createBlock(3)];
}
// TAPL Focus Engine — Timer Logic
// Countdown calculations, phase management, time formatting

// Format seconds as MM:SS
function formatTime(secs) {
  if (secs < 0) secs = 0;
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

// Get non-deferred blocks only (the ones that actually run)
function getRunnableBlocks(blocks) {
  return blocks.filter(b => !b.deferred && b.taskIds && b.taskIds.length > 0);
}

// Get tasks for a specific block
function getBlockTasks(block, allTasks) {
  return block.taskIds.map(id => allTasks.find(t => t.id === id)).filter(Boolean);
}

// Calculate total seconds for a block's work phase
function blockWorkSeconds(block, allTasks) {
  return block.taskIds.reduce((sum, id) => {
    const t = allTasks.find(tk => tk.id === id);
    return sum + (t ? (parseInt(t.minutes) || 0) * 60 : 0);
  }, 0);
}

// Calculate task deadline within a block (cumulative seconds up to and including this task)
function taskDeadline(block, taskId, allTasks) {
  let cumulative = 0;
  for (const id of block.taskIds) {
    const t = allTasks.find(tk => tk.id === id);
    cumulative += (t ? (parseInt(t.minutes) || 0) * 60 : 0);
    if (id === taskId) return cumulative;
  }
  return cumulative;
}

// Calculate task start time within a block (cumulative seconds before this task)
function taskStartTime(block, taskId, allTasks) {
  let cumulative = 0;
  for (const id of block.taskIds) {
    if (id === taskId) return cumulative;
    const t = allTasks.find(tk => tk.id === id);
    cumulative += (t ? (parseInt(t.minutes) || 0) * 60 : 0);
  }
  return cumulative;
}

// Get current task based on elapsed time in block
function getCurrentTask(block, elapsedSecs, allTasks, completedTaskIds, skippedTaskIds) {
  let cumulative = 0;
  for (const id of block.taskIds) {
    if (completedTaskIds.has(id) || skippedTaskIds.has(id)) continue;
    const t = allTasks.find(tk => tk.id === id);
    const dur = (t ? (parseInt(t.minutes) || 0) * 60 : 0);
    if (dur === 0) return { task: t, remaining: 0, total: 0 }; // no duration
    cumulative += dur;
    const remaining = cumulative - elapsedSecs;
    if (remaining > 0) return { task: t, remaining, total: dur };
  }
  return null; // all tasks done
}
// TAPL Focus Engine — Horizon Logic
// Data management, radar tier calculations, promote/demote helpers

// Calculate days until a date
function daysUntil(dateStr) {
  if (!dateStr) return Infinity;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  target.setHours(0, 0, 0, 0);
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

// Get radar tier based on days remaining
function getRadarTier(dateStr) {
  const days = daysUntil(dateStr);
  if (days <= 7) return "close";
  if (days <= 21) return "mid";
  if (days <= 60) return "long";
  return "someday";
}

// Tier display info
const TIER_DISPLAY = {
  close: { label: "NOW", range: "7 days or less", color: "#E8453C" },
  mid: { label: "SOON", range: "8–21 days", color: "#F59E0B" },
  long: { label: "LATER", range: "22–60 days", color: "#0891B2" },
  someday: { label: "SOMEDAY", range: "60+ days", color: "#22C55E" }
};

// Create a new Horizon item
function createHorizonItem(type, name, dueDate) {
  return {
    id: "hz_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
    type: type, // "task" or "project"
    name: name,
    dueDate: dueDate || "",
    triggerDate: "",
    chunks: [], // for projects: [{id, name, done}]
    completed: false,
    createdAt: new Date().toISOString(),
    lastReviewed: new Date().toISOString()
  };
}

// Review cadence in days per radar tier
const REVIEW_CADENCE = {
  close: 1,    // NOW: daily
  mid: 3,      // SOON: every 3 days
  long: 7,     // LATER: weekly
  someday: 14  // SOMEDAY: fortnightly
};

// Calculate days since last review
function daysSinceReview(item) {
  if (!item.lastReviewed) return Infinity;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const last = new Date(item.lastReviewed);
  last.setHours(0, 0, 0, 0);
  return Math.floor((now - last) / (1000 * 60 * 60 * 24));
}

// Check if an item is overdue for review
function isOverdueForReview(item) {
  const tier = getRadarTier(item.dueDate);
  const cadence = REVIEW_CADENCE[tier];
  return daysSinceReview(item) >= cadence;
}

// Get escalation level: 0 = fine, 1 = needs review (amber), 2 = significantly overdue (red)
function getEscalationLevel(item) {
  const tier = getRadarTier(item.dueDate);
  const cadence = REVIEW_CADENCE[tier];
  const daysSince = daysSinceReview(item);
  if (daysSince < cadence) return 0;
  if (daysSince < cadence * 2) return 1; // amber — overdue by one cycle
  return 2; // red — overdue by two+ cycles
}

// Check if item is past due date
function isPastDue(item) {
  if (!item.dueDate) return false;
  return daysUntil(item.dueDate) < 0;
}

// Create a Horizon project from Brain Dump tasks
function createProjectFromTasks(projectName, taskTexts, dueDate) {
  const item = createHorizonItem("project", projectName, dueDate);
  item.chunks = taskTexts.map((text, i) => ({
    id: "chunk_" + Date.now() + "_" + i,
    name: text,
    done: false
  }));
  return item;
}

// Get tasks from a Horizon item ready to promote to Brain Dump
function getPromotableTasks(item) {
  if (item.type === "task") {
    return [{ text: item.name, minutes: "" }];
  }
  // Project: return undone chunks
  return item.chunks
    .filter(c => !c.done)
    .map(c => ({ text: c.name, minutes: "" }));
}

// Load Horizon data (separate from session data)
function loadHorizon() {
  return loadData("tapl-horizon", []);
}

// Save Horizon data
function saveHorizon(items) {
  saveData("tapl-horizon", items);
}

// ICS Calendar Export
function generateICS(events) {
  // events: [{title, description, startDate, durationMins}]
  let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//TAPL//Focus Engine//EN\nCALSCALE:GREGORIAN\n";

  events.forEach(evt => {
    const start = new Date(evt.startDate);
    const end = new Date(start.getTime() + evt.durationMins * 60000);
    const fmt = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    const uid = "tapl-" + Date.now() + "-" + Math.random().toString(36).substr(2, 8) + "@focusengine";

    ics += "BEGIN:VEVENT\n";
    ics += "UID:" + uid + "\n";
    ics += "DTSTART:" + fmt(start) + "\n";
    ics += "DTEND:" + fmt(end) + "\n";
    ics += "SUMMARY:" + (evt.title || "Focus Engine Session") + "\n";
    if (evt.description) {
      ics += "DESCRIPTION:" + evt.description.replace(/\n/g, "\\n") + "\n";
    }
    ics += "STATUS:CONFIRMED\n";
    ics += "END:VEVENT\n";
  });

  ics += "END:VCALENDAR";
  return ics;
}

function downloadICS(filename, icsContent) {
  const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// CSV Export — tasks with all metadata
function exportTasksCSV(tasks) {
  const headers = ["#", "Task", "Minutes", "Quadrant", "Source Project"];
  const rows = tasks
    .filter(t => (t.text || "").trim())
    .map((t, i) => [
      i + 1,
      '"' + (t.text || "").replace(/"/g, '""') + '"',
      t.minutes || "",
      t.quadrant || "",
      t.promotedFrom || ""
    ]);
  const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "focus-engine-session.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// CSV Import — reads a CSV and returns task objects
function parseCSV(csvText) {
  const lines = csvText.split("\n").filter(l => l.trim());
  if (lines.length < 2) return [];
  // Skip header row
  const dataLines = lines.slice(1);
  return dataLines.map(line => {
    // Handle quoted fields
    const fields = [];
    let current = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; continue; }
      if (ch === ',' && !inQuotes) { fields.push(current.trim()); current = ""; continue; }
      current += ch;
    }
    fields.push(current.trim());
    return {
      text: fields[1] || "",
      minutes: fields[2] || "",
      quadrant: fields[3] || "",
      promotedFrom: fields[4] || "",
    };
  }).filter(t => t.text);
}

// Push Notifications
function requestNotificationPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function sendNotification(title, body, icon) {
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification(title, {
        body: body || "",
        icon: icon || "",
        badge: icon || "",
        tag: "tapl-focus-engine",
        requireInteraction: true
      });
    } catch(e) {}
  }
}
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return React.createElement("div", { style: { padding: 40, color: "#E8453C", fontFamily: "monospace", background: "#1A1035", minHeight: "100vh" } },
        React.createElement("h2", null, "Something went wrong"),
        React.createElement("pre", { style: { color: "#fff", fontSize: 12, whiteSpace: "pre-wrap" } }, this.state.error.toString()),
        React.createElement("button", { onClick: () => { localStorage.clear(); window.location.reload(); }, style: { marginTop: 20, padding: "10px 20px", background: "#E8453C", color: "#fff", border: "none", borderRadius: 6, cursor: "pointer" } }, "Clear Data & Reload")
      );
    }
    return this.props.children;
  }
}

function App() {
  // --- Theme ---
  const [dark, setDark] = useState(() => loadData("tapl-theme", true));
  const T = dark ? darkTheme : lightTheme;
  useEffect(() => { saveData("tapl-theme", dark); }, [dark]);

  // --- Navigation ---
  const [step, setStep] = useState(0);
  const [horizonMode, setHorizonMode] = useState(false);
  const [showLanding, setShowLanding] = useState(true);

  // --- Horizon State (declared early for nav badge) ---
  const [horizonItems, setHorizonItems] = useState(() => {
    const items = loadHorizon();
    if (!Array.isArray(items)) return [];
    return items.map(i => ({
      ...i,
      chunks: Array.isArray(i.chunks) ? i.chunks : [],
      completed: !!i.completed,
      lastReviewed: i.lastReviewed || i.createdAt || new Date().toISOString()
    }));
  });

  // --- Brain Dump State (Step 1) ---
  const ROWS = 30;
  const [tasks, setTasks] = useState(() => {
    const saved = loadData("tapl-tasks", null);
    if (saved && Array.isArray(saved)) return saved;
    return Array.from({ length: ROWS }, (_, i) => ({ id: i, text: "", minutes: "" }));
  });

  // Save tasks on change
  useEffect(() => { saveData("tapl-tasks", tasks); }, [tasks]);

  // Count non-empty tasks
  const taskCount = tasks.filter(t => t && t.text && ((t.text || "").trim())).length;

  // Update task field
  const updateTask = (index, field, value) => {
    setTasks(prev => prev.map((t, i) => i === index ? { ...t, [field]: value } : t));
  };

  // --- Step labels ---
  const STEPS = [
    { label: "BRAIN DUMP", num: "1" },
    { label: "CATEGORISE", num: "2" },
    { label: "BUILD BLOCKS", num: "3" },
    { label: "RUN SESSION", num: "4" }
  ];

  // --- Header with FOCUS / PLAN parent tabs ---
  const headerTabStyle = (isActive, color) => ({
    background: isActive ? color : "rgba(255,255,255,0.08)",
    border: `2px solid ${color}`,
    borderRadius: 8,
    padding: "8px 24px",
    cursor: "pointer",
    ...lbl,
    fontSize: 11,
    color: "#FFFFFF",
    letterSpacing: "2px",
    transition: "all 0.2s",
    opacity: isActive ? 1 : 0.7,
    minWidth: 100,
    textAlign: "center"
  });

  const horizonAlertCount = horizonItems ? horizonItems.filter(i => !i.completed && isOverdueForReview(i)).length : 0;

  const header = (
    <div style={{
      background: T.header,
      padding: "0 20px",
      height: 60,
      display: "flex",
      justifyContent: "space-between",
      alignItems: "center",
      borderBottom: "none",
      position: "sticky",
      top: 0,
      zIndex: 100
    }}>

          <button key={i} onClick={() => { setStep(i); }} style={{
            flex: 1,
            padding: "10px 4px",

  // --- Step 1: Brain Dump ---

            fontSize: 9,
            color: T.textFaint,

              padding: "8px 10px",

              color: T.text,
              fontSize: 13,
              fontFamily: "'Montserrat', sans-serif",
              outline: "none",

              padding: "8px 6px",

              border: `1px solid ${T.inputBorder}`,
              borderRadius: 4,
              color: T.text,
              fontSize: 13,
              fontFamily: "'Montserrat', sans-serif",
              textAlign: "center",

  useEffect(() => { saveData("tapl-session-start", sessionStart); }, [sessionStart]);
  useEffect(() => { saveData("tapl-session-end", sessionEnd); }, [sessionEnd]);

  // --- Run Session State (Step 4) ---
  const [sessionActive, setSessionActive] = useState(false);
  const [currentBlockIdx, setCurrentBlockIdx] = useState(0);
  const [phase, setPhase] = useState("idle"); // idle, countdown, work, break, done
  const [countdownNum, setCountdownNum] = useState(3);
  const [timeLeft, setTimeLeft] = useState(0); // seconds remaining in current phase
  const [paused, setPaused] = useState(false);
  const [soundsOn, setSoundsOn] = useState(true);
  const [completedTaskIds, setCompletedTaskIds] = useState(new Set());
  const [skippedTaskIds, setSkippedTaskIds] = useState(new Set());
  const [completedBlockIds, setCompletedBlockIds] = useState(new Set());
  const [taskPrompt, setTaskPrompt] = useState(null); // task id to show completion prompt for
  const timerRef = useRef(null);
  const deadlineRef = useRef(0);
  const popupRef = useRef(null);
  const taskDeadlineRef = useRef(0);

  const runnableBlocks = getRunnableBlocks(blocks);
  const currentBlock = runnableBlocks[currentBlockIdx];

  // --- Horizon State (continued) ---
  const [hzScreen, setHzScreen] = useState("dashboard"); // dashboard, capture, edit
  const [hzCaptureStep, setHzCaptureStep] = useState(0);
  const [hzCaptureData, setHzCaptureData] = useState({});
  const [hzEditId, setHzEditId] = useState(null);
  const [hzPromoteModal, setHzPromoteModal] = useState(null); // {itemId} for promote-to-brain-dump

  useEffect(() => { saveHorizon(horizonItems); }, [horizonItems]);

  const activeHzItems = horizonItems.filter(i => !i.completed);
  const completedHzItems = horizonItems.filter(i => i.completed);

  // Horizon CRUD
  const addHorizonItem = (item) => setHorizonItems(prev => [...prev, item]);
  const updateHorizonItem = (id, updates) => setHorizonItems(prev => prev.map(i => i.id === id ? { ...i, ...updates } : i));
  const deleteHorizonItem = (id) => { if (confirm("Delete this item?")) setHorizonItems(prev => prev.filter(i => i.id !== id)); };
  const completeHorizonItem = (id) => updateHorizonItem(id, { completed: true });
  const uncompleteHorizonItem = (id) => updateHorizonItem(id, { completed: false });
  const markReviewed = (id) => updateHorizonItem(id, { lastReviewed: new Date().toISOString() });

  // Promote Horizon item → Brain Dump
  // Project colours for promoted task tags
  const PROJECT_COLORS = ["#E8453C", "#F59E0B", "#0891B2", "#22C55E", "#8B5CF6", "#EC4899", "#14B8A6", "#F97316"];
  const getProjectColor = (projectName) => {
    let hash = 0;
    for (let i = 0; i < projectName.length; i++) hash = projectName.charCodeAt(i) + ((hash << 5) - hash);
    return PROJECT_COLORS[Math.abs(hash) % PROJECT_COLORS.length];
  };

  const promoteTobrainDump = (itemId) => {
    const item = horizonItems.find(i => i.id === itemId);
    if (!item) return;
    const newTasks = getPromotableTasks(item);
    const sourceName = item.name;
    const sourceColor = getProjectColor(sourceName);
    setTasks(prev => {
      const next = [...prev];
      for (const nt of newTasks) {
        const realEmpty = next.findIndex(t => !((t.text || "").trim()));
        if (realEmpty !== -1) {
          next[realEmpty] = {
            ...next[realEmpty],
            text: nt.text,
            minutes: nt.minutes || "",
            promotedFrom: sourceName,
            promotedColor: sourceColor
          };
        }
      }
      return next;
    });
    updateHorizonItem(itemId, { promoted: true });
    setHzPromoteModal(null);
    setHorizonMode(false);
    setStep(0);
  };

  // Send blocks to Horizon (replaces Defer)
  const sendBlockToHorizon = (blockId, projectName, existingProjectId) => {
    const block = blocks.find(b => b.id === blockId);
    if (!block) return;
    const blockTaskTexts = block.taskIds.map(tid => {
      const t = tasks.find(tk => tk.id === tid);
      return t ? t.text : "";
    }).filter(Boolean);

    if (existingProjectId) {
      // Add as chunks to existing project
      setHorizonItems(prev => prev.map(item => {
        if (item.id !== existingProjectId) return item;
        const newChunks = blockTaskTexts.map((text, i) => ({
          id: "chunk_" + Date.now() + "_" + i,
          name: text,
          done: false
        }));
        return { ...item, chunks: [...item.chunks, ...newChunks] };
      }));
    } else {
      // Create new project
      const project = createProjectFromTasks(projectName || "Untitled Project", blockTaskTexts, "");
      addHorizonItem(project);
    }

    // Remove tasks from block and return to available
    setBlocks(prev => prev.map(b => b.id === blockId ? { ...b, taskIds: [] } : b));
  };

  // Timer tick
  useEffect(() => {
    if (phase !== "work" && phase !== "break") return;
    if (paused) return;

    timerRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(timerRef.current);
          if (phase === "work") {
            // Block work phase complete
            if (soundsOn) AudioEngine.playBlockComplete();
            sendNotification("Block Complete", "Great work! Time for a break. Step away from the screen.");
            setCompletedBlockIds(prev => new Set([...prev, currentBlock.id]));
            if (currentBlockIdx < runnableBlocks.length - 1) {
              setPhase("break");
              setTimeLeft(currentBlock.breakMins * 60);
              if (soundsOn) AudioEngine.playBreakStart();
            } else {
              setPhase("done");
              if (soundsOn) AudioEngine.playSessionComplete();
              sendNotification("Session Complete", "All blocks finished. Outstanding work!");
            }
          } else if (phase === "break") {
            // Break complete, start next block
            sendNotification("Break Over", "Time to focus. Next block starting now.");
            setCurrentBlockIdx(prev => prev + 1);
            setPhase("countdown");
            setCountdownNum(3);
          }
          return 0;
        }
        return prev - 1;
      });
    }, 1000);

    return () => clearInterval(timerRef.current);
  }, [phase, paused, currentBlockIdx]);

  // Countdown ticker
  useEffect(() => {
    if (phase !== "countdown") return;
    if (countdownNum <= 0) {
      // GO!
      if (soundsOn) AudioEngine.playGoBeep();
      const workSecs = currentBlock ? blockWorkSeconds(currentBlock, tasks) : 0;
      setTimeLeft(workSecs);
      deadlineRef.current = Date.now() + workSecs * 1000;
      setPhase("work");
      return;
    }
    const t = setTimeout(() => {
      if (soundsOn) AudioEngine.playCountdownBeep();
      setCountdownNum(prev => prev - 1);
    }, 800);
    return () => clearTimeout(t);
  }, [phase, countdownNum]);

  const startSession = () => {
    if (runnableBlocks.length === 0) return;
    requestNotificationPermission();
    setCurrentBlockIdx(0);
    setCompletedTaskIds(new Set());
    setSkippedTaskIds(new Set());
    setCompletedBlockIds(new Set());
    setTaskPrompt(null);
    setPaused(false);
    setPhase("countdown");
    setCountdownNum(3);
  };

  const resetSession = () => {
    clearInterval(timerRef.current);
    setPhase("idle");
    setSessionActive(false);
    setPaused(false);
    setCurrentBlockIdx(0);
    setTimeLeft(0);
    setCompletedTaskIds(new Set());
    setSkippedTaskIds(new Set());
    setCompletedBlockIds(new Set());
    setTaskPrompt(null);
  };

  const resetBlock = () => {
    clearInterval(timerRef.current);
    // Clear completed/skipped for tasks in current block only
    if (currentBlock) {
      const blockTaskSet = new Set(currentBlock.taskIds);
      setCompletedTaskIds(prev => {
        const next = new Set([...prev]);
        blockTaskSet.forEach(id => next.delete(id));
        return next;
      });
      setSkippedTaskIds(prev => {
        const next = new Set([...prev]);
        blockTaskSet.forEach(id => next.delete(id));
        return next;
      });
      setCompletedBlockIds(prev => {
        const next = new Set([...prev]);
        next.delete(currentBlock.id);
        return next;
      });
    }
    setTaskPrompt(null);
    setPaused(false);
    setPhase("countdown");
    setCountdownNum(3);
  };

  const resetTask = () => {
    // Restart the current task's timer by resetting elapsed time to the task's start point
    if (currentBlock && currentTaskInfo && currentTaskInfo.task) {
      const taskStart = taskStartTime(currentBlock, currentTaskInfo.task.id, tasks);
      const blockSecs = blockWorkSeconds(currentBlock, tasks);
      setTimeLeft(blockSecs - taskStart);
    }
  };

  const resetBrainDump = () => {
    if (confirm("Clear all tasks? This will also clear categories and block assignments.")) {
      setTasks(Array.from({ length: 30 }, (_, i) => ({ id: i, text: "", minutes: "" })));
      setBlocks(defaultBlocks());
      resetSession();
    }
  };

  const importCSV = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".csv";
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const parsed = parseCSV(ev.target.result);
        if (parsed.length === 0) { alert("No tasks found in CSV."); return; }
        setTasks(prev => {
          const next = [...prev];
          let slot = 0;
          parsed.forEach(pt => {
            // Find next empty slot
            while (slot < next.length && ((next[slot].text || "").trim())) slot++;
            if (slot < next.length) {
              next[slot] = { ...next[slot], text: pt.text, minutes: pt.minutes, quadrant: pt.quadrant || "", promotedFrom: pt.promotedFrom || "" };
              slot++;
            }
          });
          return next;
        });
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const skipPhase = () => {
    clearInterval(timerRef.current);
    if (phase === "work") {
      setCompletedBlockIds(prev => new Set([...prev, currentBlock.id]));
      if (currentBlockIdx < runnableBlocks.length - 1) {
        setPhase("break");
        setTimeLeft(currentBlock.breakMins * 60);
        if (soundsOn) AudioEngine.playBreakStart();
      } else {
        setPhase("done");
        if (soundsOn) AudioEngine.playSessionComplete();
      }
    } else if (phase === "break") {
      setCurrentBlockIdx(prev => prev + 1);
      setPhase("countdown");
      setCountdownNum(3);
    }
  };

  const completeTask = (taskId) => {
    setCompletedTaskIds(prev => new Set([...prev, taskId]));
    setTaskPrompt(null);
    if (soundsOn) AudioEngine.playTaskComplete();
  };

  const skipTask = (taskId) => {
    setSkippedTaskIds(prev => new Set([...prev, taskId]));
    setTaskPrompt(null);
  };

  const openPopoutTimer = () => {
    if (popupRef.current && !popupRef.current.closed) {
      popupRef.current.focus();
      return;
    }
    const w = 360, h = 420;
    const left = window.screen.width - w - 20;
    const top = 40;
    const popup = window.open("", "tapl_timer", `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=no`);
    if (!popup) return;
    popupRef.current = popup;
    popup.document.write(`<!DOCTYPE html><html><head><title>Focus Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Montserrat',sans-serif; overflow:hidden; transition:background 0.3s; }
.lbl { font-weight:900; text-transform:uppercase; letter-spacing:1.5px; }
</style></head><body><div id="r"></div>
<script>
const C = { red:"#E8453C", green:"#22C55E", purple:"#2D1B69", teal:"#0891B2", amber:"#F59E0B" };
function fmt(s) { if(s<0)s=0; return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function update() {
  const d = window.opener && window.opener.__taplTimer;
  if (!d) { document.getElementById("r").innerHTML = "<div style='padding:40px;text-align:center;color:#888'>Waiting for session...</div>"; return; }
  const dk = d.dark;
  const bg = dk ? "#1A1035" : "#F3F0FF";
  const card = dk ? "#241850" : "#FFFFFF";
  const text = dk ? "#FFFFFF" : "#1A1035";
  const dim = dk ? "#8B80A5" : "#6B6080";
  const border = dk ? "#3D2B79" : "#E2DDF0";
  document.body.style.background = bg;
  const isWork = d.phase === "work";
  const isBreak = d.phase === "break";
  const isDone = d.phase === "done";
  const isIdle = d.phase === "idle" || d.phase === "countdown";
  let html = "<div style='padding:12px'>";
  // Header
  html += "<div style='text-align:center;margin-bottom:8px'>";
  html += "<div class='lbl' style='font-size:8px;color:"+C.red+";letter-spacing:2px'>FOCUS ENGINE</div>";
  if (isIdle) {
    html += "<div style='font-size:11px;color:"+dim+";margin-top:12px'>"+( d.phase==="countdown" ? "Starting..." : "No active session")+"</div>";
  } else if (isDone) {
    html += "<div style='font-size:18px;margin-top:16px'>🎉</div>";
    html += "<div class='lbl' style='font-size:12px;color:"+C.green+";margin-top:4px'>SESSION COMPLETE</div>";
  } else {
    // Block label
    html += "<div class='lbl' style='font-size:9px;color:"+dim+";margin-top:8px'>BLOCK "+(d.currentBlockIdx+1)+" OF "+d.blockCount+" — "+(isWork?"WORK":"BREAK")+"</div>";
    // Timer
    html += "<div style='font-size:48px;font-weight:900;color:"+text+";margin:8px 0'>"+fmt(d.timeLeft)+"</div>";
    // Current task
    if (isWork && d.currentTaskName) {
      html += "<div style='font-size:11px;color:"+C.teal+";margin-bottom:4px'>"+d.currentTaskName+"</div>";
      if (d.taskRemaining > 0) html += "<div class='lbl' style='font-size:9px;color:"+C.green+"'>TASK: "+fmt(d.taskRemaining)+"</div>";
    }
    if (isBreak) html += "<div style='font-size:11px;color:"+C.purple+"'>Step away from the screen</div>";
    // Pause indicator
    if (d.paused) html += "<div class='lbl' style='font-size:10px;color:"+C.amber+";margin-top:6px'>⏸ PAUSED</div>";
  }
  html += "</div>";
  // Task list (work phase only)
  if (isWork && d.taskList && d.taskList.length > 0) {
    html += "<div style='background:"+card+";border:1px solid "+border+";border-radius:6px;padding:8px;margin-top:8px'>";
    html += "<div class='lbl' style='font-size:8px;color:"+dim+";margin-bottom:6px'>TASKS</div>";
    d.taskList.forEach(function(t) {
      const op = t.done || t.skipped ? "0.4" : "1";
      const td = t.done ? "line-through" : "none";
      const fw = t.current ? "700" : "400";
      const col = t.current ? text : dim;
      html += "<div style='display:flex;justify-content:space-between;padding:3px 0;opacity:"+op+";text-decoration:"+td+"'>";
      html += "<span style='font-size:10px;color:"+col+";font-weight:"+fw+"'>"+t.text+"</span>";
      if (t.skipped) html += "<span class='lbl' style='font-size:7px;color:"+C.amber+"'>SKIP</span>";
      else html += "<span class='lbl' style='font-size:9px;color:"+dim+"'>"+( t.minutes||"?")+"m</span>";
      html += "</div>";
    });
    html += "</div>";
  }
  html += "</div>";
  document.getElementById("r").innerHTML = html;
}
setInterval(update, 500);
update();
<\/script></body></html>`);
    popup.document.close();
  };

  const updateTaskCat = (id, field, value) => {
    setTasks(prev => prev.map(t => t.id === id ? { ...t, [field]: value } : t));
  };

  const taggedCount = activeTasks.filter(t => t.quadrant).length;

  // Get quadrant info for a task
  const getQuad = (qid) => QUADRANTS.find(q => q.id === qid);
  const getQuadBtn = (qid) => QUAD_BUTTONS.find(q => q.id === qid);

  // Group tasks into time buckets
  const groupByTime = (list) => {
    return TIME_BUCKETS.map(b => ({
      ...b,
      tasks: list.filter(t => {
        const m = parseInt(t.minutes) || 0;
        if (b.max === 5) return m > 0 && m <= 5;
        if (b.max === 30) return m > 5 && m <= 30;
        if (b.max === 60) return m > 30 && m <= 60;
        return m > 60;
      })
    }));
  };

  // Group tasks by quadrant
  const groupByQuadrant = (list) => {
    return QUADRANTS.map(q => ({
      ...q,
      tasks: list.filter(t => t.quadrant === q.id)
    }));
  };

  const renderCategorise = () => (
    <div style={{ padding: "16px 12px", maxWidth: 900, margin: "0 auto" }}>
      <div style={{ ...lbl, fontSize: 16, color: T.text, marginBottom: 4 }}>CATEGORISE</div>

      {/* Mode toggle */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
        <span style={{ fontSize: 12, color: T.textDim }}>Categorise by:</span>
        {[{id:"time",label:"◷ TIME"},{id:"priority",label:"⚡ TIME & PRIORITY"}].map(m => (
          <button key={m.id} onClick={() => setCatMode(m.id)} style={{
            padding: "8px 16px", borderRadius: 6, cursor: "pointer",
            background: catMode === m.id ? C.red : "transparent",
            border: `1px solid ${catMode === m.id ? C.red : T.border}`,
            color: catMode === m.id ? "#FFFFFF" : T.textMid,
            ...lbl, fontSize: 10, letterSpacing: "1px", transition: "all 0.15s"
          }}>{m.label}</button>
        ))}
      </div>

      {activeTasks.length === 0 ? (
        <div style={{ textAlign: "center", color: T.textDim, padding: 40 }}>
          <div style={{ fontSize: 13 }}>No tasks to categorise.</div>
          <div style={{ fontSize: 11, marginTop: 4 }}>Go back to Brain Dump and add some tasks first.</div>
        </div>
      ) : catMode === "time" ? (
        /* --- TIME MODE: group by duration --- */
        <>
          {groupByTime(activeTasks).map(bucket => (
            <div key={bucket.id} style={{
              background: T.card, border: `1px solid ${T.border}`, borderRadius: 8,
              marginBottom: 12, overflow: "hidden"
            }}>
              <div style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                padding: "10px 14px", borderBottom: `1px solid ${T.border}`
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: bucket.color }} />
                  <span style={{ ...lbl, fontSize: 11, color: bucket.color }}>{bucket.label}</span>
                </div>
                <span style={{
                  background: bucket.color, color: "#FFFFFF", borderRadius: 12,
                  padding: "2px 10px", ...lbl, fontSize: 10
                }}>{bucket.tasks.length}</span>
              </div>
              {bucket.tasks.length === 0 ? (
                <div style={{ padding: "12px 14px", color: T.textFaint, fontSize: 11, fontStyle: "italic" }}>
                  No tasks in this range
                </div>
              ) : bucket.tasks.map((task, i) => (
                <div key={task.id} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                  padding: "10px 14px", borderBottom: `1px solid ${T.border}22`
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ ...lbl, fontSize: 9, color: T.textFaint }}>{tasks.indexOf(task) + 1}.</span>
                    {task.promotedFrom && <span style={{ padding: "1px 5px", borderRadius: 3, background: (task.promotedColor || C.teal) + "20", border: `1px solid ${(task.promotedColor || C.teal)}44`, ...lbl, fontSize: 7, color: task.promotedColor || C.teal, maxWidth: 70, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{task.promotedFrom}</span>}
                    <span style={{ color: T.text, fontSize: 13 }}>{task.text}</span>
                  </div>
                  <span style={{ ...lbl, fontSize: 11, color: bucket.color }}>{task.minutes}M</span>
                </div>
              ))}
            </div>
          ))}
        </>
      ) : (
        /* --- TIME & PRIORITY MODE --- */
        <>
          {/* Legend */}
          <div style={{
            background: T.card, border: `1px solid ${T.border}`, borderRadius: 8,
            padding: "14px 16px", marginBottom: 16
          }}>
            <div style={{ ...lbl, fontSize: 10, color: T.textDim, marginBottom: 10 }}>
              TAG EACH TASK WITH ITS EISENHOWER PRIORITY
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {QUADRANTS.map(q => (
                <div key={q.id} style={{
                  padding: "6px 12px", borderRadius: 6,
                  border: `1px solid ${q.color}44`, background: q.bg,
                  display: "flex", alignItems: "center", gap: 6
                }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: q.color }} />
                  <span style={{ ...lbl, fontSize: 10, color: q.color }}>{q.label}</span>
                  <span style={{ fontSize: 10, color: T.textDim }}>— {q.desc}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Task list with HH/HL/LH/LL buttons */}
          {activeTasks.map((task, i) => (
            <div key={task.id} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 8px", borderBottom: `1px solid ${T.border}33`
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1 }}>
                <span style={{ ...lbl, fontSize: 9, color: T.textFaint, width: 22, textAlign: "right" }}>{i + 1}.</span>
                {task.promotedFrom && <span style={{ padding: "1px 5px", borderRadius: 3, background: (task.promotedColor || C.teal) + "20", border: `1px solid ${(task.promotedColor || C.teal)}44`, ...lbl, fontSize: 7, color: task.promotedColor || C.teal, maxWidth: 70, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flexShrink: 0 }}>{task.promotedFrom}</span>}
                <span style={{ color: T.text, fontSize: 13 }}>{task.text}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ ...lbl, fontSize: 10, color: T.textDim, marginRight: 4 }}>
                  {task.minutes ? `${task.minutes}M` : ""}
                </span>
                {QUAD_BUTTONS.map(qb => {
                  const q = getQuad(qb.id);
                  const sel = task.quadrant === qb.id;
                  return (
                    <button key={qb.id} onClick={() => updateTaskCat(task.id, "quadrant", qb.id)} style={{
                      width: 32, height: 26, borderRadius: 4, cursor: "pointer",
                      border: `1px solid ${sel ? q.color : T.border}`,
                      background: sel ? q.color : "transparent",
                      color: sel ? "#FFFFFF" : q.color,
                      ...lbl, fontSize: 9, letterSpacing: "0.5px",
                      opacity: sel ? 1 : (task.quadrant ? 0.4 : 0.7),
                      transition: "all 0.15s"
                    }}>{qb.code}</button>
                  );
                })}
              </div>
            </div>
          ))}

          {/* View as toggle — only show when tasks are tagged */}
          {taggedCount > 0 && (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 20, marginBottom: 12 }}>
                <span style={{ fontSize: 12, color: T.textDim }}>View as:</span>
                {[{id:"time",label:"◷ BY TIME"},{id:"priority",label:"⚡ BY PRIORITY"}].map(m => (
                  <button key={m.id} onClick={() => setViewMode(m.id)} style={{
                    padding: "6px 14px", borderRadius: 6, cursor: "pointer",
                    background: viewMode === m.id ? T.card : "transparent",
                    border: `1px solid ${viewMode === m.id ? T.border : "transparent"}`,
                    color: viewMode === m.id ? T.text : T.textDim,
                    ...lbl, fontSize: 10, letterSpacing: "1px", transition: "all 0.15s"
                  }}>{m.label}</button>
                ))}
              </div>

                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <span style={{ ...lbl, fontSize: 9, color: T.textFaint }}>{tasks.indexOf(task) + 1}.</span>
                            {task.promotedFrom && <span style={{ padding: "1px 5px", borderRadius: 3, background: (task.promotedColor || C.teal) + "20", border: `1px solid ${(task.promotedColor || C.teal)}44`, ...lbl, fontSize: 6, color: task.promotedColor || C.teal }}>{task.promotedFrom}</span>}
                            <span style={{ color: T.text, fontSize: 12 }}>{task.text}</span>
                          </div>
                          <span style={{ ...lbl, fontSize: 10, color: group.color }}>{task.minutes}M</span>

                  {/* Eisenhower Matrix visual */}
                  <div style={{
                    background: T.card, border: `1px solid ${T.border}`, borderRadius: 8,

                    {/* Axis labels */}

                    {/* 2x2 grid */}
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4, marginBottom: 8 }}>

                        { qid: "not_important_urgent", label: "REACT" }
                      ].map(cell => {

                        const cellTasks = activeTasks.filter(t => t.quadrant === cell.qid);
                        return (
                          <div key={cell.qid} style={{

                            </div>
                            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                              {cellTasks.map(task => (
                                <div key={task.id} style={{
                                  width: 28, height: 28, borderRadius: "50%",
                                  background: q.color, color: "#FFFFFF",
                                  display: "flex", alignItems: "center", justifyContent: "center",
                                  fontSize: 11, fontWeight: 900
                                }}>{tasks.indexOf(task) + 1}</div>

                          </div>

                    </div>

                    {/* Axis label */}
                    <div style={{ display: "flex", justifyContent: "center", gap: 16, marginBottom: 12 }}>
                      <span style={{ ...lbl, fontSize: 8, color: T.textFaint }}>← LOW</span>

                    {/* Task legend */}
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                      {activeTasks.filter(t => t.quadrant).map(task => {
                        const q = getQuad(task.quadrant);
                        return (

                            <span style={{ fontSize: 10, color: T.textDim, maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>

                    </div>
