                                  </div>
                                  <div style={{ flex: 1, minWidth: 100 }}>
                                    <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 4 }}>DURATION EACH</div>
                                    <select value={hzIcsDuration} onChange={e => setHzIcsDuration(parseInt(e.target.value))} style={{
                                      width: "100%", padding: "8px", background: T.inputBg, border: `1px solid ${T.inputBorder}`,
                                      borderRadius: 6, color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif"
                                    }}>
                                      {[30,45,60,90,120,180].map(m => <option key={m} value={m}>{m >= 60 ? `${m/60}h` : `${m}m`}</option>)}
                                    </select>
                                  </div>
                                  <div style={{ flex: 1, minWidth: 100 }}>
                                    <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 4 }}>SESSION TIME</div>
                                    <input type="time" value={hzIcsTime} onChange={e => setHzIcsTime(e.target.value)} style={{
                                      width: "100%", padding: "8px", background: T.inputBg, border: `1px solid ${T.inputBorder}`,
                                      borderRadius: 6, color: T.text, fontSize: 12, fontFamily: "'Montserrat', sans-serif",
                                      colorScheme: dark ? "dark" : "light"
                                    }} />
                                  </div>
                                </div>
                                {/* Chunk selection for projects */}
                                {item.chunks && item.chunks.filter(c => !c.done).length > 0 && (
                                  <div style={{ marginBottom: 12 }}>
                                    <div style={{ ...lbl, fontSize: 9, color: T.textDim, marginBottom: 6 }}>INCLUDE STEPS</div>
                                    {item.chunks.filter(c => !c.done).map(chunk => {
                                      const sel = hzIcsChunks.has(chunk.id);
                                      return (
                                        <div key={chunk.id} onClick={() => {
                                          setHzIcsChunks(prev => {
                                            const next = new Set([...prev]);
                                            sel ? next.delete(chunk.id) : next.add(chunk.id);
                                            return next;
                                          });
                                        }} style={{
                                          display: "flex", alignItems: "center", gap: 8,
                                          padding: "5px 10px", marginBottom: 2, borderRadius: 4, cursor: "pointer",
                                          background: sel ? C.teal + "10" : "transparent",
                                          border: `1px solid ${sel ? C.teal + "44" : T.border}`
                                        }}>
                                          <span style={{ ...lbl, fontSize: 9, color: sel ? C.teal : T.textDim }}>{sel ? "✓" : "○"}</span>
                                          <span style={{ fontSize: 11, color: T.text }}>{chunk.name}</span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                              </>
                            )}

                            {/* Actions */}
                            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
                              <button onClick={() => setHzIcsModal(null)} style={{
                                padding: "8px 16px", borderRadius: 6, cursor: "pointer",
                                background: "transparent", border: `1px solid ${T.border}`,
                                ...lbl, fontSize: 10, color: T.textMid
                              }}>CANCEL</button>
                              <button onClick={() => {
                                const events = [];
                                const dueDate = item.dueDate ? new Date(item.dueDate) : new Date(Date.now() + 30 * 86400000);
                                const now = new Date();

                                if (hzIcsType === "reminders") {
                                  // Generate reminder events at the chosen frequency
                                  const freqDays = hzIcsSessions; // reusing sessions state for frequency
                                  const totalDays = Math.max(1, Math.ceil((dueDate - now) / 86400000));
                                  const [rh, rm] = hzIcsTime.split(":").map(Number);

                                  for (let d = 0; d < totalDays; d += freqDays) {
                                    const reminderDate = new Date(now);
                                    reminderDate.setDate(reminderDate.getDate() + d);
                                    reminderDate.setHours(rh, rm, 0, 0);
                                    events.push({
                                      title: "Pulse Check: " + item.name,
                                      description: "Has anything changed? Review this " + item.type + " and update if needed.\\n\\nDue: " + (item.dueDate || "No date set"),
                                      startDate: reminderDate.toISOString(),
                                      durationMins: 15
                                    });
                                  }
                                } else {
                                  // Generate work sessions spread evenly
                                  const totalDays = Math.max(1, Math.ceil((dueDate - now) / 86400000));
                                  const interval = Math.max(1, Math.floor(totalDays / hzIcsSessions));
                                  const [sh, sm] = hzIcsTime.split(":").map(Number);
                                  const selectedChunks = item.chunks ? item.chunks.filter(c => hzIcsChunks.has(c.id)) : [];

                                  for (let i = 0; i < hzIcsSessions; i++) {
                                    const sessionDate = new Date(now);
                                    sessionDate.setDate(sessionDate.getDate() + (i * interval));
                                    sessionDate.setHours(sh, sm, 0, 0);

                                    let desc = item.name + " — Work Session " + (i + 1) + " of " + hzIcsSessions;
                                    if (selectedChunks.length > 0) {
                                      // Distribute chunks across sessions
                                      const chunksPerSession = Math.ceil(selectedChunks.length / hzIcsSessions);
                                      const sessionChunks = selectedChunks.slice(i * chunksPerSession, (i + 1) * chunksPerSession);
                                      if (sessionChunks.length > 0) {
                                        desc += "\\n\\nSteps:\\n" + sessionChunks.map(c => "• " + c.name).join("\\n");
                                      }
                                    }

                                    events.push({
                                      title: item.name + " — Session " + (i + 1),
                                      description: desc,
                                      startDate: sessionDate.toISOString(),
                                      durationMins: hzIcsDuration
                                    });
                                  }
                                }

                                const ics = generateICS(events);
                                downloadICS(item.name.replace(/[^a-zA-Z0-9]/g, "-").toLowerCase() + ".ics", ics);
                                setHzIcsModal(null);
                              }} style={{
                                padding: "8px 20px", borderRadius: 6, cursor: "pointer",
                                background: C.teal, border: "none", color: "#FFF",
                                ...lbl, fontSize: 10
                              }}>DOWNLOAD .ICS</button>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}

        {completedHzItems.length > 0 && (
          <div style={{ marginTop: 24 }}>
            <div style={{ ...lbl, fontSize: 10, color: T.textDim, marginBottom: 8 }}>COMPLETED ({completedHzItems.length})</div>
            {completedHzItems.map(item => (
              <div key={item.id} style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                padding: "8px 12px", background: T.card, border: `1px solid ${T.border}`,
                borderRadius: 6, marginBottom: 4, opacity: 0.5
              }}>
                <span style={{ fontSize: 12, color: T.textDim, textDecoration: "line-through" }}>{item.name}</span>
                <div style={{ display: "flex", gap: 4 }}>
                  <button onClick={() => uncompleteHorizonItem(item.id)} style={{
                    padding: "2px 8px", borderRadius: 3, cursor: "pointer",
                    background: "transparent", border: `1px solid ${T.border}`, ...lbl, fontSize: 7, color: T.textDim
                  }}>UNDO</button>
                  <button onClick={() => deleteHorizonItem(item.id)} style={{
                    padding: "2px 8px", borderRadius: 3, cursor: "pointer",
                    background: "transparent", border: `1px solid ${T.border}`, ...lbl, fontSize: 7, color: T.textDim
                  }}>✕</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  // --- Landing Page ---
  const renderLanding = () => (
    <div style={{
      background: T.bg,
      minHeight: "100vh",
      display: "flex",
      flexDirection: "column",
      alignItems: "center",
      justifyContent: "center",
      padding: 40,
      transition: "background 0.2s"
    }}>
      {/* Logo + title */}
      <div style={{ textAlign: "center", marginBottom: 48 }}>
        <div style={{ ...lbl, fontSize: 28, color: T.text, letterSpacing: "4px" }}>
          FOCUS ENGINE
        </div>
        <div style={{ ...lbl, fontSize: 11, color: C.red, letterSpacing: "2px", marginTop: 8 }}>
          THE ADHD PERFORMANCE LAB
        </div>
      </div>
      {/* Two large tiles */}
      <div style={{ display: "flex", gap: 32, flexWrap: "wrap", justifyContent: "center" }}>
        {/* FOCUS tile */}
        <button onClick={() => { setHorizonMode(false); setStep(0); setShowLanding(false); }} style={{
          width: 220,
          height: 220,
          background: T.card,
          border: `3px solid ${C.red}`,
          borderRadius: 16,
          cursor: "pointer",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: 16,
          transition: "all 0.2s",
          padding: 24
        }}>
          <div style={{ fontSize: 36 }}>🎯</div>
          <div style={{ ...lbl, fontSize: 18, color: C.red, letterSpacing: "3px" }}>FOCUS</div>
          <div style={{ fontSize: 12, color: T.textDim, textAlign: "center", lineHeight: 1.5, fontFamily: "Montserrat, sans-serif" }}>
            What do I need to do today?
          </div>
        </button>
        {/* PLAN tile */}
        <button onClick={() => { setHorizonMode(true); setShowLanding(false); }} style={{
          width: 220,
          height: 220,
          background: T.card,
          border: `3px solid ${C.teal}`,
          borderRadius: 16,
          cursor: "pointer",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: 16,
          transition: "all 0.2s",
          padding: 24
        }}>
          <div style={{ fontSize: 36 }}>🗺️</div>
          <div style={{ ...lbl, fontSize: 18, color: C.teal, letterSpacing: "3px" }}>PLAN</div>
          <div style={{ fontSize: 12, color: T.textDim, textAlign: "center", lineHeight: 1.5, fontFamily: "Montserrat, sans-serif" }}>
            What's coming up this week, month, or quarter?
          </div>
        </button>
      </div>
      {/* Theme toggle at bottom */}
      <button onClick={() => setDark(!dark)} style={{
        marginTop: 48,
        background: "rgba(255,255,255,0.05)",
        border: `1px solid ${T.border}`,
        borderRadius: 6,
        padding: "6px 14px",
        cursor: "pointer",
        ...lbl,
        fontSize: 10,
        color: T.textDim,
        letterSpacing: "1px"
      }}>
        {dark ? "☀ LIGHT" : "● DARK"}
      </button>
    </div>
  );

  // --- Main render ---
  if (showLanding) return renderLanding();

  return (
    <div style={{ background: T.bg, minHeight: "100vh", transition: "background 0.2s" }}>
      {header}
      {stepNav}
      {horizonMode
        ? renderHorizon()
        : step === 0
          ? renderBrainDump()
          : step === 1
            ? renderCategorise()
            : step === 2
              ? renderBuildBlocks()
              : renderRunSession()
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
