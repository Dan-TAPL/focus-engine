<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Focus Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1A1035; font-family: 'Montserrat', sans-serif; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity: 1; }
    select option { color: #1A1035; background: white; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrolltrack, #2D1B69); }
    ::-webkit-scrollbar-thumb { background: #E8453C; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const C = {
      purple: "#2D1B69", red: "#E8453C",
      dark: "#1A1035", grey: "#F4F3F8", border: "#E2DFF0",
    };

    const MAX_MINS = 40;

    const THEMES = {
      dark: {
        bg: "#1A1035", surface: "#1E1245",
        surfaceAlt: "rgba(255,255,255,0.04)", surfaceHover: "rgba(255,255,255,0.06)",
        headerAlt: "#3D2B7A", border: "rgba(255,255,255,0.12)", borderSubtle: "rgba(255,255,255,0.06)",
        text: "rgba(255,255,255,0.85)", textMid: "rgba(255,255,255,0.55)",
        textDim: "rgba(255,255,255,0.4)", textFaint: "rgba(255,255,255,0.25)",
        textNum: "rgba(255,255,255,0.3)",
        inputBg: "rgba(255,255,255,0.08)", inputBorder: "rgba(255,255,255,0.2)",
        blockCard: "#1E1245", availBg: "rgba(255,255,255,0.03)",
        deferHeader: "#2A2440", completedHeader: "#1A3A2A",
        deferBorder: "#6B5B9E", deferText: "#9B8FC0",
        emptyBorder: "rgba(255,255,255,0.15)", emptyText: "rgba(255,255,255,0.3)",
        stickyBg: "rgba(26,16,53,0.97)", scrolltrack: "#2D1B69",
        progressTrack: "rgba(255,255,255,0.15)",
        timerRingBg: "rgba(255,255,255,0.07)", timerText: "white",
        blockDot: "rgba(255,255,255,0.15)", phaseLabelColor: "rgba(255,255,255,0.5)",
        sessionInfoBg: "rgba(255,255,255,0.05)",
        splitBadgeBg: "rgba(255,255,255,0.1)", splitBadgeColor: "rgba(255,255,255,0.6)",
        checkboxBorder: "rgba(255,255,255,0.25)", tickedRowBg: "rgba(34,197,94,0.06)",
        timerRingIdle: "rgba(255,255,255,0.25)", timerRingBreak: "rgba(255,255,255,0.3)",
        blockDotActiveBorder: "rgba(255,255,255,0.35)",
        csvBtnBg: "rgba(255,255,255,0.1)", csvBtnColor: "rgba(255,255,255,0.8)", csvBtnBorder: "rgba(255,255,255,0.2)",
        btnBackColor: "rgba(255,255,255,0.6)", btnBackBorder: "rgba(255,255,255,0.2)",
        tagRowBorder: "rgba(255,255,255,0.06)",
        upNextBg: "rgba(255,255,255,0.02)",
      },
      light: {
        bg: "#ECEAF5", surface: "#FFFFFF",
        surfaceAlt: "rgba(45,27,105,0.06)", surfaceHover: "rgba(45,27,105,0.1)",
        headerAlt: "#3D2B7A", border: "rgba(45,27,105,0.25)", borderSubtle: "rgba(45,27,105,0.12)",
        text: "#1A1035", textMid: "#2D1B69",
        textDim: "rgba(26,16,53,0.65)", textFaint: "rgba(26,16,53,0.45)",
        textNum: "#2D1B69",
        inputBg: "rgba(45,27,105,0.07)", inputBorder: "rgba(45,27,105,0.35)",
        blockCard: "#FFFFFF", availBg: "#FFFFFF",
        deferHeader: "#E0DCF0", completedHeader: "#DCF0E4",
        deferBorder: "#9B8FC0", deferText: "#5B4A9E",
        emptyBorder: "rgba(45,27,105,0.3)", emptyText: "#5B4A9E",
        stickyBg: "rgba(236,234,245,0.97)", scrolltrack: "#C8C2E0",
        progressTrack: "rgba(45,27,105,0.2)",
        timerRingBg: "rgba(45,27,105,0.12)", timerText: "#1A1035",
        blockDot: "rgba(45,27,105,0.35)", phaseLabelColor: "#2D1B69",
        sessionInfoBg: "rgba(45,27,105,0.06)",
        splitBadgeBg: "rgba(45,27,105,0.12)", splitBadgeColor: "#5B4A9E",
        checkboxBorder: "rgba(45,27,105,0.4)", tickedRowBg: "rgba(22,163,74,0.07)",
        timerRingIdle: "rgba(45,27,105,0.35)", timerRingBreak: "rgba(45,27,105,0.25)",
        blockDotActiveBorder: "rgba(45,27,105,0.3)",
        csvBtnBg: "rgba(45,27,105,0.1)", csvBtnColor: "#2D1B69", csvBtnBorder: "rgba(45,27,105,0.35)",
        btnBackColor: "#2D1B69", btnBackBorder: "rgba(45,27,105,0.35)",
        tagRowBorder: "rgba(45,27,105,0.12)",
        upNextBg: "rgba(45,27,105,0.04)",
      },
    };

    // Light mode quads/buckets use more saturated colours for legibility on light bg
    const QUADS_LIGHT = [
      { id: "HH", label: "High Importance / High Urgency",  short: "DO",   color: "#16A34A", bg: "rgba(22,163,74,0.1)",   border: "rgba(22,163,74,0.4)",   dot: "#16A34A" },
      { id: "HL", label: "High Importance / Low Urgency",   short: "PLAN", color: "#D97706", bg: "rgba(217,119,6,0.1)",   border: "rgba(217,119,6,0.4)",   dot: "#D97706" },
      { id: "LH", label: "Low Importance / High Urgency",   short: "REACT",color: "#DC2626", bg: "rgba(220,38,38,0.1)",   border: "rgba(220,38,38,0.4)",   dot: "#DC2626" },
      { id: "LL", label: "Low Importance / Low Urgency",    short: "DROP", color: "#6B7280", bg: "rgba(107,114,128,0.08)",border: "rgba(107,114,128,0.3)", dot: "#6B7280" },
    ];
    const BUCKETS_LIGHT = [
      { id: "quick",  label: "Up to 5 mins",   color: "#0891B2", bg: "rgba(8,145,178,0.1)",   border: "rgba(8,145,178,0.4)"   },
      { id: "short",  label: "Up to 30 mins",  color: "#2563EB", bg: "rgba(37,99,235,0.1)",   border: "rgba(37,99,235,0.4)"   },
      { id: "medium", label: "Up to 60 mins",  color: "#7C3AED", bg: "rgba(124,58,237,0.1)",  border: "rgba(124,58,237,0.4)"  },
      { id: "long",   label: "60+ mins",        color: "#DC2626", bg: "rgba(220,38,38,0.1)",   border: "rgba(220,38,38,0.4)"   },
    ];

    // ── Eisenhower quadrants ──
    const QUADS = [
      { id: "HH", label: "High Importance / High Urgency",  short: "DO",  color: "#16A34A", bg: "rgba(22,163,74,0.12)", border: "rgba(22,163,74,0.4)", dot: "#16A34A" },
      { id: "HL", label: "High Importance / Low Urgency",   short: "PLAN",  color: "#D97706", bg: "rgba(217,119,6,0.12)", border: "rgba(217,119,6,0.4)", dot: "#D97706" },
      { id: "LH", label: "Low Importance / High Urgency",   short: "REACT",  color: "#DC2626", bg: "rgba(220,38,38,0.12)", border: "rgba(220,38,38,0.4)", dot: "#DC2626" },
      { id: "LL", label: "Low Importance / Low Urgency",    short: "DROP", color: "#9CA3AF", bg: "rgba(156,163,175,0.12)", border: "rgba(156,163,175,0.3)", dot: "#9CA3AF" },
    ];

    // ── Time buckets ──
    const BUCKETS = [
      { id: "quick",  label: "Up to 5 mins",   color: "#22D3EE", bg: "rgba(34,211,238,0.12)", border: "rgba(34,211,238,0.35)" },
      { id: "short",  label: "Up to 30 mins",  color: "#60A5FA", bg: "rgba(96,165,250,0.12)", border: "rgba(96,165,250,0.35)" },
      { id: "medium", label: "Up to 60 mins",  color: "#A78BFA", bg: "rgba(167,139,250,0.12)", border: "rgba(167,139,250,0.35)" },
      { id: "long",   label: "60+ mins",        color: "#F87171", bg: "rgba(248,113,113,0.12)", border: "rgba(248,113,113,0.35)" },
    ];
    function getBucketId(mins) {
      if (!mins || isNaN(mins)) return null;
      if (mins <= 5)  return "quick";
      if (mins <= 30) return "short";
      if (mins <= 60) return "medium";
      return "long";
    }

    // ── Shared styles ──
    const lbl = { fontFamily: "'Montserrat',sans-serif", fontWeight: 900, fontSize: 11, letterSpacing: 1, textTransform: "uppercase" };
    const btnPrimary = { background: C.red, color: "white", border: "none", borderRadius: 4, padding: "11px 28px", ...lbl, cursor: "pointer" };
    const btnBack    = { background: "transparent", borderRadius: 4, padding: "10px 20px", ...lbl, fontSize: 11, cursor: "pointer" };

    function App() {
      // ── localStorage helpers ──
      const STORAGE_KEY = "tapl-focus-engine-session";
      const loadSession = () => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      };
      const saved = loadSession();

      const [step, setStep]         = useState(saved ? saved.step || 1 : 1);
      const [tasks, setTasks]       = useState(saved ? saved.tasks : Array.from({ length: 30 }, (_, i) => ({ id: i+1, text: "", mins: "", quad: "" })));
      const [blocks, setBlocks]     = useState(saved ? saved.blocks : [{ id: 1, items: [], maxMins: 40, breakMins: 10 }]);
      const [splitTasks, setSplitTasks] = useState(saved ? saved.splitTasks : []);

      // ── Categorise view settings ──
      const [catMode, setCatMode] = useState(saved ? saved.catMode || "time" : "time");
      const [catView, setCatView] = useState(saved ? saved.catView || "time" : "time");
      const [completedBlockIds, setCompletedBlockIds] = useState(saved ? saved.completedBlockIds || [] : []);
      const [deferredBlockIds, setDeferredBlockIds]   = useState(saved ? saved.deferredBlockIds  || [] : []);
      const [startTime, setStartTime] = useState(saved ? saved.startTime || "" : "");
      const [endTime, setEndTime]     = useState(saved ? saved.endTime   || "" : "");

      // ── Pomodoro ──
      const [pomBlockIdx, setPomBlockIdx] = useState(0);
      const [pomPhase, setPomPhase]       = useState("work");
      const [pomSecsLeft, setPomSecsLeft] = useState(null);
      const [pomRunning, setPomRunning]   = useState(false);
      const [pomComplete, setPomComplete] = useState(false);
      const [muted, setMuted]             = useState(false);
      const [checkedTaskKeys, setCheckedTaskKeys] = useState({});
      const [showUpNext, setShowUpNext]           = useState(false);
      const [pomTaskIdx, setPomTaskIdx]           = useState(0);
      const [pomTaskSecsLeft, setPomTaskSecsLeft] = useState(null);
      const [taskPromptKey, setTaskPromptKey]     = useState(null);
      const [countdown, setCountdown]             = useState(null);
      const [skippedTaskKeys, setSkippedTaskKeys] = useState({});
      const [themeMode, setThemeMode] = useState(() => {
        try { return localStorage.getItem("tapl-theme") || "dark"; } catch(e) { return "dark"; }
      });
      const T = THEMES[themeMode];
      const activeQuads   = themeMode === "light" ? QUADS_LIGHT   : QUADS;
      const activeBuckets = themeMode === "light" ? BUCKETS_LIGHT : BUCKETS;
      const getBucket = id => activeBuckets.find(b => b.id === id) || activeBuckets[1];
      const quadOf    = id => activeQuads.find(q => q.id === id);
      React.useEffect(() => {
        document.body.style.background = T.bg;
        document.documentElement.style.setProperty("--scrolltrack", T.scrolltrack);
        try { localStorage.setItem("tapl-theme", themeMode); } catch(e) {}
      }, [themeMode]);
      const mutedRef    = useRef(false);
      const timerRef    = useRef(null);
      const deadlineRef = useRef(null);
      const phaseRef    = useRef("work");
      const blockIdxRef = useRef(0);
      const taskIdxRef  = useRef(0);
      const taskDeadlineRef = useRef(null);
      const countdownRef = useRef(null);

      const activeBlocks  = blocks.filter(b => b.items.length > 0 && !deferredBlockIds.includes(b.id));
      const deferredBlocks = blocks.filter(b => b.items.length > 0 && deferredBlockIds.includes(b.id));
      const allBlocksDeferred = blocks.filter(b => b.items.length > 0).length > 0 &&
        blocks.filter(b => b.items.length > 0).every(b => deferredBlockIds.includes(b.id));

      useEffect(() => { phaseRef.current = pomPhase; }, [pomPhase]);
      useEffect(() => { blockIdxRef.current = pomBlockIdx; }, [pomBlockIdx]);
      useEffect(() => { mutedRef.current = muted; }, [muted]);

      // ── Auto-save to localStorage ──
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ step, tasks, blocks, splitTasks, catMode, catView, completedBlockIds, deferredBlockIds, startTime, endTime }));
        } catch(e) {}
      }, [step, tasks, blocks, splitTasks, catMode, catView]);

      // ── Audio — single persistent AudioContext, created on first user gesture ──
      const audioCtxRef = useRef(null);
      const csvInputRef = useRef(null);

      const exportCSV = () => {
        const rows = [["Task","Quadrant","Minutes"]];
        tasks.forEach(t => { if (t.text.trim()) rows.push(['"'+t.text.replace(/"/g,'""')+'"', t.quad||"", t.mins||""]); });
        const csv = rows.map(r => r.join(",")).join("\n");
        const a = document.createElement("a");
        a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
        a.download = "focus-engine-tasks.csv"; a.click();
      };
      const importCSV = e => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const lines = ev.target.result.split("\n").slice(1);
          const imported = lines.map((l,i) => {
            const [text,quad,mins] = l.split(",").map(s => s.replace(/^"|"$/g,"").trim());
            return { id: i+1, text: text||"", quad: quad||"", mins: mins||"" };
          }).filter(t => t.text);
          if (imported.length) setTasks(prev => prev.map((t,i) => imported[i] ? { ...t, ...imported[i], id: t.id } : t));
        };
        reader.readAsText(file);
        e.target.value="";
      };
      const getCtx = () => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        // Resume if browser suspended it (common after inactivity)
        if (audioCtxRef.current.state === "suspended") {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      };

      const playTone = (type) => {
        if (mutedRef.current) return;
        try {
          const ctx = getCtx();
          const now = ctx.currentTime;
          const tones = {
            block_done:   { notes: [660, 880],        delays: [0, 0.25], type: "sine",   gainPeak: 0.4,  decay: 0.6  },
            break_done:   { notes: [440, 440, 440],   delays: [0, 0.18, 0.36], type: "square", gainPeak: 0.15, decay: 0.12 },
            session_done: { notes: [523, 659, 784],   delays: [0, 0.3,  0.6],  type: "sine",   gainPeak: 0.4,  decay: 1.0  },
          };
          const t = tones[type]; if (!t) return;
          t.notes.forEach((freq, i) => {
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = t.type;
            osc.frequency.setValueAtTime(freq, now + t.delays[i]);
            gain.gain.setValueAtTime(0, now + t.delays[i]);
            gain.gain.linearRampToValueAtTime(t.gainPeak, now + t.delays[i] + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + t.delays[i] + t.decay);
            osc.start(now + t.delays[i]);
            osc.stop(now + t.delays[i] + t.decay + 0.1);
          });
        } catch(e) { console.warn("Audio error:", e); }
      };

      // ── 3-2-1-GO countdown ──
      const runCountdown = (onComplete) => {
        clearInterval(countdownRef.current);
        let count = 3;
        setCountdown(count);
        countdownRef.current = setInterval(() => {
          count--;
          if (count > 0) {
            setCountdown(count);
          } else if (count === 0) {
            setCountdown("GO");
          } else {
            clearInterval(countdownRef.current);
            countdownRef.current = null;
            setCountdown(null);
            onComplete();
          }
        }, 800);
      };

      // ── Inner ring: task timer helpers ──
      const startTaskTimer = (blockIdx, taskIdx) => {
        const blk = activeBlocks[blockIdx];
        if (!blk || !blk.items[taskIdx]) {
          // No more tasks — clear inner ring
          taskDeadlineRef.current = null;
          setPomTaskIdx(taskIdx);
          taskIdxRef.current = taskIdx;
          setPomTaskSecsLeft(null);
          return;
        }
        const mins = parseInt(blk.items[taskIdx].mins) || 0;
        setPomTaskIdx(taskIdx);
        taskIdxRef.current = taskIdx;
        if (mins > 0) {
          const secs = mins * 60;
          taskDeadlineRef.current = Date.now() + secs * 1000;
          setPomTaskSecsLeft(secs);
        } else {
          // No duration — show task but don't start a timer, user can skip manually
          taskDeadlineRef.current = null;
          setPomTaskSecsLeft(null);
        }
      };

      const advanceTask = () => {
        const bIdx = blockIdxRef.current;
        const tIdx = taskIdxRef.current;
        const blk  = activeBlocks[bIdx];
        if (!blk) return;
        const item = blk.items[tIdx];
        if (item) {
          // Show completion prompt for this task
          const itmKey = blk.id + ":" + (item.splitId || "task-" + item.taskId);
          setTaskPromptKey(itmKey);
        }
        // Move to next task
        startTaskTimer(bIdx, tIdx + 1);
      };

      const skipTask = () => {
        const bIdx = blockIdxRef.current;
        const tIdx = taskIdxRef.current;
        const blk  = activeBlocks[bIdx];
        if (blk && blk.items[tIdx]) {
          const item = blk.items[tIdx];
          const itmKey = blk.id + ":" + (item.splitId || "task-" + item.taskId);
          setSkippedTaskKeys(prev => ({ ...prev, [itmKey]: true }));
        }
        taskDeadlineRef.current = null;
        startTaskTimer(bIdx, tIdx + 1);
      };

      const advancePhase = () => {
        const phase = phaseRef.current;
        const idx   = blockIdxRef.current;
        if (phase === "work") {
          // Block finished — rewarding double tone
          playTone("block_done");
          // Mark this block as completed so tasks show as done in Step 3
          if (activeBlocks[idx]) markBlockCompleted(activeBlocks[idx].id);
          const blk  = activeBlocks[idx];
          const secs = (blk ? blk.breakMins || 10 : 10) * 60;
          deadlineRef.current = Date.now() + secs * 1000;
          taskDeadlineRef.current = null; setPomTaskSecsLeft(null); setTaskPromptKey(null);
          setPomSecsLeft(secs); setPomPhase("break"); phaseRef.current = "break";
        } else {
          const next = idx + 1;
          if (next >= activeBlocks.length) {
            // All done — celebratory three-note sequence
            playTone("session_done");
            setPomRunning(false); setPomComplete(true); setPomPhase("done"); deadlineRef.current = null; taskDeadlineRef.current = null;
          } else {
            // Break over — countdown then start next block
            playTone("break_done");
            const blk  = activeBlocks[next];
            const secs = (blk.maxMins || 40) * 60;
            setPomRunning(false);
            setPomBlockIdx(next); blockIdxRef.current = next;
            setPomSecsLeft(secs); setPomPhase("work"); phaseRef.current = "work";
            setTaskPromptKey(null);
            setPomTaskIdx(0); taskIdxRef.current = 0; setPomTaskSecsLeft(null); taskDeadlineRef.current = null;
            runCountdown(() => {
              deadlineRef.current = Date.now() + secs * 1000;
              startTaskTimer(next, 0);
              setPomRunning(true);
            });
          }
        }
      };

      useEffect(() => {
        if (!pomRunning || !deadlineRef.current) { clearInterval(timerRef.current); return; }
        timerRef.current = setInterval(() => {
          // Outer ring (block)
          const secsLeft = Math.max(0, Math.round((deadlineRef.current - Date.now()) / 1000));
          setPomSecsLeft(secsLeft);
          // Inner ring (task) — only during work phase
          if (taskDeadlineRef.current && phaseRef.current === "work") {
            const taskSecs = Math.max(0, Math.round((taskDeadlineRef.current - Date.now()) / 1000));
            setPomTaskSecsLeft(taskSecs);
            if (taskSecs <= 0) {
              taskDeadlineRef.current = null;
              advanceTask();
            }
          }
          if (secsLeft <= 0) { clearInterval(timerRef.current); advancePhase(); }
        }, 500);
        return () => clearInterval(timerRef.current);
      }, [pomRunning]);

      const pauseResume = () => setPomRunning(r => {
        if (!r && pomSecsLeft > 0) {
          deadlineRef.current = Date.now() + pomSecsLeft * 1000;
          if (pomTaskSecsLeft > 0) taskDeadlineRef.current = Date.now() + pomTaskSecsLeft * 1000;
        }
        return !r;
      });
      const startSession = () => {
        if (!activeBlocks.length) return;
        // Create/resume AudioContext on this user gesture so it's unlocked for all future tones
        try { getCtx(); } catch(e) {}
        clearInterval(timerRef.current);
        const secs = (activeBlocks[0].maxMins || 40) * 60;
        phaseRef.current = "work"; blockIdxRef.current = 0;
        taskIdxRef.current = 0; setTaskPromptKey(null);
        setPomBlockIdx(0); setPomPhase("work"); setPomSecsLeft(secs); setPomComplete(false); setPomRunning(false); setStep(4);
        setPomTaskIdx(0); setPomTaskSecsLeft(null); taskDeadlineRef.current = null;
        // Countdown then auto-start both block and task timers
        runCountdown(() => {
          deadlineRef.current = Date.now() + secs * 1000;
          startTaskTimer(0, 0);
          setPomRunning(true);
        });
      };
      const skipPhase = () => {
        clearInterval(timerRef.current); setPomRunning(false);
        if (pomPhase === "work") {
          playTone("block_done");
          if (activeBlocks[pomBlockIdx]) markBlockCompleted(activeBlocks[pomBlockIdx].id);
          const blk = activeBlocks[pomBlockIdx];
          const secs = (blk ? blk.breakMins || 10 : 10) * 60;
          deadlineRef.current = Date.now() + secs * 1000;
          taskDeadlineRef.current = null; setPomTaskSecsLeft(null); setTaskPromptKey(null);
          phaseRef.current = "break"; setPomSecsLeft(secs); setPomPhase("break");
          setTimeout(() => setPomRunning(true), 50);
        } else {
          const next = pomBlockIdx + 1;
          if (next >= activeBlocks.length) {
            playTone("session_done");
            deadlineRef.current = null; taskDeadlineRef.current = null; setPomComplete(true); setPomPhase("done");
          } else {
            playTone("break_done");
            const blk = activeBlocks[next];
            const secs = (blk.maxMins || 40) * 60;
            phaseRef.current = "work"; blockIdxRef.current = next;
            setPomBlockIdx(next); setPomSecsLeft(secs); setPomPhase("work");
            setTaskPromptKey(null);
            setPomTaskIdx(0); taskIdxRef.current = 0; setPomTaskSecsLeft(null); taskDeadlineRef.current = null;
            runCountdown(() => {
              deadlineRef.current = Date.now() + secs * 1000;
              startTaskTimer(next, 0);
              setPomRunning(true);
            });
          }
        }
      };
      const resetSession = () => {
        clearInterval(timerRef.current); clearInterval(countdownRef.current);
        deadlineRef.current = null; taskDeadlineRef.current = null; countdownRef.current = null;
        phaseRef.current = "work"; blockIdxRef.current = 0; taskIdxRef.current = 0;
        setPomRunning(false); setPomBlockIdx(0); setPomPhase("work"); setPomComplete(false);
        setPomSecsLeft(activeBlocks.length ? (activeBlocks[0].maxMins || 40) * 60 : null);
        setPomTaskIdx(0); setPomTaskSecsLeft(null); setTaskPromptKey(null); setCountdown(null);
        setCheckedTaskKeys({}); setSkippedTaskKeys({}); setCompletedBlockIds([]);
      };
      const clearSession = () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
        setStep(1);
        setTasks(Array.from({ length: 30 }, (_, i) => ({ id: i+1, text: "", mins: "", quad: "" })));
        setBlocks([{ id: 1, items: [], maxMins: 40, breakMins: 10 }]);
        setSplitTasks([]);
        setCatMode("time");
        setCatView("time");
        resetSession();
      };
      const fmtTime = s => {
        if (s === null) return "--:--";
        return Math.floor(s/60).toString().padStart(2,"0") + ":" + (s%60).toString().padStart(2,"0");
      };

      // ── Task helpers ──
      // Derive completed task IDs from checkedTaskKeys for cross-step display
      const completedTaskIds = React.useMemo(() => {
        const ids = new Set();
        Object.keys(checkedTaskKeys).forEach(key => {
          if (!checkedTaskKeys[key]) return;
          // key format: blockId:task-{taskId} or blockId:{splitId}
          const after = key.split(":")[1] || "";
          if (after.startsWith("task-")) {
            const id = parseInt(after.replace("task-", ""));
            if (!isNaN(id)) ids.add(id);
          } else {
            // splitId format like "split-{taskId}-{part}" — extract taskId
            const m = after.match(/split-(\d+)/);
            if (m) ids.add(parseInt(m[1]));
          }
        });
        return ids;
      }, [checkedTaskKeys]);

      const updateTask = (id, field, val) =>

      const filled = tasks.filter(t => t.text.trim());

      // ── Block helpers ──
      const blockTotal = b => b.items.reduce((s, i) => s + (parseInt(i.mins) || 0), 0);
      const addBlock   = () => setBlocks(prev => [...prev, { id: Date.now(), items: [], maxMins: 40, breakMins: 10 }]);
      const removeBlock = id => setBlocks(prev => prev.filter(b => b.id !== id));
      const updateBlockSetting = (id, field, val) => setBlocks(prev => prev.map(b => b.id === id ? { ...b, [field]: val } : b));

      // ── Split helpers ──
      const splitsByParent = splitTasks.reduce((acc, s) => {
        if (!acc[s.parentId]) acc[s.parentId] = [];
        acc[s.parentId].push(s); return acc;
      }, {});

      // ── Scheduled tracking ──
      // An item placed in a block has a unique key: splitId or "task-{taskId}"
      const allPlacedKeys = blocks.flatMap(b => b.items.map(i => i.splitId || "task-" + i.taskId));
      const taskIsScheduled = t => {
        if (allPlacedKeys.includes("task-" + t.id)) return true;
        const chunks = splitsByParent[t.id];
        return chunks && chunks.length > 0 && chunks.every(c => allPlacedKeys.includes(c.id));
      };
      const available            = filled.filter(t => !taskIsScheduled(t));
      const availableSplitChunks = splitTasks.filter(s => !allPlacedKeys.includes(s.id));

      // ── GLITCH FIX: No drag between blocks. Items can only be removed (returned to available list) ──
      // Drag is only supported FROM the available panel INTO a block — not block-to-block.
      const [dragging, setDragging]   = useState(null);
      const [availSort, setAvailSort] = useState("default");
      const dragTarget = useRef(null);

      const dropOnBlock = blockId => {
        if (!dragging) return;
        if (dragging.type === "split") {
          const chunk = splitTasks.find(s => s.id === dragging.id);
          if (!chunk) { setDragging(null); return; }
          addSplitToBlock(blockId, chunk);
        } else {
          const task = filled.find(t => t.id === dragging.id);
          if (!task) { setDragging(null); return; }
          addToBlock(blockId, task);
        }
        setDragging(null);
      };

      const addToBlock = (blockId, task) => {
        const block = blocks.find(b => b.id === blockId);
        if (!block) return;
        if (blockTotal(block) + (parseInt(task.mins) || 0) > (block.maxMins || MAX_MINS)) return;
        setBlocks(prev => prev.map(b =>
          b.id === blockId ? { ...b, items: [...b.items, { taskId: task.id, text: task.text, mins: task.mins, quad: task.quad }] } : b
        ));
      };
      const addSplitToBlock = (blockId, chunk) => {
        const block = blocks.find(b => b.id === blockId);
        if (!block) return;
        if (blockTotal(block) + chunk.mins > (block.maxMins || MAX_MINS)) return;
        setBlocks(prev => prev.map(b =>
          b.id === blockId ? { ...b, items: [...b.items, { splitId: chunk.id, taskId: chunk.parentId, text: chunk.text, mins: String(chunk.mins), part: chunk.part, totalParts: chunk.totalParts }] } : b
        ));
      };
      // Remove from block — item returns to available list automatically
      const removeFromBlock = (blockId, key) =>
        setBlocks(prev => prev.map(b =>
          b.id === blockId ? { ...b, items: b.items.filter(i => (i.splitId || "task-" + i.taskId) !== key) } : b
        ));

      const splitTask = task => {
        const total = parseInt(task.mins) || 0;
        const totalParts = Math.ceil(total / MAX_MINS);
        let rem = total, part = 1; const chunks = [];
        while (rem > 0) {
          const m = Math.min(rem, MAX_MINS);
          chunks.push({ id: "split-" + task.id + "-" + part, parentId: task.id, text: task.text, mins: m, part, totalParts });
          rem -= m; part++;
        }
        setSplitTasks(prev => [...prev.filter(s => s.parentId !== task.id), ...chunks]);
      };
      const unsplitTask = taskId => {
        setSplitTasks(prev => prev.filter(s => s.parentId !== taskId));
        setBlocks(prev => prev.map(b => ({ ...b, items: b.items.filter(i => !(i.splitId && i.taskId === taskId)) })));
      };


      // ── Toggle block defer state ──
      const toggleDefer = (blockId) => {

        );
